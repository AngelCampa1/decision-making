# Local git hooks: the first two of the three arenas `de check` runs in.
# `pre-commit` runs the `--fast` subset, `pre-push` runs everything, and
# `.github/workflows/check.yml` runs everything again on pull requests and
# pushes to `main`.
#
# The third arena is not redundant, which was the original argument for not
# having it. A hook checks a *working directory*; CI checks a *commit*, on a
# clean clone. The first CI run went red on a tree whose local gate was green,
# which is the difference stated as a measurement rather than an opinion.
#
# Install both stages once:
#   python -m uv run pre-commit install
#   python -m uv run pre-commit install --hook-type pre-push
#
# `uv` is invoked as `python -m uv` because pip-installed uv does not land on
# PATH on Windows.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # `.playwright-mcp/` holds browser accessibility dumps, not configuration.
      # They are machine-written, they are not read by anything in this
      # repository, and two of them carry the YAML `=` value tag, which
      # PyYAML's safe loader refuses to construct -- so `check-yaml` fails on
      # them permanently and `trailing-whitespace` rewrites them on every run.
      # Because pre-commit fails a run whose hooks modified files, a directory
      # nothing depends on was blocking every push of unrelated work.
      #
      # Scoping the two hooks off it is the fix, not an exemption: neither was
      # written to validate a snapshot dump. Whether the directory should be
      # tracked at all is a separate question for whoever owns it.
      - id: check-yaml
        exclude: ^\.playwright-mcp/
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^\.playwright-mcp/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]

  - repo: local
    hooks:
      # Fast subset on every commit: lint, types, skill validation, and the
      # commit-attribution guard. Under a few seconds, so it does not train
      # anyone to reach for --no-verify.
      - id: de-check-fast
        name: de check --fast (lint, types, git identity, skill lint)
        entry: python -m uv run de check --fast
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # Everything on push: tests, coverage floors, golden files.
      - id: de-check
        name: de check (full gate, including tests and coverage floors)
        entry: python -m uv run de check
        language: system
        pass_filenames: false
        stages: [pre-push]
