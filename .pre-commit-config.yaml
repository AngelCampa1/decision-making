# Local git hooks: the first two of the three arenas `de check` runs in.
# `pre-commit` runs the `--fast` subset, `pre-push` runs everything, and
# `.github/workflows/check.yml` runs everything again on pull requests and
# pushes to `main`.
#
# The third arena is not redundant, which was the original argument for not
# having it. A hook checks a *working directory*; CI checks a *commit*, on a
# clean clone. The first CI run went red on a tree whose local gate was green,
# which is the difference stated as a measurement rather than an opinion.
#
# Install both stages once:
#   python -m uv run pre-commit install
#   python -m uv run pre-commit install --hook-type pre-push
#
# `uv` is invoked as `python -m uv` because pip-installed uv does not land on
# PATH on Windows.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # `.playwright-mcp/` holds browser accessibility dumps, not configuration.
      # They are machine-written, they are not read by anything in this
      # repository, and two of them carry the YAML `=` value tag, which
      # PyYAML's safe loader refuses to construct -- so `check-yaml` fails on
      # them permanently and `trailing-whitespace` rewrites them on every run.
      # Because pre-commit fails a run whose hooks modified files, a directory
      # nothing depends on was blocking every push of unrelated work.
      #
      # Scoping the two hooks off it is the fix, not an exemption: neither was
      # written to validate a snapshot dump. Whether the directory should be
      # tracked at all is a separate question for whoever owns it.
      - id: check-yaml
        exclude: ^\.playwright-mcp/
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^\.playwright-mcp/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]

  - repo: local
    hooks:
      # Fast subset on every commit: lint, types, skill validation, and the
      # commit-attribution guard. Under a few seconds, so it does not train
      # anyone to reach for --no-verify.
      - id: de-check-fast
        name: de check --fast (lint, types, git identity, skill lint)
        entry: python -m uv run de check --fast
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # Everything on push: tests, coverage floors, golden files.
      - id: de-check
        name: de check (full gate, including tests and coverage floors)
        entry: python -m uv run de check
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Refuses a commit on `main` while `main` is behind `origin/main`, after
      # 2026-08-19, when a failed branch switch left the shared checkout on a
      # `main` that was 47 commits stale. Narrow by design: work here happens
      # on branches and merges to `main`, so committing directly onto a stale
      # `main` is already the anomaly, and the hook is silent on every branch.
      #
      # It runs `git` and nothing else, so it does not pay uv's startup cost.
      # The fetch it attempts is best-effort and time-boxed -- offline still
      # commits, against whatever remote ref is already on disk. "Time-boxed"
      # was a promise rather than a fact until 2026-08-20: `subprocess.run`
      # kills the child on timeout and then drains the pipes a transport helper
      # is still holding, so a 10-second fetch measured 60 seconds. The fetch
      # now asks for no pipes.
      #
      # `stages: [pre-commit]` is the whole list, and `pre-merge-commit` is
      # deliberately absent -- so this does NOT run on a clean merge. That is
      # correct rather than an oversight: a merge is integration, not new work,
      # and the script is silent during one anyway (MERGE_HEAD, rebase state
      # and friends). Adding the stage would only reintroduce the loop it was
      # taken out of, where the hook refused the merge that was resolving the
      # drift and then advised a command git will not run mid-merge.
      #
      # `origin` is hardcoded in the script. On a repository whose remote is
      # named otherwise, or where `remote.origin.fetch` is unset, this check
      # fails open and silently -- green here is not evidence.
      #
      # The same script carries a `--doctor` mode for `core.bare`, which is
      # deliberately *not* wired here: with `core.bare = true` git aborts the
      # commit before any hook runs, so no stage can reach it. See the module
      # docstring.
      - id: git-hygiene
        name: git hygiene (main not behind origin/main)
        entry: python scripts/check_git_hygiene.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
