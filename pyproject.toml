[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision-evals"
version = "0.1.0"
description = "Evaluation harness for measuring whether agent decision skills actually work"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Angel Campa" }]
keywords = [
    "evaluation",
    "agent-skills",
    "llm",
    "decision-making",
    "calibration",
    "skill-evaluation",
    "pre-registration",
    "placebo-controlled",
    "ai-agents",
]

# Development Status is 2 - Pre-Alpha and stays there until a skill carries a
# verdict. `SCORECARD.md` reads "proven: 0 / shipped: 0"; a classifier claiming
# Beta would be the same overclaim one metadata layer down.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
]

# No optional dependencies. `inspect-ai` was declared here from the task #6 spike
# that compared it against a hand-rolled `claude -p` provider; the provider won,
# and the declaration outlived the decision without ever being imported. A
# dependency nothing imports is a claim about the design that the code contradicts
# -- anyone reading pyproject would reasonably conclude this harness is built on
# Inspect. It is not: see providers/claude_code.py and the Track 0 design call to
# script the orchestrator rather than use a framework's dispatch.

[project.scripts]
de = "decision_evals.cli:app"

[project.urls]
Homepage = "https://angelcampa1.github.io/decision-making-skills/"
Repository = "https://github.com/AngelCampa1/decision-making-skills"
Documentation = "https://github.com/AngelCampa1/decision-making-skills/blob/main/docs/README.md"
Issues = "https://github.com/AngelCampa1/decision-making-skills/issues"
Changelog = "https://github.com/AngelCampa1/decision-making-skills/blob/main/docs/STATUS.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.hatch.build.targets.wheel]
packages = ["evals/src/decision_evals"]

# --------------------------------------------------------------------------- #
# Lint / format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["evals/src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "PT",       # pytest style
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",
]
ignore = [
    "E501",  # line length is handled by the formatter
]

# Statistical notation in docstrings is deliberate and clearer than the ASCII
# fallback: a real minus sign in "Reliability − Resolution", Greek letters for
# the usual error rates. Allow them rather than degrading the prose.
allowed-confusables = ["−", "α", "β", "ρ", "σ", "Δ", "×", "≥", "≤", "π", "ψ", "δ"]

[tool.ruff.lint.per-file-ignores]
# Property-based tests deliberately use single-letter mathematical names.
"tests/**" = ["N806", "N803"]

# --------------------------------------------------------------------------- #
# Types
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_generics = true
mypy_path = "evals/src"
packages = ["decision_evals"]

[[tool.mypy.overrides]]
# These ship without complete stubs.
module = ["statsmodels.*", "scipy.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Tests
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["evals/src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "llm: requires a live model backend; never runs in `de check`",
    "slow: long-running (e.g. CI-coverage simulation); excluded from the default run",
]

# --------------------------------------------------------------------------- #
# Coverage
#
# The global floor is 95%, but a global number can hide a 40%-covered stats
# module behind a 100%-covered CLI. Per-module floors are enforced separately by
# scripts/check_coverage_floors.py reading coverage.json.
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["evals/src/decision_evals"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "if __name__ == .__main__.:",
]

[tool.coverage.json]
output = "coverage.json"

# --------------------------------------------------------------------------- #
# Per-module coverage floors, enforced by scripts/check_coverage_floors.py.
#
# A global 95% can hide a 40%-covered stats module behind a 100%-covered CLI, so
# the modules whose failure would corrupt a published number rather than crash
# carry stricter floors. Patterns are substring matches on the file path; the
# longest match wins.
# --------------------------------------------------------------------------- #
[tool.decision-evals.coverage-floors]
# Every published number flows through here. Non-negotiable.
"decision_evals/stats" = { line = 100.0, branch = 100.0 }
# Integrity locks: every refusal branch needs a test asserting it refuses.
"decision_evals/prereg.py" = { line = 100.0, branch = 100.0 }
"decision_evals/arenas.py" = { line = 100.0, branch = 100.0 }
"decision_evals/budget.py" = { line = 100.0, branch = 100.0 }
# The two gates over the method itself, added 2026-08-13. `provenance` binds a
# published README to the records beside it and to the commit that registered
# its prediction; `wiring` is the check that would have caught `prereg.py`
# sitting at 100% coverage with no caller. A refusal branch here that nothing
# exercises is the same defect one level up.
"decision_evals/provenance.py" = { line = 100.0, branch = 100.0 }
"decision_evals/wiring.py" = { line = 100.0, branch = 100.0 }
# The register coupling the answer key and the shipped skill to a written
# reason. A label move is invisible in a checkpoint and shifts every number
# computed from it.
"decision_evals/decisions.py" = { line = 100.0, branch = 100.0 }
# The gate over the front door. Documentation was the last obligation here
# checked by reading it, and the README was found naming two commands that do
# not exist and a directory that never has.
"decision_evals/docs.py" = { line = 100.0, branch = 100.0 }
# A generator bug silently changes the benchmark rather than failing loudly.
"decision_evals/providers" = { line = 100.0, branch = 100.0 }
"decision_evals/generators" = { line = 98.0, branch = 95.0 }
# Same argument for a corpus we did not author: every refusal in here is what
# stops a changed benchmark from being loaded as though it were the pinned one.
"decision_evals/corpora" = { line = 100.0, branch = 100.0 }
# Track A1's runner. Its refusals are the design: the full condition may never
# be built from joined shards, and no record may carry a verdict.
"decision_evals/sharded.py" = { line = 100.0, branch = 100.0 }
# The scripted call tree, and the instrument for Tracks B through F. Every
# uncovered branch here is an attribution this repository could make and get
# wrong: an ablation that silently did nothing, a receipt that was never
# asserted at a leaf, a transformed report the record does not mention.
"decision_evals/orchestrator.py" = { line = 100.0, branch = 100.0 }
# The three fairness invariants live here: format contract in every arm, option
# menu held constant, placebo matched. Each fails silently if it regresses.
"decision_evals/solvers" = { line = 100.0, branch = 100.0 }
# Resumability: a checkpoint that silently re-runs or silently skips corrupts
# the result rather than merely wasting time.
"decision_evals/runner.py" = { line = 100.0, branch = 100.0 }
# Parse paths and failure paths must both be exercised.
"decision_evals/scorers" = { line = 95.0, branch = 90.0 }
"decision_evals/plugin" = { line = 95.0, branch = 90.0 }
# Argument wiring, exercised through integration tests.
"decision_evals/cli.py" = { line = 85.0, branch = 75.0 }

# --------------------------------------------------------------------------- #
# Integrity locks that no entry point reaches yet.
#
# A coverage floor says a module's failure would corrupt a published number. It
# does not say the module runs, and this repository has conflated the two twice
# -- `triggers` was tested to 100% and called by nothing while a trigger set
# described a skill that no longer existed. `de check` now refuses a floored
# module that nothing imports, so an intentional gap has to be declared here
# with the condition that would close it.
#
# The register may only shrink. An entry that becomes reachable is an error:
# a note that outlives the situation it describes is how the last two dead
# integrity modules stayed invisible.
# --------------------------------------------------------------------------- #
[tool.decision-evals.unwired]
"decision_evals.prereg" = """
Scoped to the `confirm` arena, which has never run: every call on record is a \
`screen`-tier trigger measurement. Wired when the first confirmation runner \
exists, which is also when the first `preregistration/<skill>-v<n>.yaml` is \
written. Until then `docs/PROTOCOL.md` section 3 must describe this gate in \
the conditional, and the standing pre-registration for `dev` and `screen` runs \
is the dated notebook prediction that `de check`'s run-provenance step \
enforces.\
"""

# --------------------------------------------------------------------------- #
# Commands the documentation names while they deliberately do not exist.
#
# `SCORECARD.md` has to be able to say that `de report` has never existed --
# a true sentence containing a reference that does not resolve. Without this
# register the documentation gate would refuse the correction and reward the
# claim it replaced.
#
# Same rule as `unwired`: it may only shrink, an entry that becomes a real
# command is an error, and an entry named nowhere in the documentation is a
# line to delete.
# --------------------------------------------------------------------------- #
[tool.decision-evals.docs-absent-commands]
"screen" = """
Named in `README.md`, which corrects its own instruction to run it. `screen` is \
an arena in `decision_evals.arenas`, never a command; the runner for every \
`screen`-tier call on record is `scripts/run_triggers.py`. Becomes a command \
if and when the arena gets a runner behind the CLI.\
"""
"confirm" = """
Named in `README.md` for the same reason as `screen`, and the sharper of the \
two: the `confirm` arena is the only one that emits a verdict, and it has never \
run. Built alongside the first confirmation runner, which is also what would \
wire `decision_evals.prereg`.\
"""
"report" = """
Named in `SCORECARD.md`, which opens by correcting its own claim to have been \
generated by it. There is no `de report`, no `results/**/summary.json`, and no \
scorecard step in `de check`. Built when the first confirmatory run lands and \
there is a results schema to generate against; until then the correction has \
to be able to name the thing it is correcting.\
"""
