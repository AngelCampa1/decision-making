[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision-evals"
version = "0.1.0"
description = "Eval harness for LLM and agent evaluation: pre-registered experiments enforced by git ancestry, LLM-as-a-judge panels scored for inter-rater reliability, and exact resampling statistics"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Angel Campa" }]
keywords = [
    "evaluation",
    "eval-harness",
    "evaluation-harness",
    "llm-evaluation",
    "agent-evaluation",
    "agentic-evaluation",
    "llm-as-a-judge",
    "model-graded-evaluation",
    "benchmark",
    "golden-dataset",
    "inter-rater-reliability",
    "tool-use-evaluation",
    "function-calling",
    "agent-skills",
    "skill-routing",
    "skill-evaluation",
    "ai-agents",
    "multi-agent",
    "llm",
    "calibration",
    "experimental-design",
    "ablation-study",
    "placebo-controlled",
    "pre-registration",
    "statistical-analysis",
    "regression-testing",
    "observability",
    "opentelemetry",
    "reproducible-research",
    "prompt-engineering",
    "context-engineering",
    "decision-making",
]

# Development Status is 2 - Pre-Alpha and stays there until a skill carries a
# verdict. `SCORECARD.md` reads "proven: 0 / shipped: 0"; a classifier claiming
# Beta would be the same overclaim one metadata layer down.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
]

# No optional dependencies. `inspect-ai` was declared here from the task #6 spike
# that compared it against a hand-rolled `claude -p` provider; the provider won,
# and the declaration outlived the decision without ever being imported. A
# dependency nothing imports is a claim about the design that the code contradicts
# -- anyone reading pyproject would reasonably conclude this harness is built on
# Inspect. It is not: see providers/claude_code.py and the Track 0 design call to
# script the orchestrator rather than use a framework's dispatch.

[project.scripts]
de = "decision_evals.cli:app"

[project.urls]
Homepage = "https://angelcampa1.github.io/decision-making-skills/"
Repository = "https://github.com/AngelCampa1/decision-making-skills"
Documentation = "https://github.com/AngelCampa1/decision-making-skills/blob/main/docs/README.md"
Issues = "https://github.com/AngelCampa1/decision-making-skills/issues"
Changelog = "https://github.com/AngelCampa1/decision-making-skills/blob/main/docs/STATUS.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0.12.20260724",
]

# There is no `docs` group any more. It held `ghp-import`, which existed so a
# laptop could force-push `gh-pages`. Publishing moved to
# `.github/workflows/deploy-site.yml` on 2026-08-19 and nothing local publishes,
# so `uv sync --group dev` is now the whole install.

[tool.hatch.build.targets.wheel]
packages = ["evals/src/decision_evals"]

# --------------------------------------------------------------------------- #
# Lint / format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["evals/src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "PT",       # pytest style
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",
]
ignore = [
    "E501",  # line length is handled by the formatter
]

# Statistical notation in docstrings is deliberate and clearer than the ASCII
# fallback: a real minus sign in "Reliability − Resolution", Greek letters for
# the usual error rates. Allow them rather than degrading the prose.
allowed-confusables = ["−", "α", "β", "ρ", "σ", "Δ", "×", "≥", "≤", "π", "ψ", "δ"]

[tool.ruff.lint.per-file-ignores]
# Property-based tests deliberately use single-letter mathematical names.
"tests/**" = ["N806", "N803"]

# --------------------------------------------------------------------------- #
# Types
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_generics = true
mypy_path = "evals/src"
packages = ["decision_evals"]

[[tool.mypy.overrides]]
# These ship without complete stubs.
module = ["statsmodels.*", "scipy.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Tests
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["evals/src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "llm: requires a live model backend; never runs in `de check`",
    "slow: long-running (e.g. CI-coverage simulation); excluded from the default run",
]

# --------------------------------------------------------------------------- #
# Coverage
#
# The global floor is 95%, but a global number can hide a 40%-covered stats
# module behind a 100%-covered CLI. Per-module floors are enforced separately by
# scripts/check_coverage_floors.py reading coverage.json.
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["evals/src/decision_evals"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "if __name__ == .__main__.:",
]

[tool.coverage.json]
output = "coverage.json"

# --------------------------------------------------------------------------- #
# Per-module coverage floors, enforced by scripts/check_coverage_floors.py.
#
# A global 95% can hide a 40%-covered stats module behind a 100%-covered CLI, so
# the modules whose failure would corrupt a published number rather than crash
# carry stricter floors. Patterns are substring matches on the file path; the
# longest match wins.
# --------------------------------------------------------------------------- #
[tool.decision-evals.coverage-floors]
# Every published number flows through here. Non-negotiable.
"decision_evals/stats" = { line = 100.0, branch = 100.0 }
# Integrity locks: every refusal branch needs a test asserting it refuses.
"decision_evals/prereg.py" = { line = 100.0, branch = 100.0 }
"decision_evals/arenas.py" = { line = 100.0, branch = 100.0 }
"decision_evals/budget.py" = { line = 100.0, branch = 100.0 }
# The two gates over the method itself, added 2026-08-13. `provenance` binds a
# published README to the records beside it and to the commit that registered
# its prediction; `wiring` is the check that would have caught `prereg.py`
# sitting at 100% coverage with no caller. A refusal branch here that nothing
# exercises is the same defect one level up.
"decision_evals/provenance.py" = { line = 100.0, branch = 100.0 }
"decision_evals/wiring.py" = { line = 100.0, branch = 100.0 }
# The register coupling the answer key and the shipped skill to a written
# reason. A label move is invisible in a checkpoint and shifts every number
# computed from it.
"decision_evals/decisions.py" = { line = 100.0, branch = 100.0 }
# The changelog under that register, added 2026-08-20. `decisions.py` proves a
# governed commit was explained in prose; this proves every version the answer
# key reached says which labels moved into it, in a form that can be joined
# against a record. Same class of failure, one level finer, and the refusals
# here are the whole module.
"decision_evals/corrections.py" = { line = 100.0, branch = 100.0 }
# The gate over the answer key itself, added 2026-08-21. `corrections.py`
# proves a version bump says which labels moved; this proves the labels were
# ever checked by anyone but their author. Version 5 shipped 72 unadjudicated
# items on 2026-08-20 under a register entry saying no number could be
# published against them. The incident is in `docs/WHY_THESE_RULES.md`.
"decision_evals/adjudication.py" = { line = 100.0, branch = 100.0 }
# The gate over the front door. Documentation was the last obligation here
# checked by reading it, and the README was found naming two commands that do
# not exist and a directory that never has.
"decision_evals/docs.py" = { line = 100.0, branch = 100.0 }
# The gate over the published site. It renders the markdown in this repository
# in place rather than copying it, which is what stops a second STATUS.md
# existing to disagree with the first -- and what makes every build a snapshot
# that goes stale silently. A refusal branch here that nothing exercises is a
# published page quietly disagreeing with the repository.
"decision_evals/site.py" = { line = 100.0, branch = 100.0 }
"decision_evals/sync.py" = { line = 100.0, branch = 100.0 }
"decision_evals/drift.py" = { line = 100.0, branch = 100.0 }
# The gate over the numbers the site publishes. `site.py` proves the pages were
# rebuilt from the current tree and `docs.py` proves their references resolve;
# neither opens a `.astro` file, so between them a page said the skill had four
# procedures while `SKILL.md` routed to six and every step reported green. This
# binds a published value to the sentence it came from, and a refusal branch
# that nothing exercises is that failure with a guard installed and inert --
# which has already happened once here, to `latest`.
"decision_evals/claims.py" = { line = 100.0, branch = 100.0 }
# The other half of the label-version guard. `label_versions_comparable` refuses
# a comparison across a key revision; this is what makes the refusal satisfiable
# and what stops an unstamped record reaching a stamped one unnoticed. A wrong
# branch here republishes a number under the wrong answer key.
"decision_evals/rescore.py" = { line = 100.0, branch = 100.0 }
# The only online check here, and the one that answers what visitors actually
# get. Every branch in it is a different reading of the live site -- current,
# behind, built against a stale manifest, or unaskable -- and collapsing the
# last of those into either of the others is the failure this module was added
# to remove, one level up.
"decision_evals/deployed.py" = { line = 100.0, branch = 100.0 }
# A generator bug silently changes the benchmark rather than failing loudly.
"decision_evals/providers" = { line = 100.0, branch = 100.0 }
"decision_evals/generators" = { line = 98.0, branch = 95.0 }
# Same argument for a corpus we did not author: every refusal in here is what
# stops a changed benchmark from being loaded as though it were the pinned one.
"decision_evals/corpora" = { line = 100.0, branch = 100.0 }
# Track A1's runner. Its refusals are the design: the full condition may never
# be built from joined shards, and no record may carry a verdict.
"decision_evals/sharded.py" = { line = 100.0, branch = 100.0 }
# The scripted call tree, and the instrument for Tracks B through F. Every
# uncovered branch here is an attribution this repository could make and get
# wrong: an ablation that silently did nothing, a receipt that was never
# asserted at a leaf, a transformed report the record does not mention.
"decision_evals/orchestrator.py" = { line = 100.0, branch = 100.0 }
# The three fairness invariants live here: format contract in every arm, option
# menu held constant, placebo matched. Each fails silently if it regresses.
"decision_evals/solvers" = { line = 100.0, branch = 100.0 }
# Resumability: a checkpoint that silently re-runs or silently skips corrupts
# the result rather than merely wasting time.
"decision_evals/runner.py" = { line = 100.0, branch = 100.0 }
# Parse paths and failure paths must both be exercised.
"decision_evals/scorers" = { line = 95.0, branch = 90.0 }
"decision_evals/plugin" = { line = 95.0, branch = 90.0 }
# Argument wiring, exercised through integration tests.
"decision_evals/cli.py" = { line = 85.0, branch = 75.0 }

# --------------------------------------------------------------------------- #
# Which answer key each pre-versioning checkpoint was scored against.
#
# `set_version` was added to the runner on 2026-08-13 in `903169c`, after every
# arm below had already run. `label_versions_comparable` defaults an absent one
# to 1, which is true and silent, and `de rescore` will not act on a default:
# stamping a record is writing a fact into the file, so the fact is derived once
# and written here where the derivation can be read.
#
# **Derived, not assumed from the dates.** The runner bakes `should_fire` into
# every row at write time, so each checkpoint carries the key it was scored
# against inside itself. Every file below agrees with the version 1 labels on
# all 73 cases and disagrees with version 2 on exactly `x-n21` -- the turn the
# maintainer moved from the positives to the negatives in `d43c490`. Version 2
# was tagged five minutes later in `903169c`, so no run could have been scored
# against v2 without being stamped.
#
# The table stays after the stamping. `results/triggers/verdicts.jsonl` is
# tracked in git in its unstamped form at `1bd87b8`, so a checkout restores a
# file with no version in it, and the derivation has to survive that. A line may
# be added only for a checkpoint that carries no `set_version`, and removed only
# when its checkpoint is.
# --------------------------------------------------------------------------- #
[tool.decision-evals.unstamped-checkpoints]
"verdicts.jsonl" = 1
"verdicts-four.jsonl" = 1
"verdicts-2-entries.jsonl" = 1
"verdicts-confidence.jsonl" = 1
"verdicts-opener-only.jsonl" = 1
"verdicts-no-opener.jsonl" = 1
"verdicts-no-exclusions.jsonl" = 1
"verdicts-pairing-ledger+cascade-fit+timing.jsonl" = 1
"verdicts-pairing-ledger+timing-fit+cascade.jsonl" = 1

# --------------------------------------------------------------------------- #
# Integrity locks that no entry point reaches yet.
#
# A coverage floor says a module's failure would corrupt a published number. It
# does not say the module runs, and this repository has conflated the two twice
# -- `triggers` was tested to 100% and called by nothing while a trigger set
# described a skill that no longer existed. `de check` now refuses a floored
# module that nothing imports, so an intentional gap has to be declared here
# with the condition that would close it.
#
# The register may only shrink. An entry that becomes reachable is an error:
# a note that outlives the situation it describes is how the last two dead
# integrity modules stayed invisible.
# --------------------------------------------------------------------------- #
[tool.decision-evals.unwired]
"decision_evals.prereg" = """
Scoped to the `confirm` arena, which has never run: every call on record is a \
`screen`-tier trigger measurement. Wired when the first confirmation runner \
exists, which is also when the first `preregistration/<skill>-v<n>.yaml` is \
written. Until then `docs/PROTOCOL.md` section 3 must describe this gate in \
the conditional, and the standing pre-registration for `dev` and `screen` runs \
is the dated notebook prediction that `de check`'s run-provenance step \
enforces.\
"""

# --------------------------------------------------------------------------- #
# Commands the documentation names while they deliberately do not exist.
#
# `SCORECARD.md` has to be able to say that `de report` has never existed --
# a true sentence containing a reference that does not resolve. Without this
# register the documentation gate would refuse the correction and reward the
# claim it replaced.
#
# Same rule as `unwired`: it may only shrink, an entry that becomes a real
# command is an error, and an entry named nowhere in the documentation is a
# line to delete.
# --------------------------------------------------------------------------- #
# --------------------------------------------------------------------------- #
# Paths the documentation names inside a *different* repository.
#
# The path gate resolves any backticked fragment whose first segment is a real
# top-level directory against this root. That is right for the paths this
# repository documents and wrong for the ones it describes in others, and the
# difference is invisible to the regex.
#
# Same rules as `unwired` and `docs-absent-commands`: it may only shrink, an
# entry that starts resolving here is an error, and an entry named nowhere in
# the documentation is a line to delete.
# --------------------------------------------------------------------------- #
[tool.decision-evals.docs-external-paths]

[tool.decision-evals.docs-absent-commands]
"screen" = """
Named in `docs/WHY_THESE_RULES.md`, which holds the correction that `README.md` \
used to carry. `screen` is an arena in `decision_evals.arenas`, never a \
command; the runner for every `screen`-tier call on record is \
`scripts/run_triggers.py`. Becomes a command if and when the arena gets a \
runner behind the CLI. Moved out of `README.md` on 2026-08-20, when the \
corrections-in-place went to the notebook where a dated record belongs.\
"""
"confirm" = """
Named in `docs/WHY_THESE_RULES.md` for the same reason as `screen`, and the \
sharper of the two: the `confirm` arena is the only one that emits a verdict, \
and it has never run. Built alongside the first confirmation runner, which is \
also what would wire `decision_evals.prereg`.\
"""
"report" = """
Named in `docs/WHY_THESE_RULES.md`, which records that `SCORECARD.md` once \
claimed to be generated by it. There is no `de report`, no \
`results/**/summary.json`, and no scorecard step in `de check`. Built when the \
first confirmatory run lands and there is a results schema to generate \
against; until then the correction has to be able to name the thing it is \
correcting.\
"""

# --------------------------------------------------------------------------- #
# Paths the documentation names while `.gitignore` deliberately excludes them.
#
# Added 2026-08-19, when `de check` was first run against a clean clone rather
# than a working directory. Append-only run checkpoints cannot be committed
# mid-run, so `results/track-0/` and `results/triggers/` are ignored by a
# decision this file already records. The consequence nobody had noticed is
# that a document naming a file under either can never resolve for anyone who
# clones the repository, and the gate was right to refuse it.
#
# One refusal, not two, and the asymmetry with `docs-absent-commands` above is
# deliberate. That register errors on an entry that becomes real, because the
# command registry is in the source tree and so is true on every machine. A
# path here exists for whoever ran the experiment and not on a clean clone, so
# existence proves nothing -- gating on it would put the check red locally and
# green in CI, which is this register's own bug inverted. What remains: it may
# only shrink, and an entry named nowhere in the documentation is a line to
# delete.
#
# It is empty, and it was emptied the same day it was written. Both original
# entries, `results/track-0/tree_smoke.jsonl` and
# `results/triggers/adjudication.jsonl`, were closed by e6ba411, which committed
# the two files instead. That is the better fix and it is worth saying why:
# declaring a path here only stops the gate asking, while committing the file
# means whoever clones this actually gets the evidence the sentence rests on.
# Prefer `git add -f` whenever the file may be committed at all.
#
# The register stays for the case where it may not, and that case arrived the
# same day. A build artefact can never be committed: `.venv/Scripts/de.exe` is
# Windows-only -- a Linux checkout has `.venv/bin/de` -- and `site/node_modules`
# is installed per checkout and by design absent from the job that runs the
# gate. Both are named in living documents for good reasons, and the first CI
# run refused all three references. Committing them is not an option, so this
# is the table's purpose rather than a workaround for it.
#
# `datasets/holdout/*.jsonl` is the other shape and has not needed an entry yet:
# ignored on purpose until a verdict publishes, so a document naming the holdout
# has no committable file behind it either.
# --------------------------------------------------------------------------- #
[tool.decision-evals.docs-ignored-paths]
".venv/Scripts/de.exe" = """
Named in `docs/AUTONOMOUS_WORK_ORDER.md` and `docs/WHY_THESE_RULES.md`, which \
explain why parallel sessions cannot share one virtualenv: a second gate gets \
`os error 32` while the first holds this file open. The path is Windows-only \
and the environment is a build artefact, so it exists on the machine that hit \
the problem and can never be committed anywhere. `AGENTS.md` named it until \
2026-08-20, when the incident record moved out of it.\
"""
"site/node_modules" = """
Named in `docs/AUTONOMOUS_WORK_ORDER.md` as one of the per-checkout costs of \
working in a worktree. Installed by `npm ci` and ignored by `.gitignore`; the \
job that runs `de check` never installs it, because the site staleness gate is \
a pure-Python hash comparison and only the deploy workflow builds.\
"""
"site/node_modules/" = """
The same directory with a trailing slash, which the same sentence also uses. \
Two spellings of one path rather than two paths.\
"""

# --------------------------------------------------------------------------- #
# When each living document was last read, and by which commit.
#
# `de drift` counts the commits since that point which touched a path the
# document names, and `de check` refuses one that has gone past the ceiling in
# `decision_evals.drift`. This is the only register here whose entries a person
# has to earn by reading; nothing stops a rubber stamp, and the claim is only
# that the obligation is now visible and dated.
#
# Baselined 2026-08-21 at each document's own last-touched commit, which is the
# strongest claim the history actually supports: whoever last edited a document
# had read it. Generated documents are absent by rule, not by omission.
#
# Two directions, like every other register: a living document with no entry is
# refused, and an entry naming no living document is refused.
# --------------------------------------------------------------------------- #
[tool.decision-evals.reviewed]
"AGENTS.md" = "76f4974"
"CONTRIBUTING.md" = "76f4974"
"README.md" = "650dcbc"
"SCORECARD.md" = "291548d"
"docs/ACCUMULATION_VENUE.md" = "291548d"
"docs/ARCHITECTURE.md" = "76f4974"
"docs/AUTONOMOUS_WORK_ORDER.md" = "6e93647"
"docs/DECISION_FRAMEWORKS.md" = "291548d"
"docs/DOCUMENTATION_MAP.md" = "76f4974"
"docs/EVAL_SET_DATASHEET.md" = "291548d"
"docs/FAILURE_TAXONOMY.md" = "291548d"
"docs/HARNESS_DISCLOSURE.md" = "291548d"
"docs/LIMITATIONS.md" = "6e93647"
"docs/METHODS.md" = "6e93647"
"docs/PROTOCOL.md" = "291548d"
"docs/README.md" = "650dcbc"
"docs/REJECTED.md" = "291548d"
"docs/RELATED_WORK.md" = "291548d"
"docs/RESEARCH_PROGRAMME.md" = "6e93647"
"docs/STATUS.md" = "650dcbc"
"docs/TAILORING_CORPUS_SPEC.md" = "291548d"
"docs/VOICE.md" = "650dcbc"
"docs/WHY_THESE_RULES.md" = "650dcbc"
"docs/programme/part-1-what-is-already-known.md" = "650dcbc"
"docs/programme/part-2-the-product.md" = "650dcbc"
"docs/programme/part-3-the-instrument.md" = "650dcbc"
"docs/programme/part-4-does-the-failure-exist.md" = "650dcbc"
"docs/programme/part-5-where-a-skill-helps.md" = "650dcbc"
"docs/programme/part-6-confirmation.md" = "650dcbc"
"docs/programme/part-7-cross-cutting.md" = "650dcbc"
"docs/programme/part-8-output.md" = "650dcbc"
"docs/reviews/COLD_READER.md" = "3c8cb5e"
"docs/reviews/HOUSE_STYLE.md" = "291548d"
"docs/reviews/POSITIONING.md" = "291548d"
"docs/superpowers/drafts/s9-ledger-replacement/README.md" = "650dcbc"
"docs/superpowers/drafts/s9-ledger-replacement/widen.md" = "650dcbc"
