template_id: rel-008-contract-renew
question: "Should the team renew the {tool} contract as offered, or renegotiate?"
options: [renew, renegotiate]

variables:
  tool: {choice: [Beacon, Lantern, Compass, Quarry]}
  seats_paid: {int: [20, 500]}
  seats_used: {int: [10, 520]}
  utilisation_floor: {int: [60, 95]}
  buyer: {choice: [Procurement, Finance, Engineering]}
  years: {int: [1, 9]}
  prior_seats: {int: [20, 500]}
  provisioned_seats: {int: [10, 520]}

relevant_facts:
  - id: r1
    text: "The renewal quote covers {seats_paid} seats at the current rate."
  - id: r2
    text: "Usage reporting shows {seats_used} seats active in the last 90 days."
  - id: r3
    text: "Policy is to renegotiate whenever utilisation falls below {utilisation_floor}% of paid seats."

distractor_facts:
  # Both are seat counts. One is from the expiring term, the other includes
  # accounts the utilisation rule explicitly does not count.
  - id: d1
    strength: high
    collides_with: seats_paid
    text: "The expiring term covered {prior_seats} seats."
  - id: d2
    strength: high
    collides_with: seats_used
    text: "{provisioned_seats} {tool} accounts exist in total, including deactivated ones that do not count as active."
  - id: d3
    strength: medium
    text: "{buyer} moved to a new contract management system last year."
  - id: d4
    strength: medium
    text: "{tool} is the only vendor in the stack with a purple logo."
  - id: d5
    strength: low
    text: "The renewal calendar invite has no agenda attached."

# The utilisation policy addresses under-use and says nothing about a shortfall.
# A sampling with more seats in use than the quote covers is a scenario the rule
# does not govern, and the model was right to decline it rather than apply the
# rule anyway. Excluded here rather than papered over with more policy text.
constraints:
  - "seats_used <= seats_paid"

solution:
  expr: "'renew' if seats_used * 100 >= seats_paid * utilisation_floor else 'renegotiate'"
  load_bearing: [r1, r2, r3]

strata:
  distractors: [0, 1, 4]
  position: [early, middle, late]
variants: 4
