template_id: rel-002-deploy-window
question: "Should the {service} release go out now, or hold until the next window?"
options: [deploy_now, hold_deploy]

variables:
  service: {choice: [checkout, search, billing, notifications]}
  window_min: {int: [10, 90]}
  smoke_min: {int: [8, 75]}
  team: {choice: [Platform, Growth, Payments]}
  open_bugs: {int: [0, 40]}
  next_window_min: {int: [10, 90]}
  unit_min: {int: [8, 75]}

relevant_facts:
  - id: r1
    text: "The remaining change window for {service} is {window_min} minutes."
  - id: r2
    text: "A full smoke test plus rollback rehearsal takes {smoke_min} minutes."
  - id: r3
    text: "Policy forbids starting a deploy that cannot complete its smoke test inside the window."

distractor_facts:
  # Both are durations in minutes. Neither is *this* window or *the* smoke test.
  - id: d1
    strength: high
    collides_with: window_min
    text: "Tomorrow morning's change window for {service} is {next_window_min} minutes long."
  - id: d2
    strength: high
    collides_with: smoke_min
    text: "A unit-test-only run finishes in {unit_min} minutes, which policy does not accept in place of a smoke test."
  - id: d3
    strength: medium
    text: "{service} was the most-viewed dashboard at last week's review."
  - id: d4
    strength: medium
    text: "The {team} team is trialling a new stand-up format."
  - id: d5
    strength: low
    text: "The release notes template was updated to use a new font."

solution:
  expr: "'deploy_now' if smoke_min <= window_min else 'hold_deploy'"
  load_bearing: [r1, r2]

strata:
  distractors: [0, 1, 4]
  position: [early, middle, late]
variants: 4
