# The answer turns on two facts. Everything else is true, on-topic, and inert.
#
# r1 originally read "credits SLA penalties only after {sla_h} continuous hours".
# The first calibration run failed on the tie case (outage_h == sla_h == 11):
# the rule is strictly-greater, but "after 11 hours" with exactly 11 hours has
# no single reading, and the model's answer was defensible. Reworded to
# "exceeds", which is unambiguously strict.
template_id: rel-001-vendor-outage
question: "The {vendor} outage has ended. Should the team file an SLA claim or wait?"
options: [file_sla_claim, wait]

variables:
  vendor: {choice: [Northwind, Contoso, Fabrikam, Tailspin]}
  outage_h: {int: [2, 26]}
  sla_h: {int: [4, 24]}
  region: {choice: [eu-west, us-east, ap-south]}
  headcount: {int: [12, 400]}
  degraded_h: {int: [2, 26]}
  response_h: {int: [1, 24]}

relevant_facts:
  - id: r1
    text: "The {vendor} contract credits SLA penalties only when downtime exceeds {sla_h} continuous hours."
  - id: r2
    text: "Yesterday's incident kept the service unavailable for {outage_h} continuous hours."
  - id: r3
    text: "Filing a claim costs nothing and has no effect on renewal terms."

distractor_facts:
  # d1 and d2 collide: both state a duration in continuous hours, the units the
  # rule reads. Each is excluded by a qualifier in its own sentence -- degraded
  # is not unavailable, first response is not downtime.
  - id: d1
    strength: high
    collides_with: outage_h
    text: "A separate degraded-performance window the same day lasted {degraded_h} continuous hours, with the service still reachable throughout."
  - id: d2
    strength: high
    collides_with: sla_h
    text: "The {vendor} support agreement promises a first response to critical tickets within {response_h} hours."
  - id: d3
    strength: medium
    text: "The support organisation has {headcount} people across all products."
  - id: d4
    strength: medium
    text: "{vendor} moved its head office to a new building in March."
  - id: d5
    strength: low
    text: "The office coffee machine was serviced on Tuesday."

solution:
  expr: "'file_sla_claim' if outage_h > sla_h else 'wait'"
  load_bearing: [r1, r2]

strata:
  distractors: [0, 1, 4]
  position: [early, middle, late]
variants: 4
