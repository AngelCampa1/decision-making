template_id: rel-009-flight-rebook
question: "Should the traveller rebook onto the later flight, or wait at the gate?"
options: [rebook_now, wait_at_gate]

variables:
  airline: {choice: [Meridian, Solstice, Zephyr]}
  delay_min: {int: [15, 240]}
  connection_min: {int: [30, 200]}
  city: {choice: [Porto, Bergen, Sapporo, Asuncion]}
  bags: {int: [0, 3]}
  other_delay_min: {int: [15, 240]}
  mct_min: {int: [30, 200]}

relevant_facts:
  - id: r1
    text: "The inbound aircraft is running {delay_min} minutes late."
  - id: r2
    text: "The traveller has {connection_min} minutes of slack before the onward connection."
  # r3 is the policy fact, and its absence was the defect. Every other template
  # states the rule that decides the question; this one stated only the two
  # quantities and left "is 20 minutes enough to make a connection?" to the
  # reader's judgement about real airports. The model reasoned about deplaning,
  # walking to the gate and luggage transfers, concluded that a free rebooking
  # beat a tight connection, and was right to. Ground truth said otherwise
  # because the arithmetic said otherwise, which is not the same thing.
  - id: r3
    text: "The transfer airport protects any connection that still has slack remaining once the delay is applied; rebooking voluntarily forfeits that protection."
  - id: r4
    text: "The later flight has seats available and no rebooking fee."

distractor_facts:
  # Both are durations in minutes: another aircraft's delay, and a minimum
  # connection time the itinerary is stated to already meet.
  - id: d1
    strength: high
    collides_with: delay_min
    text: "The departure board shows an unrelated {airline} service running {other_delay_min} minutes late."
  - id: d2
    strength: high
    collides_with: connection_min
    text: "The minimum legal connection time at the transfer airport is {mct_min} minutes, which this itinerary already satisfies."
  - id: d3
    strength: medium
    text: "The traveller has {bags} checked bags, all already tagged through to the final stop."
  - id: d4
    strength: medium
    text: "{airline} operates its largest lounge in {city}."
  - id: d5
    strength: low
    text: "The gate area has been fitted with new seating."

solution:
  expr: "'rebook_now' if delay_min > connection_min else 'wait_at_gate'"
  load_bearing: [r1, r2]

strata:
  distractors: [0, 1, 4]
  position: [early, middle, late]
variants: 4
