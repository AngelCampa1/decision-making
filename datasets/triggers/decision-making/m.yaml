# Band M — a short paragraph, 40 to 90 words.
#
# The band version 2 skipped entirely. It is where the ask stops being the whole
# turn and starts sitting inside context, which is how most people actually
# write: a few sentences of situation, then the question, then sometimes more
# situation after it.
#
# Nothing here is carried over. All thirty turns are new.

positive:
  - id: m01p
    triple: m01
    band: m
    domain: career
    stakes: high
    ask: explicit
    route: fit
    turn: >-
      I keep reading that you should never take a counter-offer, that the trust
