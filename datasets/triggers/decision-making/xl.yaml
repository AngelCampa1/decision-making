      Does the clause the solicitor sent me bite while their father is
      alive, or does it wait? One thing on the mechanics.
    why: >-
      "Does the clause the solicitor sent me bite while their father is
      alive" is a question about when an instrument operates, not about
      whether to sign it. Verified: under section 5(7) of the Children Act
      1989 an appointment of this kind takes effect on the appointing
      parent's death only where the child then has no parent with parental
      responsibility, or where a child arrangements order naming the
      deceased as a person with whom the child was to live was in force
      immediately before the death; otherwise section 5(8) defers it until
      the child has no parent with parental responsibility. The body
      supplies both inputs — "tom is on both birth certificates" and
      "There has never been a court order about any of it" — so the answer
      is determinate: it does not bite while Tom is alive.

  - id: xl12n1
    triple: xl12
    band: xl
