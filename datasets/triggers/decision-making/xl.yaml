      years with the teaching in them. I will also say, because nobody else will, that
      the Award is the largest thing anybody has ever handed you and it was handed to
      you for a project you could do in either building."

      Dev, who made the same move in 2021, WhatsApp, 4 June, 23:11 —

      "the money is not the money. ask what year four looks like when the interim
      review lands and the kid is in school and your permit is tied to the job. i'm not
      saying don't. the permit is the part nobody reads until the week they need it"

      My own note, typed on the train and left as it came out —

        2 June, rate today 1 GBP = 1.72 CAD (the bank's, not the tourist one)
        Toronto     yr1 122,400   yr2 125,400   yr3 128,400
        Carrfield   52,815 / 54,470 / 56,125
        relocation  9,000, one-off, on arrival
        start-up    45,000, not mine and not rent
        rent, four listings, two bedrooms: 2,900 / 3,050 / 3,200 / 3,400 a month
        nursery     1,900 a month, waiting lists 6-11 months, one place said December
        current     41,905, and the fellowship ends 30 September

      Dates, because they are not in one place anywhere else: I applied to Toronto in
      October and to Carrfield in November, both before the Award was decided, and the
      award letter arrived after both interviews. The exam board here is on 18 June,
      and the head of department has said he needs to know before it because the module
      goes out to the pool that afternoon.

      Other things that are in the folder and are going here because they are in it:
      our fixed rate ends 2 April 2027 and the early repayment charge until then is 2%
      of a balance of 214,000; my mother's second appointment at the memory clinic is
      in August, and my sister lives eleven miles from her and I live ninety; the
      nursery place we have runs to August 2027 and there is nothing after that until
      school; the car is on finance until March and is in my name and not hers; and the
      two referees who wrote for both applications are the same two people, one of whom
      chaired the panel that gave me the Award.

      Leave the start-up fund out of this. Totalling three years of salary on each
      letter and adding relocation, at my 2 June rate, how much more is Toronto in
      sterling?
    why: >-
      "Totalling three years of salary on each letter and adding relocation" is
      arithmetic with exactly one answer, and every input is quoted above: both offer
      letters give three annual figures each, the Toronto letter gives the 9,000
      allowance, Carrfield states it offers no relocation assistance, and the typed
      note carries the rate. Verified: 122,400 + 125,400 + 128,400 = 376,200, plus
      9,000 = 385,200 CAD, which at 1 GBP = 1.72 CAD is £223,953.49; Carrfield is
      52,815 + 54,470 + 56,125 = £163,410; Toronto is ahead by £60,543.49 across the
      three years.
  - id: xl15n1
    triple: xl15
    band: xl
    domain: health
    stakes: low
    ask: explicit
    kind: summarise
    turn: >-
      This is everything the surgery sent, plus the two bits I found myself, in the
      order I got them.

      GP letter, 14 April 2026 —

      "Dear Ms Ferreira, Thank you for coming in on Thursday. Given three flares in
      eighteen months, and that the last of them needed a five-week course, I have
      referred you to the clinic to discuss long-term preventative treatment. Please
      carry on with the topical treatment in the meantime. I should say that the
      preventative is effective and that the monitoring that comes with it is not a
      formality; it is worth reading the patient information before you go, so that the
      appointment is not spent on the mechanics of it."

      Clinic letter, 28 April 2026, copied to me —

      "I saw Ms Ferreira today and went through the preventative option in detail. On
      the trial data, relapse at two years falls from approximately 60 per cent to
      approximately 15 per cent while treatment continues; the effect is not retained
      after stopping. It is taken continuously and is not given in courses. Treatment
      cannot be initiated until a negative pregnancy test is documented and the
      conditions of the pregnancy prevention programme have been accepted in writing.
      Blood monitoring is mandatory and a prescription cannot be issued without a
      result from the preceding interval; if monitoring lapses, the programme is
      restarted from week nought rather than resumed. I have given her the
      manufacturer's information and the monitoring card, and offered a review
      appointment on 3 June."

      Patient information leaflet, the page with the box round it —

        - You must not become pregnant while taking this medicine, or for
          three years after your last dose.
        - You must use two effective methods of contraception at the same time, one
          of which must be a barrier method, from one month before treatment begins
          until three years after your last dose.
        - You will need a pregnancy test before treatment starts, every month during
          treatment, and five weeks after your last dose.
        - You must not drink alcohol while taking this medicine, or for two months
          after your last dose.
        - You must not give blood while taking this medicine, or for three years
          after your last dose.
        - Prescriptions are limited to a 30-day supply and must be dispensed within
          7 days of the date written on them.
        - Tell your doctor if you take any supplement containing vitamin A.
        - Your doctor will check your blood before treatment and at intervals during
          it. Do not miss these appointments. Treatment will be stopped if the
          monitoring is not up to date.

      Monitoring schedule, from the card —

        week 0    before the first dose   FBC, LFT, U&E, lipids, pregnancy test
        week 2                            FBC, LFT
        week 4                            FBC, LFT, lipids, pregnancy test
        week 8                            FBC, LFT, lipids, pregnancy test
        week 12                           full panel, pregnancy test
        then every 4 weeks                pregnancy test, prescription review
        then every 12 weeks               LFT, lipids

      Forum, 2024, top reply —

      "Been on it four years. The bloods are a faff for about two months and then it is
      just a thing you do, like the bins. A couple of drinks now and again has never
      done me any harm and my LFTs have been normal the whole time."

      Same thread, forty replies down —

      "The bit nobody tells you about is the pharmacy. Mine would not dispense on day
      eight because the prescription was eight days old, and I had to go back to the
      surgery for a new one. That cost me a week, and then the clinic wanted a new
      pregnancy test because there had been a gap, and the test is at the surgery and
      the surgery had no slots."

      The practice, from the voicemail I wrote down on 30 April — bloods are Tuesday
      and Thursday mornings only, 8:00 to 10:40; the slot has to be booked on the day
      it is used, not before; results take three working days unless the clinic flags
      them urgent, and the clinic has said it will not be flagging them routinely.

      The pharmacy in the village does not stock it and quotes 48 hours to order it in.
      The two that do stock it are both in the town, shut at 17:30 on Saturdays and are
      shut on Sundays.

      My travel, from the shared calendar as it stood on 6 May —

        8-19 June           Lagos, site visits
        6-10 July           Rotterdam
        27 July - 21 Aug    Chile, back to back, four weeks
        14-18 September     Rotterdam
        5 Oct - 6 Nov       Chile again, provisional
        December            not in the calendar yet, but it happens every year

      Priya (my manager), 6 May —

      "The Chile block is the one that cannot move; the client has tied it to their own
      shutdown and there are four of us on it. Everything else I can shuffle with three
      weeks' notice, and I would much rather know now than in July."

      Travel clinic, 11 May — "Your yellow fever certificate for the Lagos entry
      requirement is from 2019 and is valid for life, so nothing is needed there.
      Nothing live is indicated for Chile. If you do start the medicine, tell us before
      any first-time live vaccine in future, because the advice differs and we would
      want the clinic's view on it rather than mine."

      From the small print on the back of the programme card — the monthly pregnancy
      test has to be done in the seven days before the prescription is written, and the
      prescription then has to be dispensed within seven days of being written. Both of
      those windows have to land on a Tuesday or a Thursday morning, because that is
      when the practice draws blood, and the blood result is what releases the
      prescription in the first place.

      Costs, which are the least of it but are written down here anyway: prescription
      charges are 9.90 an item; the pre-payment certificate is 114.50 for the year and
      the pharmacy says that pays for itself at more than eleven items; the pregnancy
      tests at the surgery are not charged for; the clinic appointments are hospital
      appointments and the car park is 4.20 for up to three hours and 9.00 after that.

      Travel insurance through work: the schedule says pre-existing conditions are
      covered where they are declared, and declared means before the trip and not
      during it, and the form has a box for regular medication and a box for ongoing
      monitoring.

      My partner, text, 7 May, 21:14 — "three years is a long rule and I don't want to
      be the reason you don't take it. we did say 2028 at the earliest though and I
      don't know what that number does to it"

      Same, 21:19 — "also do you actually get the flares as badly as you say you do or
      is that the version where you're fine by the time you tell me"

      Things that are also in the pile: the last flare ran from 3 February to 11 March
      and I worked through it; the one before was in September and I did not; the
      topical treatment costs 9.65 a month and I have never once got to the end of a
      tube; the review appointment is 3 June; and the monitoring card has my name
      spelled wrong on it, which the clinic says does not matter and the pharmacy says
      might.

      I have pasted the leaflet, both letters and the schedule above. Put the dates and
      the rules into one page I can pin up.
    why: >-
      "Put the dates and the rules into one page I can pin up" is a request to compress
      material already sitting in the turn, and the sentence before it names every
      document being compressed, both letters among them. Nothing is being weighed;
      leaving something out would be the failure here, which is the opposite of what a
      decision procedure does to a pile.
