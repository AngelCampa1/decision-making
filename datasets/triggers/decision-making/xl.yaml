    turn: >-
      Nothing serious, but I have been going back and forth on this for
      three weeks and I would like an outside view.

      Ruaridh's 40th. Six nights in Portugal, 14-20 March, a house near
      Lagos. The group chat is eleven people and about nine hundred
      messages.

      Chat, Nuala, 2 Aug —

      "HOUSE BOOKED. 4 bedrooms + the annexe. £3,100 for the week. Split 11
      ways that's £282 each, or £245 if we get 12. Deposit £100pp by 15 Sept
      please, non-refundable after that, I have paid it all on my card so
      please actually do it"

      Chat, Ruaridh, 2 Aug —

      "i did not ask for any of this and i am extremely moved"

      More of the chat, because the texture of it is part of why I can't
      decide:

        Kate, 15 Aug — "is the annexe the good room or the bad room"
        Nuala, 15 Aug — "the annexe is a room"
        Marcus, 19 Aug — "proposing the boat thing on the wednesday,
          £45pp, 4 hours,
        they do lunch"
        Saoirse, 19 Aug — "i'm out on the boat thing, i'll do the beach"
        Nuala, 20 Aug — "boat is 6 people minimum. currently 4."
        Ollie, 22 Aug — "should we just do two nights in lisbon after?
          flights are the
        same either way"
        Nuala, 22 Aug — "ollie no"
        Marcus, 1 Sept — "is anyone else worried the house photos are from
          2019"
        Tom, 1 Sept — "they're from 2016"
        Nuala, 1 Sept — "I have spoken to the owner. the kitchen is new.
          everything
        else is from 2016. it is a house in portugal in march for two
          hundred and
        eighty two pounds"
        Ash, 6 Sept — "flights going up. booked mine. 103."
        Kate, 9 Sept — "118 now"

      Flights, checked this morning:

      - Bristol to Faro, out 14 Mar 06:55, back 20 Mar 21:40 — £96 return,
      hand luggage only - the same route was £61 in January when Nuala first
      mentioned it - Gatwick is £140 and I would have to get to Gatwick
      first

      Car hire, from the chat: two cars at roughly £210 each for the week,
      split between whoever is in them, and Dev has said he will drive one.
      Food kitty, from Nuala on 28 Aug, £120pp for the week, covering
      everything except the one restaurant night.

      There is also a spreadsheet Dev made, which is genuinely good, and
      which has a tab called "who owes nuala" and a tab called "boat
      viability".

      Chat, Dev, 11 Sept —

      "deposit list: nuala, dev, kate, marcus, ollie, saoirse, tom, ash.
      outstanding: you, ffion, ruaridh (who is not paying, ruaridh)"

      Ffion, separately, 12 Sept —

      "are you going? no pressure. asking for entirely selfish reasons"

      Two more from the chat that I keep rereading for no reason I can
      defend:

        Ruaridh, 3 Sept — "genuinely the only thing I want is that
          everyone who comes
        actually wants to come. if anyone is doing it out of duty please
          do not, I will
        be able to tell and it will ruin it for me"
        Nuala, 3 Sept — "ruaridh nobody is coming out of duty, it is
          portugal"

      I have read that first one about fifteen times and I cannot decide
      whether it is aimed at me or whether I am simply the sort of person
      who assumes things are aimed at him.

      The complications, such as they are:

      My cousin's wedding is 28 March in Yorkshire and I am going to that,
      which makes two long weekends in one month. Skipton, two nights in a
      Premier Inn because the block booking went in April and I missed it,
      £164, plus the train, plus a present, plus a suit I will have to do
      something about. Call it 400. My cousin and I are close in the way you
      are close to somebody you see twice a year and would help move a body
      for.

      Priya (my partner) is not invited — it is a "the eleven of us" thing,
      which is how the group has always worked and which nobody has ever
      minded, including her. She has said, unprompted, "go, obviously". She
      has also mentioned twice that March is the month her mother is having
      the hip done.

      And the thing that is actually why I keep not paying the deposit:
      Ruaridh and I had a falling-out in 2023. It was about something small,
      I handled it badly, and we have been fine since, in the sense that we
      have seen each other perhaps five times and it has never come up. Two
      of the eleven know about it. I do not know whether going is the thing
      that closes it or the thing that makes it a topic.

      Work: 14-20 March is fine. I have the days and nothing clashes. Money:
      fine. Not comfortable, fine. The 650 or so comes out of the same place
      as the wedding and the two together are about a month of what I
      actually have spare.

      One more thing that is not really a factor and keeps behaving like
      one: the last group trip was Anglesey in 2019 and I did not go to that
      either, for a reason I thought was good at the time and cannot now
      reconstruct. Nobody has mentioned it. Dev mentioned it once, in 2021,
      as a joke.

      The deposit deadline is Sunday. I am aware that a six-night house in
      Portugal in March for £282 is not a problem, and that the fact I have
      written eight hundred words about it probably means something, though
      I am not sure it means the thing it looks like it means.

      I paid the deposit last night, so I am going and that part is settled.
      What I would like is the practical stuff pulled out of nine hundred
      messages into something I can look at once — dates, who is arriving
      when, what has been agreed about cars and the boat, what each thing
      costs, who I owe money to, and anything with a deadline. Ignore
      everything that is people being funny at each other, which is most of
      it.
    why: >-
      Same chat, same falling-out, same wedding. The first sentence closes
      the decision and the ask is extraction.
