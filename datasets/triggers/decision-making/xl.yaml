      Two more things that belong in the pile. The 31st of May is the
      Sunday of the half-term weekend, and 14.3 says received, not sent.
      And the head of maths put his notice in on 30 October last year, and
      Marianne heard it from the trust before she heard it from him, which
      is not a rule but is remembered here.

      The letter is written for the May date and the letter is written for
      the October date. So which one, the May date or the October date?
    why: >-
      The resignation is not what is in play: "The letter is written for
      the May date and the letter is written for the October date" leaves
      only the date of it open, and the mid-ask question "So which one,
      the May date or the October date?" is the entire request. Every
      artefact above it prices a moment and not the move — three
      termination dates, a progression rule that pays only teachers on the
      payroll on 1 September, mocks in November, an inspection window in
      the autumn — so what is hard here is when, which is the timing case.
