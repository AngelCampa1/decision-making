      Ravi, Sunday 8 March, 22:15 —

      "I can do a term on my own, it is four months and people do it. The
      bit I would rather avoid is finding out in July, having told my
      mother in April that we were not."

      St Aidan's advert, twelve minutes' walk from the flat Ravi has
      found, posted 2 March —

      "Teacher of Geography, MPS/UPS, TLR2b available for a suitable
