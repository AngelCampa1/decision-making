      STPCD?" has one right answer, and "where should I go for the version
      that binds me" asks which office holds a copy, so the modal governs
      an address and never an action. The body deliberately withholds the
      answer: HR calls the dates "a national condition of service" and the
      union sheet never names the document either. Verified: the three
      resignation dates for teachers in England and Wales sit in the
      Burgundy Book, the Conditions of Service for School Teachers in
      England and Wales agreed by the national committee, while the STPCD
      governs pay and working time and does not set them; an academy trust
      may contract on different dates, which is why the version that binds
      this teacher is her own contract, and all three facts are checkable
      against the published documents.
