      Letter from Hale & Ferris, dated Monday 2 March, second class, on
      the mat on Thursday —

      "Dear Ms Adeyemi, We act for Mrs Nell Brannigan in connection with
      her will. Mrs Brannigan has asked us to write to you directly and
      has authorised us to share what follows."

      "Mrs Brannigan wishes to appoint you as guardian of her children,
      Ivo (9) and Wren (6). The clause is presently drafted as follows: 'I
      APPOINT TEMI ADEYEMI of 14 Rodney Villas, Bristol to be the guardian
      of my children in the event that no other person has parental
      responsibility for them at the date of my death.'"

      "An appointment of this kind takes effect on death and confers
      parental responsibility on the person appointed. We should make
      clear that it does not operate in every circumstance. Whether it
      operates at all turns on the position of any other person holding
      parental responsibility at the relevant time, which we have
      discussed with Mrs Brannigan and which she is content with."

      "There is no obligation upon you to accept, and the appointment
      carries no cost and no liability during Mrs Brannigan's lifetime.
      Mrs Brannigan has asked whether you would attend the signing
      appointment at this office at 10:30 on Tuesday 17 March so that the
      will can be executed in your presence. We should be grateful for
      confirmation either way by Friday 13 March."

      The FAQ sheet that came in the same envelope, under the heading
      'Guardians' —

      "A guardian appointed by will has the same parental responsibility
      for the child as a parent. The appointment may be revoked by the
      person who made it at any time before their death."

      It says nothing at all about what the person appointed can do, which
      I noticed and then read the sheet twice more to be sure of.

      Further on in the letter itself —

      "We are also instructed to prepare a letter of wishes. This is not
      binding, but a person appointed would ordinarily be expected to have
      regard to it, and Mrs Brannigan has indicated that hers will deal
      with schooling and with contact with her mother. Should no
      appointment be made and circumstances arise in which one is needed,
      the position falls to be determined by the court on an application
      by an interested party."

      The last part of the letter, which I did not take in properly until
      Saturday —

      "Mrs Brannigan's estate comprises the property at Frome, valued at
      £276,000 with an outstanding mortgage of £96,000, and a death in
      service benefit of three times pensionable salary, her salary being
      £34,200. Mrs Brannigan has instructed us to draft a trust of residue
      for the children to age 25, with yourself and her mother as
      trustees."

      Nell, Thursday evening, four messages in about a minute —

      "sorry it came as a letter. graham said it was cleaner coming from
      him and I think graham was wrong about that"

      "it is a form. it is the same form as the one where I had to write
      down who gets the piano"

      "the january scan was clear. next one is 19 june. I am not doing
      this because of that, I am doing it because I am 41 and I have not
      had a will since ivo was born"

      "tom is on both birth certificates, before you ask"

      Sam, Thursday 21:40, having read the letter over my shoulder —

      "I am not saying no. I am saying we have spent about eleven minutes
      on this in total and one of those was in the car."

      The school's letter about Ivo, dated 24 February, which Nell sent me
      on Friday —

      "Ivo's needs are currently met through SEN Support. Following the
      meeting on 5 February, and with your agreement, we have asked the
      local authority to carry out an education, health and care needs
      assessment. The local authority has six weeks in which to tell you
      whether it will assess. Where a plan is issued it names the setting
      the child is to attend, and a change of setting after that point
      requires the local authority to amend the plan."

      "Separately, we hold three emergency contacts for Ivo. In November
      only the first was reachable, and we should be grateful if you would
      review them at the parents' evening on 11 March."

      "Wren has settled well into Year 2. As you know, the infant and
      junior sites are a ten minute walk apart and we are not able to
      stagger the end of the day between them. Families who cannot cover
      both usually use the wraparound club, which is full until January."

      Nell, Friday, unprompted and out of nowhere —

      "what I would want, if you are asking, is that they stay at Frome
      and they see mum every week. that is the whole of it. everything
      after that is yours to do how you want and I mean that"

      Sam, Friday 06:50 —

      "ruby's assessment is on 13 April and I do not have another thing in
      me before that"

      Sam, Saturday, after the two of them had gone to bed —

