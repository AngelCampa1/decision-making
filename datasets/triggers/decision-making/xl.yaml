    ask: explicit
    kind: summarise
    turn: >-
      Pasting all of it because my wife and I have now had the same argument
      five times and I want to see it written down by someone other than the
      two of us. From the school, 8 May — "...following the assessment we are
      recommending a specialist placement from September. The nearest setting
      able to meet the profile is Ashcombe, which is forty minutes each way.
      We would support an application. We should be clear that the local
      authority is likely to contest the placement on cost grounds and that
      appeals of this kind currently take between nine and fourteen months at
      tribunal. The alternative we can offer is enhanced support in our own
      resourced provision, which is on site, and which we would not describe
      as an equivalent." From the educational psychologist, 15 May — "The
      profile is unusual. I would put it like this. In a setting like
      Ashcombe, the environment is built around this and he will not have to
      spend the day managing it. In a mainstream resourced provision, he will
      spend a proportion of each day managing it and the size of that
      proportion depends on things nobody can predict, chiefly staffing. What
      I cannot tell you is whether the forty minutes each way, and being
      outside the town where his brother and every child he knows goes to
      school, costs more than that proportion. That is not a clinical question
      and I would be overstepping if I answered it." From my wife, 19 May,
      written after we had rowed — "I want to put my side properly because I
      do not think I have. He is eight. He has two friends. They are on this
      street. If we send him to Ashcombe he gets a setting that suits him and
      he loses the only social world he has, at the age where that is how you
      learn to have one. Every professional we have spoken to has told us
      about his needs and not one of them has said anything about his life.
      The tribunal is nine to fourteen months of us fighting the council, and
      I have watched what that did to the Kellys. I am not saying the
      provision here is as good. I am saying it is here." From me, 20 May,
      same evening — "Mine, so it is on the same page. Two years ago the
      school told us they could meet his needs and they could not, and we lost
      two years finding that out. 'It is here' is the same argument that lost
      us those years, and I do not think we get to make it twice. He does not
      have two friends because of the school; he has them because of this
      street, and this street does not go anywhere. The forty minutes is real
      and I would drive it. The nine to fourteen months is real and I would do
      it. What I would not do is watch another year of him coming home having
      spent the whole day holding himself together, so that he can be near
      children he sees at the weekend anyway." From his older brother, 22 May,
      unprompted — "He asked me last week whether he was going to have to go
      to the school where he does not know anyone. I did not know what to say
      so I said nobody had decided. I do not think you should tell him it is
      decided until it is." From my mother, 24 May — "Whichever you choose I
      will drive him. I would say only that both of you are describing a child
      you love and neither of you is describing the same problem." From the
      parents' group, 25 May, three replies to my question, pasted whole — "We
      did Ashcombe from year 4. The travel was the thing I was most worried
      about and it was the thing that mattered least. He slept in the car.
      What mattered was that he stopped coming home wrung out. I would say the
      friendships did change and I would not pretend otherwise: he has friends
      now who live twenty minutes away and we drive a lot at weekends." "We
      stayed in mainstream with enhanced support and I would do it again, but
      our provision has had the same two staff for six years and I know that
      is luck. If they had left I think my answer would be different and I do
      not have a way to tell you whether yours will." "We went to tribunal,
      won, and I would tell anyone thinking about it that the year is worse
      than people say. Not the paperwork. The way it makes you talk about your
      own child for twelve months, in the worst possible terms, over and over,
      because that is what the process rewards. He was fine. I was not fine
      for a while afterwards." From the local authority caseworker, 26 May, in
      response to our enquiry — "I can confirm only that the authority's
      position on out-of-area placements where a resourced provision is
      available locally is that the local provision should be tried first. I
      am not able to tell you in advance whether the authority would contest a
      specific application, and I would be careful about reading my previous
      sentence as an answer to that question, although I understand why you
      would." From my wife, 27 May, later — "One more thing and then I will
      leave it. You keep saying we do not get to make the 'it is here'
      argument twice. But the reason it failed last time was that the school
      promised something it could not do. This time they have told us in
      writing that their provision is not equivalent. That is not the same
      argument in the same position, and I think you are treating it as though
      it were, because it is easier to answer that way." Note to self, 29 May
      We have to lodge or not lodge by 30 June. She is not wrong. I am not
      wrong. We have each said the other's argument back correctly, which is
      how I know neither of us has actually heard it. Can you set out what
      each person here has actually said, and separately what each of them
      seems to be asking of us? I keep merging the school's letter with the
      psychologist's and answering something neither of them said, and my wife
      does the same with the parents' group replies.
    why: >-
      The same body, and the ask is to separate what is present into who said
      what. Ledger-shaped, made of a pile that is not the problem.
