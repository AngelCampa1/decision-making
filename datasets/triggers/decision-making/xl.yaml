  - id: xl06n1
    triple: xl06
    band: xl
    domain: technical
    stakes: low
    ask: explicit
    kind: generate
    turn: >-
      Pasting the lot. It is a lot.

      Email from Halvorsen (their head of IT), 21 August —

      "Following our call: our security review will not approve the
      multi-tenant deployment. What we would need is a dedicated instance in
      our own tenancy, or one managed by you in an environment that is not
      shared with other customers. We would expect this to be available for
      the 1 February go-live. We are otherwise ready to sign."

      The contract as drafted, clause 9.2 —

      "The Supplier shall maintain availability of the Service at not less
      than 99.9% measured monthly, excluding Planned Maintenance. Service
      credits shall accrue at 5% of the monthly fee for each 0.1% below the
      threshold, to a maximum of 25%."

      99.9% monthly is 43 minutes. Our actual, measured on the shared
      platform over the last twelve months, is 99.94%, with one bad month at
      99.7%.

      The money: 148,000 a year on a three-year term. That is 31% of current
      ARR and about 60% of next year's plan. Nobody has said out loud that
      we have to have it.

      Slack, me to Ines, 22 Aug —

      "can we just run a second copy of the stack for them"

      Ines, 22 Aug —

      "yes. we can run a second copy. we cannot run a second copy the way we
      run the first one, which is that I fix it. should we be honest with
      ourselves about that before or after we sign"

      Ines's estimate, 26 Aug, pasted as she wrote it:

        standing up a dedicated environment: 3-4 weeks, mostly terraform
          we already
        have
        the bit that isn't the environment: deploys become two deploys,
          migrations
        become two migrations, the on-call rota becomes a rota
        we have no on-call rota. we have me, and Tomas when I'm on a plane
        their security review will also want SSO with their IdP, which we
          don't do,
        and an annual penetration test, which we have never had done
        I'd guess six months of one person, spread over a year, forever

      Their security questionnaire, the sections that came back flagged,
      copied out of the spreadsheet with their numbering:

        4.2 Does the Supplier operate a documented on-call process with
          defined
        response times? — we answered "In progress"
        4.7 Does the Supplier conduct annual penetration testing by an
          independent
        third party? — "No"
        6.1 Does the Supplier support SAML 2.0 or OIDC single sign-on? —
          "Roadmap"
        8.3 Does the Supplier hold SOC 2 Type II or ISO 27001? — "No"

      There are 214 questions in it. Those are the four.

      From the covering email that came with the questionnaire, which I only
      reread last night —

      "Please note that responses marked 'Roadmap' or 'In progress' will be
      reviewed at the twelve-month contract review and are treated as
      commitments for that purpose."

      So SSO and the on-call process are not aspirations we typed into a
      spreadsheet. They are terms, and nobody on our side has said that out
      loud.

      Quote from the penetration testing people, 4 Sept: 8,900 for the first
      one, 6,400 annually after that.

      Halvorsen's second email, 29 Aug —

      "To confirm, a SOC 2 Type II report would not be required for go-live,
      but our vendor policy requires one within twelve months of contract
      commencement for a system of this classification."

      I asked two people what SOC 2 Type II costs. One said 25-40k all in
      for a company our size and "a solid quarter of somebody's year". One
      said 12k and "it's mostly a documentation exercise". Those cannot both
      be true.

      Infrastructure, from the provider's calculator: a dedicated
      environment at their expected load is about $1,900 a month, plus the
      non-production copy, call it $2,400. That is 2.3% of what they would
      pay us, and it is the only number in this entire thing that is
      comfortable.

      Tomas is the only person other than Ines who has ever deployed this.
      He is part time, two days, and he told me in July that he is going
      back to full-time study in January. I have not put that anywhere that
      anybody else can see it.

      Two other customers have asked about dedicated instances in the last
      year. Both accepted the shared platform when we said no. One of them
      renews in April.

      Our pricing page says "from £1,200/month". Halvorsen's deal is 12,300
      a month.

      From the discovery call notes in June: "HV mentioned they are also
      replacing two other systems in the same programme. Timeline for those
      is 2027." If we are their vendor for this, we are in the room for
      those, and if we are not, we aren't.

      They want an answer in principle by 30 September so that their board
      can approve the budget in the October cycle. Halvorsen has been
      straightforwardly decent about all of it and has not once used the
      deadline as a lever, which somehow makes it worse.

      Ines, 5 Sept, which is the message that made me write all of this out
      —

      "I'm not against it. I want it written down somewhere that the thing
      we're deciding isn't whether to build them an environment. It's
      whether we become a company that runs environments."

      And the part I keep not writing down: if we say no, Halvorsen goes
      back to his board with "the supplier could not meet our security
      requirements", and that sentence travels. Two of their people used to
      work at the customer who renews in April.

      We are saying yes — it went to the board on Tuesday and it is
      approved, dedicated environment for 1 February, pen test budgeted, SOC
      2 starting in Q2. Write two things. The reply to Halvorsen: confirms
      in principle, names 1 February, is honest that SSO is being built for
      this and gives a date for it, and does not promise SOC 2 any earlier
      than his own policy requires. Then a short internal note to Ines and
      Tomas, which has to say that the on-call rota is now a thing we are
      doing rather than a thing we are discussing.
    why: >-
      Identical body. The commitment has been made by the body that can make
      it and the ask is two pieces of writing.
