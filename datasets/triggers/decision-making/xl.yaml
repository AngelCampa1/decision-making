  - id: xl02n1
    triple: xl02
    band: xl
    domain: money
    stakes: high
    ask: implicit
    kind: summarise
    turn: >-
      Right — all of it in one place, because it is currently spread over
      four inboxes and a folder of photographs of letters.

      HMRC letter, 22 July, reference on the top right which I am not typing
      out —

      "We are checking your Self Assessment tax return for the year ended 5
      April 2023. This is a compliance check under Schedule 36 Finance Act
      2008. We need the following information by 26 August: bank statements
      for all accounts used for business purposes, invoices and payment
      records for subcontractor costs, and a copy of your business records
      for the period."

      HMRC letter, 19 August —

      "Thank you for the information provided. We have concluded that
      expenses of £41,208 claimed under 'subcontractor costs' are not
      supported by the records provided. We propose to amend your return
      accordingly. On the basis of the amendment the additional tax due is
      £16,483.20 plus interest. We are also considering a penalty. Penalties
      for inaccuracies range from 0% to 30% of the potential lost revenue
      where the inaccuracy is careless, and up to 70% where it is
      deliberate."

      Farida (my accountant), 21 August —

      "Don't panic. This is a fairly standard enquiry outcome and the
      subcontractor point is arguable — we have the invoices, what we don't
      have is proof of payment for eleven of them, because those were cash.
      I would push back. Realistic outcome in my view: half of it goes away
      and the penalty lands around 15%."

      Second opinion, a tax adviser my brother-in-law uses, 29 August, on
      the phone. My notes from it, as I typed them:

        said the opposite. said cash payments to subbies with no CIS
          deduction is the
        thing they are actually looking at and that the 41k is the small
          half of the
        problem. asked whether I had filed CIS returns. I had not. said
          that is a
        separate penalty regime, £100 per month per return, and if it is
          two years of
        monthly returns that is its own number entirely. said get a
          specialist. would
        not quote.

      Farida, 1 Sept, when I put that to her —

      "That is a fair point and I should have raised it. I would suggest we
      deal with the enquiry first."

      The eleven invoices are from the same two subcontractors, both of whom
      I still use, both paid in cash at their own request, both of whose
      numbers I have. One told me in August that he "doesn't really do
      paperwork from back then". The other has not replied since 2
      September.

      The bookkeeper before Farida, in an email from 2022 that I found while
      looking for something else —

      "I've flagged this before but I'll put it in writing: if you're paying
      people in the trade you need to be operating CIS. It isn't optional
      and it isn't about whether they're employed or not."

      I have no memory of reading that email. It is in my inbox, marked
      read, with a reply from me saying "noted, thanks R".

      Time to Pay, from the phone call on 4 Sept, 41 minutes, my notes:

