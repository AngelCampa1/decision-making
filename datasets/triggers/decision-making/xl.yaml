      Ruth, my sister, WhatsApp, 23 May, 21:14 — "take the house. pensions are
      twenty years away and every person advising you gets paid the same either way"

      23 May, 21:15 — "also mum did the pension thing in 1998 and got nothing out of
      it in the end"

      23 May, 21:31 — "ignore that last one, I don't actually know what she got, I
      was fourteen"

      Vantage Group Pension Scheme, annual benefit statement, issued 3 March 2026 —

      "Accrued pension at date of leaving: £14,206 per annum. Revaluation is applied
      in line with CPI capped at 5% per annum. Normal retirement age: 65. Cash
      equivalent transfer value: £412,000. This value is guaranteed for a period of
      three months from the date of this statement. A charge of £1,200 applies in
      respect of the implementation of a pension sharing order and is payable by
      such party as the order directs. Where the scheme is required to implement an
      order it will do so within the implementation period prescribed by
      regulations."

      He was 51 in February and I am 44 in November. We married in July 2007 and
      separated on 4 September 2024. The children are 12 and 9 and the alternate
      weekends have never once been in dispute. My own arrangement is the one from
      before the children and nothing has gone into it since 2019, which is the
