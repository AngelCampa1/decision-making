    stakes: low
    ask: explicit
    kind: diagnose
    turn: >-
      Everything on catalog-v1 is below in the order it arrived, and the table
      in the middle is the one people keep asking me to re-send.

      catalog-v1 is the internal product catalogue API. It went in in 2019.
      Forty teams call it, or forty-one if you count the two that share a
      service account. catalog-v2 has been generally available since 5 January
      2026 and does everything v1 does apart from the bulk endpoint, which it
      does differently and not identically.

      Architecture review board, minute 4 of 12, Wednesday 4 March 2026 —

      "The board approved the retirement of catalog-v1. Retirement is to be
      executed by the platform team as a single shutoff and not as a phased
      read-only period, on the grounds that a read-only period was tried for
      the notifications API in 2024 and then extended three times. No shutoff
      date was set at this meeting. The board asked the platform team to bring
      one."

      Deprecation policy, wiki, section 3, unchanged since 2023 —

      "Any breaking change to a tier-1 internal API requires at least 30 days'
      written notice to every consuming team, and the notice must name a date
      and a named owner. Teams that have not migrated by the named date are
      not in themselves a reason to move it; the policy exists so that the
      date can be held."

      catalog-v1 is tier-1. The 30 days is calendar days and the policy does
      not say working days anywhere in it.

      Vendor notice, Norlyn Data Systems, in the inbox 30 June 2026 —

      "END OF SECURITY SUPPORT: NORLYN INDEX ENGINE 4.x

      Norlyn Index Engine 4.x reaches end of security support on 30 November
      2026. After that date no security fixes will be issued for the 4.x line,
      including fixes for vulnerabilities rated critical. Customers should plan
      to move to 5.x. Engine 5.x removes the legacy query grammar and the
      /v4/segment compatibility layer. Customers holding a support contract may
      purchase extended security support for 4.x in twelve-month blocks.
      Pricing on application."

      catalog-v1 is the only thing left in our estate on 4.x. catalog-v2 has
      been on 5.x since it shipped. Procurement asked Norlyn for the
      extended-support price on 14 July and has had nothing back.

      Usage, pulled from the gateway logs on Monday 3 August. These are the
      twelve teams still calling v1; the other twenty-eight are on zero for all
      three months. Call sites comes from the code search and not from the logs.

        team              sites   May        Jun        Jul        status
        billing-core      31      4,180,000  3,970,000  3,760,000  not started
        fulfilment        18      1,900,000  1,880,000  1,840,000  in progress
        partner-portal    7       612,000    598,000    571,000    not started
        search-relevance  3       94,000     90,000     88,000     in progress
        warehouse-sync    24      2,390,000  2,400,000  2,410,000  not started
        mobile-api        12      1,260,000  1,230,000  1,205,000  in progress
        pricing           4       101,000    99,000     96,000     not started
        returns           9       452,000    441,000    430,000    in progress
        tax-engine        2       44,000     42,000     41,000     in progress
        loyalty           21      1,690,000  1,672,000  1,660,000  not started
        storefront-edge   6       815,000    809,000    802,000    in progress
        data-platform     15      1,190,000  1,150,000  1,120,000  in progress

      Migration guide, internal wiki, last edited 16 June 2026, the sizing
      section —

      "Sizing. Use call sites and not call volume; volume is absorbed by the
      gateway shim and does not change the work. A team with fewer than 5 call
      sites should plan 2 engineer-weeks. A team with 5 to 20 call sites
      inclusive should plan 6 engineer-weeks. A team with more than 20 call
      sites should plan 12 engineer-weeks. The figures assume one engineer and
      include the soak period. They exclude the bulk endpoint, which has no v2
      equivalent and is being handled centrally."

      Change calendar for the rest of the year, off the release management page:

        7-11 Sept     Ardenne launch. One customer, nine per cent of revenue.
                      No platform changes that week.
        5-23 Oct      external audit fieldwork. Auth, catalogue and payments
                      all in scope. Change requests during fieldwork need the
                      auditor's sign-off, and sign-off takes four working days.
        13 Nov-3 Jan  peak freeze. Nothing ships. No exceptions process; the
                      last exception granted was in 2022.
        4 Jan onward  normal.

      So the openings are 24 October to 12 November, which is twenty days, and
      then everything from 4 January.

      Two mechanical facts that keep getting mixed up in the same sentence.
      Turning v1 off is a config change at the gateway and is reversible in
      about four minutes. Turning the 4.x cluster off is a different act and
      is not reversible in four minutes, because the index rebuild from cold
      is nine hours and we have measured that twice.

      Slack, #platform, Tuesday 28 July, 09:14, Meera (platform lead) —

      "the twenty days are real but the audit finishes on the friday before
      them. we would be turning off a thing forty teams touch with the auditors
      still writing up. i am not saying no. i am saying somebody has to say
      that part out loud before it goes in a plan"

      Slack, #platform, Thursday 30 July, 16:40, Kwame (SRE) —

      "i would take the twenty days over running 4.x unpatched across christmas
      on a skeleton rota. we did exactly that in 2022 with the old queue and it
      was fine right up until it was not"

      Slack DM, Tuesday 4 August, 08:02, Ana (engineering director) —

      "not going to overrule anyone on the date. what i will say is that the
      extended support quote lands on my budget line, and next year's numbers
      go in on 30 September, so a quote that turns up in October is a quote i
      can do nothing with"

      Email, billing-core tech lead, 29 July —

      "We are not starting this before our own launch, which is the Ardenne
      work in September, and after that we have the two weeks of stabilisation
      we always have. Realistically we pick it up in the second half of
      October, and 31 call sites is not a fortnight of work. If the date is
      November we will not make it, and I would sooner say that now than say
      it in a status meeting in November."

      Pager, 03:12 on Tuesday 21 July — /v1/catalog/bulk returned 429 to
      warehouse-sync for eleven minutes and then cleared with nobody touching
      it. The gateway's shared quota was at forty per cent for the whole eleven
      minutes and did not go above forty-four. This is the third time. Always
      warehouse-sync, always between 03:00 and 04:00, never anybody else. The
      gateway team say the quota is per service account and warehouse-sync has
      one of its own.

      Other things, in no order:

        - The bulk endpoint is the problem child. Nine of the twelve teams
          above call it, v2 has no equivalent, and the central replacement is
          in design and not built. Meera's estimate for it is "six weeks,
          which means ten".
        - The platform team is four people. Josef is the only one who has been
          inside v1's index-refresh path and his last day is 2 October.
        - We pay for the 4.x cluster whether anything calls it or not. 6,400 a
          month, 76,800 a year, and the finance line calls it 76.8k.
        - The last three deprecations here all slipped. Notifications slipped
          twice, the old image service slipped once and was then cancelled,
          and the reporting endpoints went out on time because nobody used
          them.
        - Security team, email of 5 August: "An unpatched search engine in a
          catalogue path is a finding we would have to write up at the next
          audit. We would not block a January shutoff. We would write it up."
        - None of the forty teams has been told anything. The board minute is
          on the wiki and is technically readable by all of them.
        - Josef, in the same channel, a sentence he never finished: "the thing
          nobody has said out loud is that the bulk endpoint is what"
        - Nobody has written the shutoff runbook. The template exists and has
          been empty since March.
        - One thing nobody has costed: buy a single twelve-month block of
          extended support so that a January shutoff is not an unpatched
          January. Norlyn has not sent a number, and Ana's budget line closes
          on 30 September.
        - The migration guide has been opened 61 times. Twelve of those are me.

      Leave the retirement date out of this. What makes the bulk endpoint
      return 429s to one caller while my quota graph sits at forty percent?
    why: >-
      The pager line supplies the whole symptom — "returned 429 to
      warehouse-sync for eleven minutes and then cleared with nobody touching
      it" — and the ask opens by putting the date question aside. What is
      wanted is a mechanism for a repeating per-caller 429 under an unexhausted
      shared quota, which is technical diagnosis and sits on the skill's abort
      list by name.

