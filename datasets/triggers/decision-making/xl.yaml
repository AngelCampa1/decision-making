      The mortgage broker, voicemail, transcribed by the phone and left as it came
      out, 12 May — "the product you are on ends in October and after that it is the
      standard variable, which on your balance is about two hundred and forty a
      month more give or take, call me back"

      Note to myself in the phone, 25 May, 06:40 — "ask N: does the 1,200 come off
      the top or out of my half. ask about the six weeks. ask what happens to any of
      this if he changes jobs before June." Two of those three got asked and the
      third did not.

      The bundle for the FDR runs to 214 pages. I have read the report, the two
      letters and the benefit statement, and nothing else in it beyond the index.

      Nadia's office rang on the 26th to say she is away until 1 June and that the
      FDR date will not move. The same call said the four months of implementation
      runs from the order taking effect and not from the hearing, so the pension
      part of this does not finish in June whichever way it goes. The phrase "clean
      break" appears nine times across the two letters and does not mean the same
      thing in both.

      Should I read a pension sharing order and an attachment order as two
      names for one thing, or do they do different things? One letter says
      pension sharing order and the other says attachment order.
    why: >-
      The one occurrence of "Should I" in this triple sits on a negative, and it
      opens "Should I read those as two names for one thing" — a question about what
      two legal instruments are, not about which settlement to take. Both
      instruments appear in the body: Halloran Webb writes of a "pension sharing
      order" and Pentlow & Ridge of "an attachment order in the alternative".
      Verified: a pension sharing order splits the transfer value at the point the
      order takes effect and gives the other party a pension credit in their own
      right, under the Welfare Reform and Pensions Act 1999; an attachment order
      under ss.25B-25D of the Matrimonial Causes Act 1973 only redirects the
      member's benefits once they come into payment and lapses on the member's
      death, so the two differ on when the money moves and on whether it survives
      him.
