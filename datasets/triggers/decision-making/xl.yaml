  - id: xl22n1
    triple: xl22
    band: xl
    domain: technical
    stakes: low
    ask: explicit
    kind: compute
    turn: >-
      Pasting the whole thread plus the two documents, because the decision is
      due and I want to be honest with myself about what we actually know.
      Architecture proposal, 4 September, section 3 (data residency) — "Both
      candidate designs move the primary store out of the on-premise estate.
      Design A places the primary in the vendor's Frankfurt region with an
      asynchronous replica in Dublin. Design B places the primary in Frankfurt
      with no replica and a nightly export to on-premise cold storage. Design
      A is materially simpler to operate, gives us a recovery point objective
      of under a minute against Design B's twenty-four hours, and is the
      design the team would choose on every axis other than regulatory. The
      open question is whether the supervisory authority regards the Dublin
      replica as a transfer requiring a separate notification under the
      sectoral rules, or as within the existing authorisation." Email from
      external counsel, 11 September — "We have looked at this and we are not
      going to give you a clean answer, because there is not one to give. The
      2024 guidance is drafted around a primary and a backup in the same
      member state and does not contemplate this pattern. We have seen the
      authority take both readings in adjacent sectors within the last
      eighteen months. Our best assessment is that they would more likely than
      not treat the replica as within the existing authorisation, and we would
      put that at something like seventy per cent, which is a number we are
      giving you reluctantly and which you should not treat as a calculation.
      If you want an answer rather than an assessment, the mechanism is a
      written enquiry to the authority. Their published service standard for a
      written enquiry of this kind is eight weeks and our experience is that
      eight weeks is optimistic." Email from the Chief Risk Officer, 12
      September — "I want to be clear about what I am and am not saying. I am
      not saying we cannot proceed on counsel's assessment; boards accept
      assessments every day. I am saying that if we build Design A and the
      authority later takes the other reading, the remediation is not a
      configuration change. It is a migration of the primary store performed
      under a deadline set by a regulator, in a system that will by then be
      carrying live volume, and I have been through one of those and would
      like not to go through another. Conversely, if we build Design B and the
      authority would have accepted Design A, we have bought a twenty-four
      hour recovery point objective for four years for nothing, and I do not
      want to pretend that is costless either. It is not obviously the safe
      choice. It is a different risk." Email from the platform lead, 15
      September — "The build itself does not care which we pick, and the cost
      difference over the programme is around three hundred thousand, which is
      inside the contingency. What the build does care about is when we pick.
      The storage layer is the first thing we lay down and everything else is
      written against it. If we choose in the next fortnight, the difference
      is a design decision. If we choose in January, it is a rewrite of about
      four months of work, because by then the services above it will have
      been built against whichever assumption we made in order to keep
      moving." Email from the programme director, 18 September — "For the
      avoidance of doubt on dates. The programme board approved funding on the
      basis of a go-live in October next year. That date is in the customer
      communications that went out in August. The eight-week enquiry, if we
      start it today, returns an answer in the middle of November at the
      earliest and counsel has told us to expect later. There is no version of
      this where we wait for the authority and also keep the storage decision
      open, because the platform lead's fortnight is a real fortnight." Email
      from counsel, 22 September, in response to my direct question — "You
      asked whether we can make the enquiry without signalling which design we
      intend, and whether an enquiry itself carries risk. Briefly: an enquiry
      is not without consequence. It puts the pattern in front of the
      authority in writing. Our assessment of seventy per cent is an
      assessment of how they would respond if the question arose. It is not an
      assessment of how they would respond to being asked in the abstract by a
      firm that is plainly about to do it, and those are not the same
      question. We would not describe the enquiry as high risk. We would
      describe it as not free." Email from the platform lead, 23 September —
      "One correction to what I said last week, because I have gone and
      looked. The fortnight is a fortnight for the storage layer itself. There
      is about six weeks of work above it that does not depend on the choice
      at all, so if we are prepared to reorder the plan we can buy perhaps
      five weeks before the decision becomes expensive rather than two. That
      still does not reach the middle of November and it costs us the buffer
      we were holding for the integration work, which is the buffer I would
      least like to spend. I am telling you because it changes the shape of
      the question and not because I am recommending it." My own note, 24
      September So the position is: one fact decides between two designs that
      share almost nothing, the fact is obtainable, obtaining it takes at
      least eight weeks against a fortnight of slack that might be five, and
      asking is not free. The storage decision goes to the design authority on
      8 October. Can you work out the cost difference over the four-year
      programme between the two designs, including the remediation case at
      counsel's thirty per cent, and show it as an expected value and as a
      worst case separately? The three hundred thousand is the build
      difference only.
    why: >-
      The same body, and the ask is arithmetic over the two designs.
