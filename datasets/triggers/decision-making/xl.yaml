      All of it is here, dates and all, in the order I got it.

      The invitation came by post on 18 July, printed, with a card inside it —

      "Marta and Jakub invite you to their marriage at the Church of St Barbara,
      Krakow, on Saturday 24 October 2026 at three o'clock, and afterwards at Dwor
      Sierakow. Kindly reply by 31 August. A block of rooms is held at the Hotel
      Wentzl under the family name until the same date."

      Handwritten on the back of the card, in Marta's writing — "Please come. I
      know. Please come anyway."

      What happened, since it is the only part of this that is not on paper. In
      March last year, three weeks after Babcia's funeral, my uncle Marek told the
      family at a table with eleven people round it that my mother had been taking
      money out of Babcia's account for years. It was a standing order Babcia set up
      herself in 2019. The bank confirmed that in writing in May and Marek has never
      said anything about the letter to anybody. My mother has not spoken to him
      since. Marek is Marta's father.

      The bank's letter, 14 May last year, the paragraph that matters — "We confirm
      that the standing order of £200 monthly from the account ending 4471 to the
      account ending 8823 was established on 6 September 2019 on the instruction of
      the account holder in branch, and that no third party has held authority on
      the account at any time."

      The funeral was 28 February last year, in Leeds, and Marek flew over for it
      with Marta. He carried the coffin. My mother sat next to him at the wake and
      there is a photograph of the pair of them laughing at something, which Ola put
      in the group chat last Christmas without meaning anything by it. Three weeks
      after that was the table.

      Eleven people at that table. I have spoken to four of them about it since and
      got four versions of it, including my brother Piotr, who was sitting next to
      me and says he does not remember it the way I do. Piotr is going to the
      wedding. Babcia's house sold in February this year and the money went five
      ways with Marek as one of the five; that is finished and nobody is arguing
      about it.

      The cousins' group chat, called "Krakow October", which Ola added me to on 29
      July —

        Ola, 29 Jul 21:14 - apartment for six near the rynek, 22nd to 26th,
          1,480 zloty for the whole thing, four of us in so far
        Ola, 29 Jul 21:15 - last two beds are yours if you want them, I'll
          hold them till the 31st of August but Marta needs numbers
        Kuba, 30 Jul 08:02 - is Ciocia Ewa coming    (Ewa is my mother)
        Ola, 30 Jul 08:40 - no
        Kuba, 30 Jul 08:41 - ok
        Ola, 4 Aug 19:02 - nobody is going to make it a thing on the day.
          Marta has asked everyone. that is the whole message

      What it costs in pounds, off the tab I have had open since the 29th —

        flights, 22 Oct out and 26 Oct back, two of us      412.00
        apartment, our share of the 1,480                    62.00
        gift, what the cousins have settled on              150.00
        kennels, four nights                                 96.00
        leave: three days, the 22nd, the 23rd and the 26th

      The order of the day, off the card: church at three, photographs, reception
      from six, and then a family lunch at Marek's house on the Sunday, which is on
      a separate slip and says "family only, from twelve". The Sunday is the 25th.
      The flights on the tab above cover both days.

      I have five days of leave left and the leave year ends 31 December. Sam has
      plenty. The 22nd is the day of the October board pack, which I have done every
      month for three years, and Ravi has now said twice that he can cover it. The
      apartment and the hotel block both release on 31 August, which is also the
      reply date printed on the card.

      Message from Marek, 2 August, first thing he has sent me since March last year
      —

      "I heard you might come. I would like that. I said what I said at a bad time
      and I have thought about it since. I am not going to go over it again at my
      daughter's wedding and I would ask you not to either. Your mother knows where
      I am if she wants me."

      Voicemail from my mother, 9 August, typed out because I kept replaying it —

      "It's me. Ola rang. I've said no and that's the end of it for me, I'm not
      going to sit in a church and look at him. You do what you want, love. Don't
      stay away on my account, I mean that, I'd be cross. But don't come back and
      tell me he was lovely, because I couldn't have that. Anyway. Ring me back, not
      tonight, I'm at Krystyna's."

      Message from Nadia, my oldest friend, who is not family and has met all of
      them twice, 6 August —

      "Right. Three things and then I'll shut up. One: the invitation is Marta's and
      not Marek's, and Marta wrote on the back of it, which means the person
      actually asking you is the one who did nothing wrong. Two: your mum has told
      you not to stay away on her account, so if you stay away anyway you have made
      her responsible for a thing she has just refused to be responsible for, which
      is a worse thing to do to her than going. Three: everybody keeps costing this
      in flights. Flights are the only part of it that will not matter in a year. So
      the answer is obviously yes, and the only live question is how many days you
      stay."

      Sam's position, said once on 5 August and not since — "I'll come if you go and
      I won't mention it if you don't." Sam has met Marek twice, once at the funeral
      and once at the table in March, and has never offered a view on either.

      Marta and I are eight months apart. She lived with us for a year in 2016 doing
      her master's in Leeds, and before that we shared a room every summer until we
      were sixteen. She has sent me nothing except the three words on the back of
      the card, and nobody in the family reads that the same way twice.

      Piotr, 7 August, when I asked him straight — "I'm going because Marta asked me
      and because I want to see Krakow, and I'm not carrying anybody else's row into
      it for them. If you want me to tell you it will be fine I can't, because Marek
      is Marek and there will be a speech. I'd say come. I'd also say that I would
      say that."

      Two more from Ola, both on 11 August, both sent to me and not to the group —
      "Marta has put you next to me and Kuba, not on the top table, and she asked me
      to tell you that" and "Marek asked me on Sunday whether you had replied. He
      didn't ask about your mum. I said I didn't know, which was true then." Both of
      those came in on the Tuesday morning, eleven minutes apart.

      We booked the flights yesterday and Ola has our beds. I need a plan for the
      wedding day and the Sunday that keeps me out of his way.
    why: >-
      "We booked the flights yesterday and Ola has our beds" closes the travel
      question inside the ask, and the body does not contradict it: the last two
      beds are held "till the 31st of August" and there are five days of leave
      against three needed. What is wanted is a plan for two days on the ground.
