      Pasting the whole lot because I have now read it four times and I come
      out somewhere different each time depending on which document I finished
      on. Board minute, 12 February, item 4 (succession) — "The Chair noted
      that the founder's shareholding (61%) will pass under the will into the
      family trust, and that the trust deed requires the trustees to act in
      the interests of all four beneficiaries rather than of the business. Two
      routes were tabled. Route A: accept the indicative offer from Halloway
      Group (trade buyer, indicative 14.2m, structure to be agreed, retention
      of the Bridgend site not guaranteed). Route B: a management buyout led
      by the operations director, funded by a mix of vendor loan notes and
      asset finance, indicative 11.6m of which 4.1m would be deferred over
      five years. The Chair asked for written positions before the March
      meeting." Written position from Halloway's corporate finance adviser, 20
      February — "Our client's offer is cash at completion for 80% of the
      consideration with the balance in a twelve-month retention against
      warranty claims. This is a clean exit. The family's exposure to the
      business ends at completion. We would expect to consolidate the Bridgend
      operation into our existing Newport facility within eighteen months; we
      are not in a position to give an undertaking on that, and we would
      rather say so now than say something warm and be held to it later. On
      valuation: 14.2m reflects the customer concentration, which is 41% with
      two accounts, and we have not discounted it as heavily as we might. We
      are aware there is a management proposal. We would say only that a
      five-year deferred element in a business with this customer
      concentration is a risk the family would be retaining, not disposing
      of." Written position from the operations director, 24 February — "I
      have run Bridgend for eleven years. Ninety-one people work there and
      about sixty of them live within four miles. Halloway have told you what
      they will do with it, and to their credit they have not pretended
      otherwise. My proposal pays less on paper. What it does is keep the
      thing your father built doing what he built it to do, with the people he
      hired. The deferred element is real risk and I am not going to talk it
      down: if we lose either of the two large accounts in the first three
      years, the family will not see all of it. I would ask you to weigh that
      against a certainty that the site closes. I have shown my numbers to the
      same accountant you use and he has not told me they are wrong." Note
      from our accountant, 26 February — "Both are competent proposals and I
      am not going to tell you which to take, because the question is not an
      accounting one. Points of fact only. (1) The difference in headline is
      2.6m. On the MBO, 4.1m is deferred and unsecured beyond a debenture that
      ranks behind the asset finance. Risk-adjusted, my own rough figure for
      the MBO is somewhere between 9.8m and 11.2m depending on what you assume
      about the two large accounts. (2) The tax position is broadly similar
      under both. (3) The trust deed does not say the trustees must maximise
      consideration. It says they must act in the beneficiaries' interests,
      and whether a beneficiary's interest includes the town is a question for
      you, not for me." Email from my sister, 27 February — "I have read all
      of it. I keep coming back to the fact that Dad would not have sold to
      Halloway. But I also know that 'Dad would not have' is exactly the kind
      of argument that has kept worse businesses than this one going for ten
      years past the point. I do not want to be the person who turns down 2.6m
      of other people's inheritance on a feeling about our father. I also do
      not want to be the person who signs the paper that closes Bridgend. I
      have argued myself into both of those and out of both of those since
      Tuesday." Email from my brother, 27 February — "Take the money. I am not
      being cold about it. The MBO asks the four of us to underwrite the
      operations director's business plan for five years using our own
      inheritance as the collateral, and none of us has any way of judging
      that plan. If he is right, he does not need us to carry the risk; he can
      raise it properly from someone whose job it is to price it. If he is
      wrong, we find out in year four with no way back." Letter from the two
      large customers' relationship manager, 1 March, forwarded by the
      operations director without comment — "Further to your enquiry: neither
      contract contains a change of control provision requiring consent, but
      both contain a twelve-month termination for convenience on notice.
      Historically both accounts have been renewed on the strength of the site
      relationship rather than on price, and I would not want to predict how
      either would respond to a change of ownership. I am aware this is the
      least helpful possible answer." Second note from our accountant, 3 March
      — "Since you asked. If the two accounts hold, the MBO's deferred element
      is almost certainly paid and the gap closes to under a million. If
      either goes in the first two years, the deferred element is largely gone
      and the gap is nearer four million. I cannot put a probability on that
      and neither can anyone else in this correspondence, including the people
      who have implied one. The trade offer does not carry that exposure,
      because the exposure transfers with the shares. That is the entire
      financial difference and everything else is detail." Email from my
      youngest sister, 5 March — "I have not said anything because I do not
      understand the numbers and I have been embarrassed about that. What I do
      understand is that we are four people who have not agreed about anything
      since the funeral, and that both of the two loudest arguments in this
      thread are being made by people who are certain. I would like someone to
      make each of them the way the other side would have to answer it, rather
      than the way it has been made to me." My own note, 8 March Neither of
      them is being unreasonable and neither of them has said anything the
      other could not answer. The trustees meet on 11 March. Can you work out
      what each route pays each of the four of us, after the trust takes its
      share, under the accountant's two scenarios for the large accounts? Use
      his own risk-adjusted range for the buyout rather than the headline, and
      set out what you have assumed at each step.
    why: >-
      The same body, and the ask is arithmetic over the two routes.
