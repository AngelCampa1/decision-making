  - id: xl05n1
    triple: xl05
    band: xl
    domain: health
    stakes: high
    ask: implicit
    kind: summarise
    turn: >-
      Everything in one place, because I have now had the same conversation
      four times and it keeps going the same way.

      Consultant's letter, 14 June —

      "Mrs Bergström has a longstanding scapholunate ligament injury with
      early degenerative change. I have discussed the options with her. My
      recommendation is a partial wrist fusion. This offers reliable pain
      relief with a predictable loss of approximately 40-50% of
      flexion-extension range. Recovery is six weeks in a cast followed by
      three to four months of hand therapy, with a return to most activities
      at six months."

      Same letter, last paragraph —

      "She is understandably concerned about her occupation. I have advised
      that most patients return to full function for activities of daily
      living."

      Physio's notes, forwarded 20 June —

      "Grip strength R 18kg, L 31kg. Pain 6/10 at rest after activity, 8/10
      with loaded rotation. Patient reports symptoms are worst on days with
      more than four hours of work."

      Second opinion, 2 July —

      "I agree with the recommendation. I would add that delay is not
      neutral. The degenerative change progresses, and the salvage options
      at that point are narrower."

      Both of them are right and neither of them has asked what I do.

      What I do: I am a British Sign Language interpreter, freelance, and
      have been for nineteen years. Forty to fifty per cent of flexion and
      extension is not a percentage of a hobby. Fingerspelling and perhaps a
      third of the signs I produce in a working day are wrist. I have asked
      both consultants what a partial fusion means for BSL production
      specifically, and both have said, in almost the same words, that they
      have not had a patient who does this.

