      WhatsApp from Dev, Friday 6 March, three in a row —

      "the whole of it turns on whether you get another year of the plus
      1.6 or you don't, and I promise you nobody in this building knows
      the answer, not finance, not the trust, ask them in writing and make
      them answer in writing"

      "also going at christmas means you run y11 mocks in november and
