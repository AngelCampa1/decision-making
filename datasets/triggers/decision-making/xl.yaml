      All of the paperwork so far, in the order it arrived.

      HORIZON-4 protocol, version 4.1, with the participant information sheet and
      the schedule of assessments. The sections I have gone back to:

      2.3 — "HORIZON-4 is a randomised, open-label phase III study comparing the
      investigational regimen plus standard therapy against standard therapy alone.
      Participants are allocated 1:1. Allocation is by minimisation and cannot be
      chosen by the participant or by the treating clinician."

      3.2 — "The primary endpoint is progression-free survival. Secondary endpoints
      include overall survival, quality of life, and safety. The study requires 460
      participants across 31 sites."

      4.1 — "Participants must be aged 18 or over, must have received no prior
      systemic therapy for this indication, and must be able to attend all scheduled
      visits at the participating site for the duration of the study. Participants
      must have a documented performance status of 0 or 1 at screening."

      5.1 — "Study treatment is administered on day 1 and day 8 of each 21-day
      cycle, for six cycles. Study treatment must be given at the participating site
      and may not be delegated to a local centre."

      5.4 — "In addition to treatment visits, participants attend a screening visit
      and follow-up assessments at weeks 12, 24 and 36. Follow-up assessments must
      also take place at the participating site."

      9.2 — "Travel costs are reimbursed at 45p per mile on production of receipts,
      to a maximum of £40 per visit. The study does not reimburse childcare, loss of
      earnings, or overnight accommodation."

      11.6 — "A participant may withdraw at any time and without giving a reason. A
      participant who withdraws returns to the care of the referring team and will
      be offered standard therapy in accordance with local protocols."

      Section 5.1 has no exception in it. I looked for one twice and then rang the
      trial nurse, who confirmed there is not one and said most people ask.

      Dr Marianne Osei, consultant, letter of 21 April 2026 —

      "I confirm that we discussed the HORIZON-4 study at your appointment on the
      20th. You meet the eligibility criteria and the Marlowe Centre has a slot,
      which they have asked us to confirm by 15 May, recruitment closing once the
      target is reached. The study is a reasonable option and the standard regimen
      remains a reasonable option; I would not want you to read the offer of a slot
      as a view about which is better for you. The published interim data are
      encouraging, but the study is not powered to report before 2028 and I cannot
      tell you in advance which arm you would be allocated to. Standard therapy
      would be given at St Cuthbert's on day 1 of a 21-day cycle for eight cycles."

      The forum thread on this runs to 212 replies. The three at the top:

      "Got on HORIZON-4 in the second wave and I would do it again tomorrow. If
      there is a trial open, you take the trial." (341)

      "Seconding this. The monitoring alone is worth it, they watch you like a hawk
      and nothing gets missed for six months." (297)

      "Gentle reminder that half of you get the standard arm and the driving is
      exactly the same either way." (12)

      Further down the same page, from an account that has answered nine other
      people in it — "I did 68 miles each way for a different study. It was around
      the second cycle that it stopped being a big adventure and started being a
      Tuesday." (14)

      What I wrote down in the car park afterwards and have added to since:

      - The Marlowe Centre is 68 miles. Door to door it has been between two hours
      and two hours forty every single time I have driven it.

      - Every visit I have costed puts me out of the house from 07:30 to 15:30,
      which is eight hours, and that is the good version where nothing overruns.

      - Anna has both children for the whole of a visit day at £9.50 an hour. She
      charges by the hour and not by the child, the rate is the same whatever day it
      falls on, and she has never once turned me down.

      - My sister can have them, but only ever on a Friday, and the day 1 and day 8
      pattern walks through the week so no study visit lands on one.

      - St Cuthbert's is four miles away and the 41 bus goes past the door.

      - Kit is 7 and Nell is 4. Their father sees them in the school holidays and is
      in Aberdeen the rest of the time.

      - I am on a 0.6 contract at the school and I have used 9 of my 12
      discretionary days on appointments already this year.

      Bea Whitlock, trial nurse at the Marlowe Centre, email of 8 May 2026 — "To
      confirm what I said on the phone. Visit days are fixed by the protocol and
      cannot be moved to suit childcare or work, and a missed day 8 is recorded as a
      protocol deviation. Parking is free for study participants using the code on
      your letter, though the code changes every quarter. We do not have a creche,
      and the waiting area is not somewhere I would ask anybody to bring a
      four-year-old for a day."

      Note in my phone, 9 May, 23:12 — "ask Bea whether week 12 counts from
      randomisation or from cycle 1 day 1. ask what happens if Kit is ill on a day
      8. ask whether the 40 is per visit or per person." None of the three have been
      asked.

      St Cuthbert's left a message about the standard regimen on the 7th: they can
      start on the 28th, their day 1 clinic runs on Mondays and Thursdays, and the
      slot is held for a fortnight.

      Prof. H. Lindqvist, second opinion, by email, 6 May 2026 —

      "Thank you for sending the notes and the protocol. My view differs from Dr
      Osei's in emphasis rather than in substance. The investigational arm is the
      more interesting of the two and I encourage any patient who can attend
      reliably to enter the study. Reliability of attendance is not a small point
      and I want to put it plainly: a participant who misses day 8 in the early
      cycles is of limited value to the study and carries the burden of it without
      the benefit of it. I would add that the withdrawal clause at 11.6 is the
      ordinary reassurance and is correctly stated, but the eight cycles at St
      Cuthbert's would then begin later than they would have begun, by however long
      the study has run."

      The slot has to be confirmed by 15 May and today is the 11th. The Marlowe
      Centre's own letter, which came separately and says almost nothing, gives a
      car parking code and a number for the research team that has gone to voicemail
      on all four attempts.

      My mother asks about it every day. She has not been told the part about the
      1:1 allocation, because the first time it came up she heard "trial" and heard
      "new drug" and I have not gone back over it since.

      The trial is plainly the right trial for the patient in that protocol, but is
      it the right trial for a patient with my two children?
    why: >-
      The generic case is made three times over in the body and the ask concedes it
      in its first half: "The trial is plainly the right trial for the patient in
      that protocol." What it then asks is whether the same recommendation survives
      one person's facts, which is the fit case rather than the ledger case —
      nothing here is unsorted, and Lindqvist has already named the variable that
      decides it in "Reliability of attendance is not a small point".

