      Farida (my accountant), 21 August —

      "Don't panic. This is a fairly standard enquiry outcome and the
      subcontractor point is arguable — we have the invoices, what we don't
      have is proof of payment for eleven of them, because those were cash.
      I would push back. Realistic outcome in my view: half of it goes away
      and the penalty lands around 15%."

      Second opinion, a tax adviser my brother-in-law uses, 29 August, on
      the phone. My notes from it, as I typed them:

        said the opposite. said cash payments to subbies with no CIS
          deduction is the
        thing they are actually looking at and that the 41k is the small
          half of the
        problem. asked whether I had filed CIS returns. I had not. said
          that is a
        separate penalty regime, £100 per month per return, and if it is
          two years of
        monthly returns that is its own number entirely. said get a
          specialist. would
        not quote.

      Farida, 1 Sept, when I put that to her —

      "That is a fair point and I should have raised it. I would suggest we
      deal with the enquiry first."

      The eleven invoices are from the same two subcontractors, both of whom
      I still use, both paid in cash at their own request, both of whose
      numbers I have. One told me in August that he "doesn't really do
      paperwork from back then". The other has not replied since 2
      September.

      The bookkeeper before Farida, in an email from 2022 that I found while
      looking for something else —

      "I've flagged this before but I'll put it in writing: if you're paying
      people in the trade you need to be operating CIS. It isn't optional
      and it isn't about whether they're employed or not."

      I have no memory of reading that email. It is in my inbox, marked
      read, with a reply from me saying "noted, thanks R".

      Time to Pay, from the phone call on 4 Sept, 41 minutes, my notes:

      - twelve months without much question - twenty-four months needs an
      income and expenditure form - interest at 7.75%, which is what she
      said. The website says 8.0 today - "a Time to Pay arrangement does not
      stop a penalty being charged and does not mean the amount is agreed" —
      she said that twice

      Broker, 8 Sept —

      "A further advance on the mortgage is possible at 5.6% but the lender
      will want the last two years of SA302s and a tax compliance statement.
      If there is an open enquiry you should assume they will find it. I am
      not going to tell you not to mention it."

      The business: turnover was 218,000 last year and will be about 140,000
      this year, because the contract that was a third of it ended in March
      and I have not replaced it. Two employees, one of whom is my
      sister-in-law.

      Dermot (co-director, 30%), 10 Sept —

      "mate what's the number. just tell me the number. if it's under 20
      I'll put in half and we forget about it, if it's more than that we
      need a different conversation and I'd rather have it now than in
      December"

      I have not told him about the CIS thing.

      My wife knows there is "a tax thing". She does not know there is a
      penalty regime with the word deliberate in it.

      The house has about 210,000 of equity, the fixed rate has three years
      to run and the early repayment charge is 3%. There is 8,400 in the
      business account, of which 6,100 is VAT for the quarter ending 30
      September.

      The appeal window: the amendment letter says 30 days from 19 August,
      so 18 September, which is Thursday. Farida says a holding appeal costs
      nothing and can be lodged in a line. The second adviser said the same
      thing. Neither of them has lodged it and neither has said that they
      will.

      Also in the folder, a letter from March that I never opened, which
      turns out to be the notice of enquiry for the 2022 return as well.
      Farida says the two will "probably be dealt with together". Probably.

      Decision is made — we are appealing the amendment and asking for the
      two years to be handled together. Draft the holding appeal letter to
      HMRC: reference the 19 August amendment, appeal the subcontractor
      adjustment, ask for the penalty position to be held pending the
      appeal, and ask for the 2022 enquiry to be conducted alongside it.
      Formal and short, with no arguments in it yet, because the arguments
      are Farida's job.
