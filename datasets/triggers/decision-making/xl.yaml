      design the team would choose on every axis other than regulatory. The
      open question is whether the supervisory authority regards the Dublin
      replica as a transfer requiring a separate notification under the
      sectoral rules, or as within the existing authorisation." Email from
      external counsel, 11 September — "We have looked at this and we are not
      going to give you a clean answer, because there is not one to give. The
      2024 guidance is drafted around a primary and a backup in the same
      member state and does not contemplate this pattern. We have seen the
      authority take both readings in adjacent sectors within the last
      eighteen months. Our best assessment is that they would more likely than
      not treat the replica as within the existing authorisation, and we would
      put that at something like seventy per cent, which is a number we are
      giving you reluctantly and which you should not treat as a calculation.
      If you want an answer rather than an assessment, the mechanism is a
      written enquiry to the authority. Their published service standard for a
      written enquiry of this kind is eight weeks and our experience is that
      eight weeks is optimistic." Email from the Chief Risk Officer, 12
      September — "I want to be clear about what I am and am not saying. I am
      not saying we cannot proceed on counsel's assessment; boards accept
      assessments every day. I am saying that if we build Design A and the
      authority later takes the other reading, the remediation is not a
      configuration change. It is a migration of the primary store performed
      under a deadline set by a regulator, in a system that will by then be
      carrying live volume, and I have been through one of those and would
      like not to go through another. Conversely, if we build Design B and the
      authority would have accepted Design A, we have bought a twenty-four
      hour recovery point objective for four years for nothing, and I do not
      want to pretend that is costless either. It is not obviously the safe
      choice. It is a different risk." Email from the platform lead, 15
      September — "The build itself does not care which we pick, and the cost
      difference over the programme is around three hundred thousand, which is
      inside the contingency. What the build does care about is when we pick.
      The storage layer is the first thing we lay down and everything else is
      written against it. If we choose in the next fortnight, the difference
      is a design decision. If we choose in January, it is a rewrite of about
      four months of work, because by then the services above it will have
      been built against whichever assumption we made in order to keep
      moving." Email from the programme director, 18 September — "For the
      avoidance of doubt on dates. The programme board approved funding on the
      basis of a go-live in October next year. That date is in the customer
      communications that went out in August. The eight-week enquiry, if we
      start it today, returns an answer in the middle of November at the
      earliest and counsel has told us to expect later. There is no version of
      this where we wait for the authority and also keep the storage decision
      open, because the platform lead's fortnight is a real fortnight." Email
      from counsel, 22 September, in response to my direct question — "You
      asked whether we can make the enquiry without signalling which design we
      intend, and whether an enquiry itself carries risk. Briefly: an enquiry
      is not without consequence. It puts the pattern in front of the
      authority in writing. Our assessment of seventy per cent is an
      assessment of how they would respond if the question arose. It is not an
      assessment of how they would respond to being asked in the abstract by a
      firm that is plainly about to do it, and those are not the same
      question. We would not describe the enquiry as high risk. We would
      describe it as not free." Email from the platform lead, 23 September —
      "One correction to what I said last week, because I have gone and
      looked. The fortnight is a fortnight for the storage layer itself. There
      is about six weeks of work above it that does not depend on the choice
      at all, so if we are prepared to reorder the plan we can buy perhaps
      five weeks before the decision becomes expensive rather than two. That
      still does not reach the middle of November and it costs us the buffer
      we were holding for the integration work, which is the buffer I would
      least like to spend. I am telling you because it changes the shape of
      the question and not because I am recommending it." My own note, 24
      September So the position is: one fact decides between two designs that
      share almost nothing, the fact is obtainable, obtaining it takes at
      least eight weeks against a fortnight of slack that might be five, and
      asking is not free. The storage decision goes to the design authority on
      8 October. Is making the enquiry and holding storage worth it, or do we
      choose on counsel's assessment and disclose that we did? Eight weeks
      exceeds five however anybody reorders the plan.
    why: >-
      The gap is named, both branches are costed, the price of asking is
      stated in weeks and in signalling, and the question sits before the
      sentence that prices it. Not timing: the two designs differ in content,
      not in when they start.
  - id: xl23p
    triple: xl23
    band: xl
    domain: money
    stakes: high
    ask: implicit
    route: hinge
    turn: >-
      Everything from the funder and the landlord, pasted, because they are
      asking for answers in the wrong order and I need to see it side by side.
      Grant decision letter, 2 June — "Your application has been shortlisted.
      Shortlisted applications proceed to a panel which meets quarterly; the
      next panel is 14 September. Approximately one in three shortlisted
      applications is funded. We are not able to indicate the likelihood in an
      individual case and panel members are not identified. Please note
      condition 7 of the scheme: the award may not be applied retrospectively
      to expenditure committed before the panel date, and any application
      withdrawn before the panel cannot be resubmitted in the same funding
      round." Email from the scheme administrator, 9 June — "In answer to your
      query, no, there is no mechanism for an early or provisional indication,
      and I would be careful of anyone who offers you one informally. On your
      second question: 'committed' in condition 7 means a binding obligation.
      Signing a lease is a commitment. A conditional agreement that can be
      walked away from without cost is generally not, but I am not able to
      advise you on whether a specific document falls one side or the other,
      and the panel takes a strict view." Email from the landlord's agent, 12
      June — "The unit has had two other enquiries this month. My client is
      prepared to hold it for you until 15 July on the basis of the heads of
      terms as drafted, and is not prepared to hold it past that. A
      conditional lease is not something my client will entertain; he has been
      through that before and the deal fell over after four months.
      Realistically, if you are not signing by the middle of July you should
      assume it will go." Note of conversation with our accountant, 18 June
      Two scenarios. With the grant, the fit-out is funded, we open in
      November, and the business plan is the one we wrote. Without the grant,
      we can still take the unit, but the fit-out has to come from the working
      capital facility, which takes our covenant headroom to almost nothing
      for the first two trading quarters, in a business that has never traded.
      She was careful to say she is not telling us it cannot be done, and
      equally careful to say she would not do it herself. Message from my
      business partner, 21 June — "I have been going round this all week. Here
      is where I have got to. If we knew the grant was coming, we sign in July
      and this is easy. If we knew it was not, we would either walk away from
      this unit and look again in the autumn, or take it on the facility with
      our eyes open, and I could argue either. What I cannot do is work out
      what to do while not knowing, because the two answers are not near each
      other and there is no cautious middle that is better than both." Second
      message, same day — "The other thing. I keep noticing that I want to
      wait, and I keep noticing that wanting to wait would feel exactly the
      same to me if the honest answer was that I am frightened of signing a
      lease. I do not think that is what is happening. I also do not think I
      would be able to tell." Email from the scheme administrator, 28 June, in
      response to a further query — "To confirm: if you sign an unconditional
      lease before 14 September, the lease costs themselves are not eligible
      expenditure, but the fit-out remains eligible provided it is not
      committed before the panel date. This does not change the position on
      withdrawal. I should add that we have had applicants sign leases before
      panel and be funded, and applicants do the same and not be funded, and
      the scheme cannot take the former into account as a reason to fund."
      Note of conversation with a former shortlisted applicant, 29 June,
      introduced to us by the accountant She was shortlisted twice. Funded the
      second time, not the first. She said the only thing she would pass on is
      that both times she spent the summer trying to read the tea leaves and
      both times the reading was worthless, and that the useful question was
      never "will it come" but "what do I do on the fifteenth of September if
      it does not". She also said, unprompted, that the year she was not
      funded she had already signed a lease, and that she does not regret it,
      and that she would not tell anyone else to do it. Email from the
      landlord's agent, 30 June — "To be helpful rather than otherwise: my
      client would accept a longer rent-free period in place of a lower rent,
      if that assists the cash position in the first two quarters. He will not
      accept a condition. I mention it because it changes the shape of the
      without-grant case somewhat and I do not think you had it in front of
      you." Message from my business partner, 1 July — "The rent-free changes
      the arithmetic and does not change the question, which is annoying. It
      makes the without-grant case survivable rather than reckless. It does
      not tell us whether we are in the with-grant world or the without-grant
      one, and that is still the only thing I actually want to know." Note to
      self, 2 July So: one fact decides it, the fact arrives on 14 September,
      the unit goes on 15 July, and nobody can tell me anything in between.
      Two months of gap and eight weeks on the wrong side of it. Everything
      hangs on 14 September, the unit disappears 15 July, and my partner
      rightly says neither of us distinguishes wanting more time from dreading
      a signature.
    why: >-
      One fact, a date it arrives, an earlier date that forces the decision,
      and an explicit statement that the person cannot tell wanting-to-wait
      from being-afraid. No question is asked, which is the implicit form.
