      wrong, we find out in year four with no way back." Letter from the two
      large customers' relationship manager, 1 March, forwarded by the
      operations director without comment — "Further to your enquiry: neither
      contract contains a change of control provision requiring consent, but
      both contain a twelve-month termination for convenience on notice.
      Historically both accounts have been renewed on the strength of the site
      relationship rather than on price, and I would not want to predict how
      either would respond to a change of ownership. I am aware this is the
      least helpful possible answer." Second note from our accountant, 3 March
      — "Since you asked. If the two accounts hold, the MBO's deferred element
      is almost certainly paid and the gap closes to under a million. If
      either goes in the first two years, the deferred element is largely gone
      and the gap is nearer four million. I cannot put a probability on that
      and neither can anyone else in this correspondence, including the people
      who have implied one. The trade offer does not carry that exposure,
      because the exposure transfers with the shares. That is the entire
      financial difference and everything else is detail." Email from my
      youngest sister, 5 March — "I have not said anything because I do not
      understand the numbers and I have been embarrassed about that. What I do
      understand is that we are four people who have not agreed about anything
      since the funeral, and that both of the two loudest arguments in this
      thread are being made by people who are certain. I would like someone to
      make each of them the way the other side would have to answer it, rather
      than the way it has been made to me." My own note, 8 March Neither of
      them is being unreasonable and neither of them has said anything the
      other could not answer. The trustees meet on 11 March. Before the
      trustees meet, can you set out who has said what and when they said it,
      in one page, with nothing added from you? My youngest sister has not
      read the whole thread and I would like the four of us going into the
      eleventh with the same account of what has actually been put to us.
    why: >-
      The same body, and the ask is for the material to be laid out with the
      model's own view explicitly excluded. The nearest miss to council in
      this band, and it is close on purpose.
  - id: xl19n1
    triple: xl19
    band: xl
    domain: career
    stakes: low
    ask: explicit
    kind: lookup
    turn: >-
      Everything from the last three weeks, in order, because I have been
      arguing both sides of this to myself since the first conversation. Offer
      letter, 3 October — "...the position of Regional Clinical Lead, based at
      the Leeds site, effective 1 January. Salary band 8c. The post carries
      responsibility for four services across three hospitals and reports to
      the Divisional Director. The post is substantive and the current
      postholder retires on 31 December. We would need a decision by 7
      November to run the handover." Email from my current clinical director,
      6 October — "I would be sorry to lose you and I am going to be honest
      rather than supportive. You are the best diagnostician in this
      department and I have said that in writing twice. The lead role is not a
      diagnostic role. It is four services, three sites, and about a day and a
      half a week of clinical time if you fight for it, which most people do
      not manage to keep. I have watched three people make this move. Two of
      them are good at it and neither of them is doing the thing they were
      exceptional at. One went back and it took her five years to be taken
      seriously in a clinic again. I am not telling you not to go. I am
      telling you that the thing you are good at is not what you will be
      doing." Email from the Divisional Director, 9 October — "I want to be
      straight with you about why we approached you rather than advertising
      first. The three services at the Bradford site have been in special
      measures on waiting times for two years and the last two leads have come
      from a management background and have not been able to move it. My view
      is that the reason is credibility: the consultants there do not believe
      a manager understands what they are being asked to do, and they are not
      entirely wrong. You would be believed. That is not a small thing and it
      is not something we can recruit for easily. Yes, the clinical time is
      protected on paper at one and a half days and yes, in practice people
      lose it. I would rather you took the job knowing that than found out in
      March." Message from Ravi, who did the equivalent job in the North East,
      14 October — "Do it. Everything your clinical director says is true and
      it is also the argument that keeps every good clinician doing the thing
      they are already good at until they retire. Someone is going to run
      those services. If it is not someone who has done the work, it is
      someone who has not. You will be worse at diagnosis in five years. There
      will also be four services that are not in special measures, and about
      eleven thousand people a year going through them. I am not going to
      pretend that trade is obviously right. I am saying it is a trade and not
      a mistake." Message from Hannah, who went and came back, 16 October — "I
      would not do it again, and I want to be careful because my case is not
      everyone's. Two things nobody told me. The first is that the clinical
      time goes in the first six months and it goes because you are the person
      who can fix something urgent, not because anyone takes it off you. The
      second is that coming back is not a door, it is a ladder, and the people
      on the rungs above you have been doing the thing you stopped doing. I
      got back to where I was. It took a long time and I was angry for most of
      it. That said: the services I ran are still better than I found them,
      and I know that because I still know people there." My partner, 21
      October — "I will support either and I mean it. I would only say that
      you have described the Bradford services to me at dinner about six times
      in two years without ever once mentioning that you might be the person
      who fixes them, and you have described your own clinic maybe twice."
      Anonymous feedback from the Bradford consultant body, forwarded by the
      Divisional Director on 18 October, unedited — "Eight responses.
      Paraphrasing the shape rather than quoting individuals. Six of the eight
      say some version of: we have had two leads who did not understand the
      work and we would give a clinician a hearing. Two say some version of:
      the problem here is not who the lead is, the problem is that we are
      three consultants short and no lead of any background can fix that, and
      appointing someone credible will buy the organisation another eighteen
      months of not fixing it. I include the second view because you should
      have it. I do not agree with it but it is not a stupid position and the
      two people holding it are not obstructive." Email from my clinical
      director, 20 October, after the above was shared — "I want to add one
      thing and then I will stop. The eighteen-months argument is the one I
      would take seriously if I were you, and it is not the argument I made to
      you. Mine was about your career. Theirs is about whether the job can be
      done at all, which is a different question and a better one. If they are
      right, you would be spending five years of the thing you are best at on
      a role that was structurally unable to deliver, and that is worse than
      the trade Ravi is describing." Note from the retiring postholder, 22
      October, who I asked directly — "I did keep the clinical time. One day,
      not one and a half, and I lost most of a year fighting for it. Whether
      that is encouraging or discouraging is up to you. On the eighteen
      months: it is true that appointing me bought the organisation time. It
      is also true that we are two short now rather than four, and that took
      six years and would not have happened without someone in this chair who
      could tell the difference between a rota problem and an excuse." My own
      note, 25 October Both of these are whole positions rather than opinions,
      and each of them is held by someone who has actually seen it. Whichever
      I read last is the one I believe. Decision due 7 November. Is there
      anything published on what actually happens to clinicians who move into
      a service lead role and then return to full-time clinical work? Hannah
      and my clinical director both stated it as a fact about the ladder, and
      I would like to know whether it is one or whether it is two people
      generalising from themselves.
    why: >-
      The same body, and the ask is whether a claim made inside it is
      supported by anything published.
