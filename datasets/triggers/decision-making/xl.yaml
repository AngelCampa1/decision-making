  - id: xl16n1
    triple: xl16
    band: xl
    domain: technical
    stakes: high
    ask: explicit
    kind: diagnose
    turn: >-
      Everything relevant is below, roughly in the order it landed on us.

      The commencement notice first, out of the department's bulletin of 19 June —

      "The Payroll (Statutory Deductions and Reporting) Regulations 2026 come into
      force on 6 April 2027. Regulations 4 to 11, which replace the existing banding
      for statutory deductions and introduce per-pay-period reporting of variable
      elements, apply to every payment made on or after that date. There is no
      transitional period and no easement by headcount. Final technical
      specifications will be published no later than 30 October 2026."

      Question 6 of the guidance circulated with it — "Employers who report variable
      elements incorrectly in the first three months after commencement will not
      incur a penalty where a correction is filed within the following quarter." So
      there is a soft landing on the reporting half and none at all on the banding
      half.

      What we actually run. Payroll is ours, written in 2011, about 180,000 lines of
      VB.NET sitting on a stored-procedure layer, 2,100 employees across fourteen
      legal entities, one monthly run and a weekly run for hourly staff. The
      deduction logic is half in the stored procedures and half in a rules table
      that the payroll team edit directly in production. Denise's team have edited
      that table an average of nine times a month since 2011. There is no version
      history on it and never has been.

      Merrow's quote, 22 July —

      "Merrow Payroll Cloud for 2,100 employees across fourteen entities: licence
      £164,000 per annum, implementation £310,000 fixed, three parallel cycles
      included. Earliest start 5 October 2026, go-live 1 March 2027, conditional on
      the data extract reaching us by 6 November 2026. Statutory changes are
      delivered by us under the licence. Historical payslips are not migrated and
      remain the customer's responsibility."

      Note from Priya, our finance director, 5 August —

      "The board looked at Merrow on Tuesday and will not fund it this year. The
      £310,000 is not what stopped it; the historical payslip exclusion is, because
      our retention obligation runs to 2031 and nobody in the room had an answer for
      it. It goes back into the 2028 plan. Anything done internally comes out of the
      £240,000 already sitting in the platform line, which covers either of the two
      internal options at our loaded rate of about £3,000 an engineer-week."

      The estimate table, pasted as it came out of the sheet because retyping it is
      how I get a digit wrong —

        option                 eng-wks   elapsed   confidence   lands
        patch the rules table    19       11 wk       high       15 Jan 2027
        rewrite deductions       34       15 wk      medium      12 Feb 2027
        Merrow                   12*      21 wk      medium       1 Mar 2027
        * our side only. Their twenty-one weeks is theirs.

      Elapsed is counted from 30 October, because neither internal option can finish
      the banding until the final specification exists, and both plans assume it
      arrives on the day the bulletin says it will. The last time this department
      published a specification it was six weeks late. Those six weeks would be six
      weeks on both of them, in the same place, for the same reason.

      Slack, Farida, who has been on payroll platform six years, 4 August —

      "the patch is 19 weeks because the rules table IS the patch. two new columns,
      an effective-date key, a backfill, a review step before anything writes. i've
      done the spike, it reconciles against last March's run to the penny. it is not
      elegant. it will still be here in 2035 and someone will still be typing into
      it by hand."

      Slack, Tomas, 11 August —

      "i'll build either, genuinely. honest version: 34 weeks is 34 weeks if nothing
      turns up and something always turns up in payroll. what i'd say for the
      rewrite is that it's the only one of the two where april 2028 is easier than
      april 2027. with the patch, april 2028 is april 2027 again, and so is the one
      after that."

      The 2023 change, for whatever it is worth as a base rate: we patched the rules
      table in eleven weeks against a fourteen-week plan, the first live run was
      clean, and the second run had two employees wrong for one period because a
      band boundary had been typed with the digits transposed. Farida found that in
      an hour. It was a smaller change than this one — one boundary moving, not the
      whole structure of the banding with a new reporting obligation on top of it.

      Testing, since both estimates lean on it. We can replay any historical run
      against a candidate build and reconcile employee by employee, which is what
      Farida means by "to the penny". That harness works the same way for both
      options and neither estimate includes building it, because it is already
      there. What it cannot do is test the new banding against anything, since no
      run under the new rules exists to replay, so both options are on synthetic
      cases right up to April.

      Internal audit, report of 30 June, finding 3 —

      "In the March 2026 monthly run, 41 employees received an incorrect statutory
      deduction. All 41 had a contract change effective part-way through the period,
      and all 41 sit in two of the fourteen entities. The control weakness is that
      the deduction rules table is edited in production without a second reviewer
      and without version history. Management response accepted. Remediation date 31
      December 2026."

      For completeness on that one: a contract change writes a new employment row
      carrying its own effective date, the monthly and the weekly run call the same
      stored procedure, and that procedure selects the rules row by pay date rather
      than by anything on the employment row. The 41 were corrected by hand in
      April. Nobody has been back to it since, and the weekly run has never thrown
      up the same thing.

      Audit's position on their own date, by email, 3 August — "A remediation date
      may be revised once where the reason is documented. A second revision is
      reported to the audit committee." Either option moves that date exactly once,
      because 15 January and 12 February are both after 31 December, so that part of
      it is the same on both sides and has been agreed in writing.

      Team and calendar, flat. Four engineers, plus a contractor who starts on
      Monday 7 September and is funded through to 31 March. Nothing ships in the
      last week of any month, which is the monthly run. The fortnight around the
      year-end run in April is closed to everyone. Both options start in the same
      week with the same five people, both finish before 6 April, and Priya has
      signed the money for either.

      What separates them, put as plainly as I can put it: the patch keeps the rules
      table and bolts a review step and a version key onto it; the rewrite deletes
      the rules table and moves the whole of the banding into code with tests around
      it. Fifteen engineer-weeks and four weeks of elapsed time between the two. One
      is £57,000 of our own time and the other is £102,000, against £240,000 sitting
      there.

      Denise, who runs payroll operations and would be the person typing into that
      table either way, 10 August — "I have edited it since 2011 and I have never
      once been asked to check it with anybody. If you take it off me I need
      somewhere to put a mid-month starter at four o'clock on a Thursday, and if you
      leave it with me I need the same thing, so I don't think this one is mine."

      Nobody has left the team this year and no reorganisation is coming. Farida and
      Tomas have worked together four years and neither has said a word against the
      other's estimate. Both estimates were built off the same spike branch and
      reviewed by the other person before they went in the sheet.

      Finding 3 is separate: only the mid-period contract changes came out wrong
      in March, and only in two entities. Given that the stored procedure selects
      the rules row by pay date rather than by anything on the employment row,
      explain in a paragraph why a mid-period contract change is the one case
      that logic gets wrong.
    why: >-
      Finding 3 supplies the symptom, "All 41 had a contract change effective
      part-way through the period", and the mechanism is already stated in the
      body -- the procedure selects by pay date, not by the employment row. The
      ask ties the two together and requests the explanation itself, not a ranked
      list of places to check, which is technical diagnosis and the skill's Abort
      clause excludes it by name. The ask opens on "Finding 3 is separate",
      holding the artefact apart from the April decision.
