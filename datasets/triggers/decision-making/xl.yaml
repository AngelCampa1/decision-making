  - id: xl01n1
    triple: xl01
    band: xl
    domain: career
    stakes: high
    ask: explicit
    kind: lookup
    turn: >-
      Everything is below. I have been reading it in a loop for a fortnight
      and I am no further on than I was on the 4th.

      Letter from HR, 4 Sept, PDF, first page —

      "Following the consultation meeting on 2 September, I write to confirm
      that your role of Senior Delivery Manager is at risk of redundancy as
      part of the proposed restructure of the Operations function. You have
      been offered the alternative role of Delivery Lead (Band 5).
      Alternatively you may indicate that you wish to be considered under
      the enhanced voluntary terms set out in Appendix B. Please confirm
      your preference by 26 September."

      Appendix B, the part that matters —

      "Enhanced payment: 3 weeks' pay per completed year of service,
      uncapped, plus payment in lieu of notice (12 weeks), plus accrued
      holiday. Payments are made subject to signature of a settlement
      agreement."

      From the HR FAQ circulated the same day, question 11 —

      "Q: If I accept the alternative role, can I later change my mind and
      take voluntary terms? A: No. The voluntary terms are available only
      during the consultation window and close on 26 September."

      Question 14, same document —

      "Q: Is there a trial period in the alternative role? A: Yes. A
      four-week statutory trial period applies. If you give notice during
      the trial period that the role is unsuitable, your redundancy
      entitlement is preserved."

      Those two answers are in the same PDF and I have read them about
      thirty times. The union rep says 14 is the statutory position and 11
      cannot override it. HR have not answered my email asking which is
      right — sent 10 Sept, chased 15 Sept.

      My numbers, from the payslip and the HR portal, which do not agree
      with each other:

      - 9 years 7 months of service. The portal says 9. The payslip says
      continuous service from 14/03/2016, and before that I was here 8
      months as a contractor on a rolling PAYE thing through an agency. -
      gross 71,400. The portal shows 71,400. The payslip shows a "market
      supplement" of 2,400/yr paid separately, which has been paid every
      month for three years. - Band 5 is 63,000-68,500. They have not said
      where in it.

      What I worked out on the train, pasted as it came out of the sheet
      because I do not trust myself to retype it:

        years     weeks   gross/wk   total
        9         27      1372       37,044
        9.5       28.5    1372       39,102
        9.5+8mo   30      1372       41,160
        plus PILON 12wk              16,464
        plus holiday (11 days)        3,021

      Teams message from my manager, 5 Sept, 17:52 —

      "off the record and please don't quote me. the Delivery Lead role is
      real but it's a holding pen. the org design has three of them and next
      year's plan has one. i'd take the money. i can't put that in writing
      and if you ask me in the meeting i'll say it's a genuine opportunity"

      Union rep — I'm in the union barely, I joined in 2019 and have never
      used it — 9 Sept —

      "Two points. First, if you accept the alternative role you retain
      continuity of service, and if they make you redundant in twelve months
      you would be paid on the same enhanced terms if the policy is still in
      force. The policy is reviewed every April. Second, the enhanced terms
      here are contractual rather than discretionary, which is unusual and
      worth knowing. Do not sign anything before somebody has looked at it."

      Solicitor, 11 Sept, after the free thirty minutes —

      "On the figures you have sent, the offer is at the generous end of
      what I see. The first £30,000 of the ex gratia element is tax free;
      PILON has been taxable in full since 2018. My fee for reviewing and
      signing off a settlement agreement is £1,450 plus VAT, and employers
      usually contribute £500-£750. I would not advise negotiating unless
      there is something you have not told me."

      Text from my wife, 12 Sept, 22:40 —

      "whatever you decide. I mean it. but can we not do the thing where you
      decide and then tell me it's fine for eight months"

      Same thread, 22:44 —

      "also the nursery deposit for Ada is due on the 1st, 640, I paid it"

      WhatsApp from Kemi, who was in the same consultation —

      "I'm taking Band 5. Not because I think it's good. My visa is on it."

      LinkedIn message from a recruiter, 15 Sept —

      "Saw the news about the restructure. I have two Delivery Manager roles
      in Leeds at 74-79 and one in Manchester at 82, hybrid three days. All
      three want a start before Christmas."

      The mortgage: our fixed rate ends 1 February. The broker said in July
      that a product transfer with our current lender needs no new
      affordability check, but a remortgage to anybody else does, and the
      remortgage is where the good rate is. About 190 a month between them.

      There is 640 in the current account and about 11,000 in an ISA I have
      been telling myself is for the extension.

      One thing I have not mentioned to anybody. In March I got to final
      stage somewhere else and withdrew, because Ada was three months old.
      The hiring manager emailed in July asking whether anything had changed
      and I did not reply.

      Nine years is a long time and I do not know whether that is a reason
      or a sunk cost. My father was made redundant twice and both times said
      it was the best thing that ever happened to him, which I have never
      entirely believed.

      Two things I want answered before I have an opinion about any of it.
      On the £30,000: does it apply to the enhanced payment alone, or do the
      PILON and the holiday pay count towards the same allowance? And the
      FAQ says the voluntary terms close on the 26th while also saying that
      a four-week trial period preserves redundancy entitlement — which of
      those is statutory and which is company policy? Just the rules and
      where they are written down.
    why: >-
      The identical pile. Two questions with determinate answers, and the
      last sentence declines a recommendation outright. This is the hardest
      negative in the triple because the questions are the ones the decision
      turns on.
