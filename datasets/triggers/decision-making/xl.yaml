# Band XL — 900 to 1,500 words. The band the `ledger` procedure exists for.
#
# Version 2 had no turn longer than 23 words. `ledger` is the procedure for "a
# pile of context ending in a question about what to do" and the corpus had
# never once contained a pile — the longest positive was a single sentence
# *describing* one. Every routing number ever published for `ledger` was
# measured on turns that were not its case. This band is the first time it is
# asked its own question.
#
# **The three members of a triple share a body.** Every pasted artefact is
# identical across the positive and its two negatives; the opening line and the
# closing ask are the only things that move. At a thousand words that means the
# label rests on roughly forty of them, which is the point: length, register,
# paste cues, subject matter, first-person rate and the presence of "should I"
# are all held fixed, so nothing but the ask can carry the label.
#
# The bodies were written once and expanded, rather than typed out three times,
# so byte-identity is a property of the construction and not of my care.
#
# One badly written body damages three items instead of one. Adjudication is
# therefore at the body level and a retired body retires its whole triple.
#
# Texture is deliberate — timestamps, copy-paste seams, numbers written two
# different ways, quoted messages with other people's punctuation, sentences
# that trail off, facts stated twice with different emphasis. Prose written to
# be read is the tell that a turn was authored for a benchmark, and at this
# length the tell is unmissable.

positive:
  - id: xl01p
    triple: xl01
    band: xl
    domain: career
    stakes: high
    ask: explicit
    route: ledger
    turn: >-
      Everything is below. I have been reading it in a loop for a fortnight
      and I am no further on than I was on the 4th.

      Letter from HR, 4 Sept, PDF, first page —

      "Following the consultation meeting on 2 September, I write to confirm
      that your role of Senior Delivery Manager is at risk of redundancy as
      part of the proposed restructure of the Operations function. You have
      been offered the alternative role of Delivery Lead (Band 5).
      Alternatively you may indicate that you wish to be considered under
      the enhanced voluntary terms set out in Appendix B. Please confirm
      your preference by 26 September."

      Appendix B, the part that matters —

      "Enhanced payment: 3 weeks' pay per completed year of service,
      uncapped, plus payment in lieu of notice (12 weeks), plus accrued
      holiday. Payments are made subject to signature of a settlement
      agreement."

      From the HR FAQ circulated the same day, question 11 —

      "Q: If I accept the alternative role, can I later change my mind and
      take voluntary terms? A: No. The voluntary terms are available only
      during the consultation window and close on 26 September."

      Question 14, same document —

      "Q: Is there a trial period in the alternative role? A: Yes. A
      four-week statutory trial period applies. If you give notice during
      the trial period that the role is unsuitable, your redundancy
      entitlement is preserved."

      Those two answers are in the same PDF and I have read them about
      thirty times. The union rep says 14 is the statutory position and 11
      cannot override it. HR have not answered my email asking which is
      right — sent 10 Sept, chased 15 Sept.

      My numbers, from the payslip and the HR portal, which do not agree
      with each other:

      - 9 years 7 months of service. The portal says 9. The payslip says
      continuous service from 14/03/2016, and before that I was here 8
      months as a contractor on a rolling PAYE thing through an agency. -
      gross 71,400. The portal shows 71,400. The payslip shows a "market
      supplement" of 2,400/yr paid separately, which has been paid every
      month for three years. - Band 5 is 63,000-68,500. They have not said
      where in it.

      What I worked out on the train, pasted as it came out of the sheet
      because I do not trust myself to retype it:

        years     weeks   gross/wk   total
        9         27      1372       37,044
        9.5       28.5    1372       39,102
        9.5+8mo   30      1372       41,160
        plus PILON 12wk              16,464
        plus holiday (11 days)        3,021

      Teams message from my manager, 5 Sept, 17:52 —

      "off the record and please don't quote me. the Delivery Lead role is
      real but it's a holding pen. the org design has three of them and next
      year's plan has one. i'd take the money. i can't put that in writing
      and if you ask me in the meeting i'll say it's a genuine opportunity"

      Union rep — I'm in the union barely, I joined in 2019 and have never
      used it — 9 Sept —

      "Two points. First, if you accept the alternative role you retain
      continuity of service, and if they make you redundant in twelve months
      you would be paid on the same enhanced terms if the policy is still in
      force. The policy is reviewed every April. Second, the enhanced terms
      here are contractual rather than discretionary, which is unusual and
      worth knowing. Do not sign anything before somebody has looked at it."

      Solicitor, 11 Sept, after the free thirty minutes —

      "On the figures you have sent, the offer is at the generous end of
      what I see. The first £30,000 of the ex gratia element is tax free;
      PILON has been taxable in full since 2018. My fee for reviewing and
      signing off a settlement agreement is £1,450 plus VAT, and employers
      usually contribute £500-£750. I would not advise negotiating unless
      there is something you have not told me."

      Text from my wife, 12 Sept, 22:40 —

      "whatever you decide. I mean it. but can we not do the thing where you
      decide and then tell me it's fine for eight months"

      Same thread, 22:44 —

      "also the nursery deposit for Ada is due on the 1st, 640, I paid it"

      WhatsApp from Kemi, who was in the same consultation —

      "I'm taking Band 5. Not because I think it's good. My visa is on it."

      LinkedIn message from a recruiter, 15 Sept —

      "Saw the news about the restructure. I have two Delivery Manager roles
      in Leeds at 74-79 and one in Manchester at 82, hybrid three days. All
      three want a start before Christmas."

      The mortgage: our fixed rate ends 1 February. The broker said in July
      that a product transfer with our current lender needs no new
      affordability check, but a remortgage to anybody else does, and the
      remortgage is where the good rate is. About 190 a month between them.

      There is 640 in the current account and about 11,000 in an ISA I have
      been telling myself is for the extension.

      One thing I have not mentioned to anybody. In March I got to final
      stage somewhere else and withdrew, because Ada was three months old.
      The hiring manager emailed in July asking whether anything had changed
      and I did not reply.

      Nine years is a long time and I do not know whether that is a reason
      or a sunk cost. My father was made redundant twice and both times said
      it was the best thing that ever happened to him, which I have never
      entirely believed.

      I have to say something by the 26th, which is Thursday week, and every
      time I sit down to write the email I end up rereading the FAQ instead.
      What do I do? I have got as far as knowing that the answer is not in
      the spreadsheet — I have done the spreadsheet four times and it comes
      out within about two thousand pounds of itself whichever way I run it,
      and I do not believe two thousand pounds is what this is about. I also
      know that I have been treating my manager's message as the most
      important thing in the pile because it was the most uncomfortable one
      to receive, which is not a reason. Past that I genuinely do not know
      what I am weighing against what.
    why: >-
      Eleven sources, one decision, and a deadline. Most of the pile is
      inert: the manager's off-the-record message and the contradiction
      between FAQ 11 and FAQ 14 are what it turns on, and the
      Glassdoor-shaped material here is the recruiter's message and the
      mortgage arithmetic. The last four words are the whole difference from
      the other two members.
  - id: xl02p
    triple: xl02
    band: xl
    domain: money
    stakes: high
    ask: implicit
    route: ledger
    turn: >-
      Right — all of it in one place, because it is currently spread over
      four inboxes and a folder of photographs of letters.

      HMRC letter, 22 July, reference on the top right which I am not typing
      out —

      "We are checking your Self Assessment tax return for the year ended 5
      April 2023. This is a compliance check under Schedule 36 Finance Act
      2008. We need the following information by 26 August: bank statements
      for all accounts used for business purposes, invoices and payment
      records for subcontractor costs, and a copy of your business records
      for the period."

      HMRC letter, 19 August —

      "Thank you for the information provided. We have concluded that
      expenses of £41,208 claimed under 'subcontractor costs' are not
      supported by the records provided. We propose to amend your return
      accordingly. On the basis of the amendment the additional tax due is
      £16,483.20 plus interest. We are also considering a penalty. Penalties
      for inaccuracies range from 0% to 30% of the potential lost revenue
      where the inaccuracy is careless, and up to 70% where it is
      deliberate."

      Farida (my accountant), 21 August —

      "Don't panic. This is a fairly standard enquiry outcome and the
      subcontractor point is arguable — we have the invoices, what we don't
      have is proof of payment for eleven of them, because those were cash.
      I would push back. Realistic outcome in my view: half of it goes away
      and the penalty lands around 15%."

      Second opinion, a tax adviser my brother-in-law uses, 29 August, on
      the phone. My notes from it, as I typed them:

        said the opposite. said cash payments to subbies with no CIS
          deduction is the
        thing they are actually looking at and that the 41k is the small
          half of the
        problem. asked whether I had filed CIS returns. I had not. said
          that is a
        separate penalty regime, £100 per month per return, and if it is
          two years of
        monthly returns that is its own number entirely. said get a
          specialist. would
        not quote.

      Farida, 1 Sept, when I put that to her —

      "That is a fair point and I should have raised it. I would suggest we
      deal with the enquiry first."

      The eleven invoices are from the same two subcontractors, both of whom
      I still use, both paid in cash at their own request, both of whose
      numbers I have. One told me in August that he "doesn't really do
      paperwork from back then". The other has not replied since 2
      September.

      The bookkeeper before Farida, in an email from 2022 that I found while
      looking for something else —

      "I've flagged this before but I'll put it in writing: if you're paying
      people in the trade you need to be operating CIS. It isn't optional
      and it isn't about whether they're employed or not."

      I have no memory of reading that email. It is in my inbox, marked
      read, with a reply from me saying "noted, thanks R".

      Time to Pay, from the phone call on 4 Sept, 41 minutes, my notes:

      - twelve months without much question - twenty-four months needs an
      income and expenditure form - interest at 7.75%, which is what she
      said. The website says 8.0 today - "a Time to Pay arrangement does not
      stop a penalty being charged and does not mean the amount is agreed" —
      she said that twice

      Broker, 8 Sept —

      "A further advance on the mortgage is possible at 5.6% but the lender
      will want the last two years of SA302s and a tax compliance statement.
      If there is an open enquiry you should assume they will find it. I am
      not going to tell you not to mention it."

      The business: turnover was 218,000 last year and will be about 140,000
      this year, because the contract that was a third of it ended in March
      and I have not replaced it. Two employees, one of whom is my
      sister-in-law.

      Dermot (co-director, 30%), 10 Sept —

      "mate what's the number. just tell me the number. if it's under 20
      I'll put in half and we forget about it, if it's more than that we
      need a different conversation and I'd rather have it now than in
      December"

      I have not told him about the CIS thing.

      My wife knows there is "a tax thing". She does not know there is a
      penalty regime with the word deliberate in it.

      The house has about 210,000 of equity, the fixed rate has three years
      to run and the early repayment charge is 3%. There is 8,400 in the
      business account, of which 6,100 is VAT for the quarter ending 30
      September.

      The appeal window: the amendment letter says 30 days from 19 August,
      so 18 September, which is Thursday. Farida says a holding appeal costs
      nothing and can be lodged in a line. The second adviser said the same
      thing. Neither of them has lodged it and neither has said that they
      will.

      Also in the folder, a letter from March that I never opened, which
      turns out to be the notice of enquiry for the 2022 return as well.
      Farida says the two will "probably be dealt with together". Probably.

      I have read all of this so many times that the words have stopped
      meaning anything, and I genuinely could not tell you at this point
      what it is I am choosing between. There is a version of it where the
      only real question is whether I tell Dermot before Thursday. There is
      a version where that is a detail and the question is whether the
      business survives a 140,000 year with this hanging over it. And there
      is a version where the only word that matters in any of the letters is
      deliberate and everything else is noise. I have had all three of those
      in the last hour.
    why: >-
      Nine sources, two of which contradict each other, a deadline on
      Thursday, and the turn ends by saying that the pile is the problem. No
      question mark anywhere in it. This is the ledger case in the form it
      actually arrives in, at the length it actually arrives at.
  - id: xl03p
    triple: xl03
    band: xl
    domain: technical
    stakes: low
    ask: explicit
    route: timing
    turn: >-
      Long one, sorry. All of the constraints in one place for once.

      The upgrade itself is decided. It was signed off in the platform
      review in June, the ticket has been open since, and nobody is arguing
      about whether. I am pasting the constraints because they have ended up
      in about six places.

      Vendor EOL page, copied 2 Sept —

      "PostgreSQL 13 will receive its final minor release on 13 November
      2025 and will reach end of life on that date. After this date no
      further security fixes will be issued."

      Our managed provider's note, 20 Aug —

      "Instances remaining on version 13 after the end-of-life date will be
      automatically upgraded during the maintenance window declared for the
      region, beginning 1 December. Customers who wish to control the timing
      of the upgrade should perform it before this date."

      So there is a date after which it stops being our decision, and that
      date is 1 December.

      From the runbook, which Yusuf wrote and which is good:

      - logical replication cutover, target read-only window 25-40 minutes -
      rollback is possible up to the point the writes are switched, and not
      after - "the extension list is the risk. pg_stat_statements and
      postgis are fine. the two we vendored in 2021 have no v16 build and I
      have not been able to reach the author."

      Yusuf, Slack, 3 Sept 09:14 —

      "the two vendored extensions are used by exactly one report, the
      finance month-end one, and I think we could drop them if finance would
      run that report a different way. I've asked. no reply yet"

      Yusuf, Slack, 3 Sept 09:16 —

      "should we just do it in the october window and eat the risk?
      genuinely asking"

      Priya (finance systems), Slack, 4 Sept —

      "month end close runs 1st-4th of every month and I cannot have the
      database move during it. Year end is different, that's 1-11 January,
      and it is worse."

      Change advisory board minutes, 5 Sept —

      "The board notes the November end-of-life date. The board declines to
      approve any change during the Black Friday period (17 November - 2
      December). The board asks that any change requiring a read-only window
      be scheduled on a Saturday and notified ten working days in advance."

      Security, email 28 Aug, to me and Sasha —

      "Please confirm the remediation date for the PostgreSQL 13 end of
      life. Our policy is that unsupported database versions are a P2
      finding after the EOL date and a P1 finding thirty days after that.
      The auditors will ask in the February fieldwork."

      Sasha replied to that, all —

      "Confirming we have a plan. Timing TBC."

      Two customer contracts have a clause I had forgotten about:

      "The Supplier shall provide not less than twenty (20) Business Days
      written notice of any planned maintenance affecting availability of
      the Service."

      Twenty business days from tomorrow lands on 3 October, which makes the
      4 October weekend legal by one day, and only if the notice goes out
      tomorrow morning.

      On-call rota, as it stands:

      - Yusuf is on call the weekends of 13 Sept and 11 Oct - Yusuf's last
      day is 31 October. He is going to a competitor and has been entirely
      decent about it - after that it is me, Ravi and Tom. Ravi has been
      here seven weeks - Tom did the last two upgrades with Yusuf and
      describes his own involvement in them as "holding the torch"

      Incident review from the 2023 upgrade, action 3, still open —

      "Action: capture query plans before and after so that a planner
      regression can be identified rather than argued about. Owner:
      platform. Status: open."

      Nobody has done action 3. We have no baseline plans captured.

      Staging is a restore from a three-week-old snapshot at a quarter of
      the data volume. Yusuf's note on it: "staging will tell you the
      migration completes. it will not tell you anything about the plans."

      The finance month-end report, the one that needs the vendored
      extensions, is a 40-page PDF that goes to the board. Priya, 5 Sept:
      "it could be rewritten. it would take me a fortnight and I do not have
      a fortnight until December."

      Cost, since it will come up: the provider bills the replica for the
      duration of the cutover, about $180 for a weekend, which nobody cares
      about and which I am only including because Sasha will ask.

      The thing that is not written down anywhere: the last time we did
      this, in 2023, the read-only window was estimated at 30 minutes and
      ran to 2 hours 50, because of an index build nobody had modelled. The
      postmortem is linked above. Yusuf ran that one too.

      Ravi, Slack, 8 Sept —

      "happy to be involved either way, but I should say I have not run a
      production migration before and I would be learning on the night. that
      is fine if somebody senior is on the call and less fine if I am the
      senior one."

      Also, the read replica the reporting stack points at is on 13 as well,
      and the runbook does not mention it. I noticed that yesterday. Yusuf's
      answer when I asked him: "ah."

      The two candidate weekends are 4 October and 8 November. The 8th is
      five days before EOL and nine days before the freeze. The 4th is after
      the month-end close and, just, inside the notice clause.

      So: do we go on 4 October while Yusuf is still here, or on 8 November
      with more time to capture the plans and a team that has never done one
      of these without him?
    why: >-
      The direction is settled, said to be settled in the first sentence,
      and every constraint in the body is about the moment. The provider's 1
      December auto-upgrade is the undo price and the twenty-day notice
      clause is the real deadline.
  - id: xl04p
    triple: xl04
    band: xl
    domain: relationships
    stakes: high
    ask: embedded
    route: ledger
    turn: >-
      I am going to put all of it down here, because every time I explain it
      to somebody I leave out a different bit.

      Background: separated March 2023, two children, Iris is 9 and Sam is
      6. No court order — we did it through mediation and then wrote it down
      ourselves. Roughly week about, changeover Sunday evening, and it has
      mostly worked.

      The thing we wrote down ourselves, in full, because it is four lines:

        1. The children live with both of us, alternating weeks,
          changeover Sunday 6pm.
        2. Neither of us moves them more than 40 miles without the other
          agreeing in
        writing.
        3. We tell each other about school things within 48 hours.
        4. We review this every August.

      We have never once reviewed it in August.

      Email from Nadia (their mother), 12 August, 23:11 —

      "I've been offered the job in Edinburgh. It's a step up and it's the
      first thing since we split that has felt like mine. I'd want to go for
      January. I know this is a big thing. I'm telling you now rather than
      in November because you asked me to."

      Nadia, 19 August —

      "To be clear, I'm not asking your permission. I'm asking you to talk
      about it properly."

      Mediator's note from the original agreement, 2023 —

      "Both parents agree that neither will relocate the children's
      principal residence more than 40 miles without the written agreement
      of the other or an order of the court. This agreement is not legally
      binding but records the parties' intentions."

      Solicitor (mine), 26 August —

      "A parent may not remove a child from the jurisdiction without consent
      or an order. An internal relocation is a different and weaker
      application. If you object, the route is a prohibited steps order, and
      the court's question will be the children's welfare rather than the
      agreement you signed. Realistically, contested internal relocation
      cases are hard to win, and I would want you to be clear about what you
      are asking the court to prevent. My rate is £280 an hour and a
      contested application is not a small number."

      Iris, in the car, 4 September, more or less exactly —

      "Mum says Edinburgh has a beach. Is that true? Are you coming?"

      Sam's teacher, at the September meeting —

      "He's had a much better start than last year. The nurture group has
      helped and he has two friends in his class now, which he did not have
      in Year 1. I'd be cautious about anything that moves him this year."

      Sam has a CAMHS referral from June. The letter gives the current wait
      as 14 months and an estimated first appointment of August 2026. The
      service is county-based.

      Nadia's mother, WhatsApp, 8 September —

      "She's not thinking straight. I've told her. You know she's not."

      My sister, the same evening —

      "She is thinking straight. She's had two years of being the one who
      stayed. You're allowed to be devastated and she's also allowed to go."

      Nadia, 11 September, which arrived while I was drafting this —

      "Proposal, and I have thought about it. Term time with me, every other
      weekend and half of all holidays with you, and I pay the travel. Or:
      they stay with you in term time and come to me for the holidays, and I
      accept that, and I would need you to say you would actually do it and
      mean it, because five days a week is not three days from home."

      That second option is real. She meant it. I have read it about forty
      times.

      Iris's swimming club, from the email in July —

      "Congratulations — Iris has been selected for the county development
      squad for the 2025/26 season. Training is Tuesday and Thursday
      evenings and Saturday mornings at the pool in town. Places are held
      for the season and cannot be deferred."

      She has wanted that for two years. It is the only thing she has ever
      asked me to take seriously.

      A thing I noticed reading back over the emails: Nadia's first message
      says January, and the offer letter she forwarded on 20 August, which I
      have also read forty times, says the start date is "to be agreed, and
      in any event no later than 31 March". She has not mentioned that and I
      have not asked.

      My work: I can do three days from home. Not five. Edinburgh is four
      and a half hours door to door driving, or 55 minutes flying plus two
      trains, and about 140 return if I book late, which I would be.

      The school year has started. Nadia's job starts 6 January and she says
      she has to answer by 30 September.

      I keep starting this message and deleting it. Do I fight this? I have
      written that sentence down twice now and I am not sure it is even the
      question, because there is a version where I say yes and move myself,
      and a version where I say yes and stay, and a version where the thing
      I am actually objecting to is January rather than Edinburgh. I have
      looked at none of them properly.

      Money: I pay 380 a month, informally, with no CMS assessment. If they
      move I would be travelling instead, which is more, and the 380 would
      still be the 380.

      What I actually think, when I am honest, is that week about would
      become one weekend in three and a bit of the summer, and I would go
      from being their father to being somebody they visit. I do not know
      how to say that without it sounding as though it is about me, and I am
      not certain that it isn't.
    why: >-
      Eight sources that disagree, a deadline on the 30th, and the asker
      noticing mid-turn that the question they wrote down is not the
      question in front of them. The two paragraphs after the ask are the
      ones that would change the answer, which is what makes it embedded
      rather than decorative.
  - id: xl05p
    triple: xl05
    band: xl
    domain: health
    stakes: high
    ask: implicit
    route: fit
    turn: >-
      Everything in one place, because I have now had the same conversation
      four times and it keeps going the same way.

      Consultant's letter, 14 June —

      "Mrs Bergström has a longstanding scapholunate ligament injury with
      early degenerative change. I have discussed the options with her. My
      recommendation is a partial wrist fusion. This offers reliable pain
      relief with a predictable loss of approximately 40-50% of
      flexion-extension range. Recovery is six weeks in a cast followed by
      three to four months of hand therapy, with a return to most activities
      at six months."

      Same letter, last paragraph —

      "She is understandably concerned about her occupation. I have advised
      that most patients return to full function for activities of daily
      living."

      Physio's notes, forwarded 20 June —

      "Grip strength R 18kg, L 31kg. Pain 6/10 at rest after activity, 8/10
      with loaded rotation. Patient reports symptoms are worst on days with
      more than four hours of work."

      Second opinion, 2 July —

      "I agree with the recommendation. I would add that delay is not
      neutral. The degenerative change progresses, and the salvage options
      at that point are narrower."

      Both of them are right and neither of them has asked what I do.

      What I do: I am a British Sign Language interpreter, freelance, and
      have been for nineteen years. Forty to fifty per cent of flexion and
      extension is not a percentage of a hobby. Fingerspelling and perhaps a
      third of the signs I produce in a working day are wrist. I have asked
      both consultants what a partial fusion means for BSL production
      specifically, and both have said, in almost the same words, that they
      have not had a patient who does this.

      The support group, which is two thousand people and almost none of
      them interpreters, is unanimous:

        "Have it done. I waited four years and I wish I hadn't." (top
          post, 380 likes)
        "Best thing I ever did."
        "The waiting is worse than the surgery, I promise you."

      I found two interpreters eventually. One had a fusion in 2019, moved
      into training and assessment, and says she is happier. One had a
      different operation and does not think the comparison holds.

      Hospital letter, 1 August —

      "You have been placed on the waiting list for the procedure above. The
      current wait for this procedure at this hospital is 22-30 weeks. If
      you decline two reasonable offers of a date you may be returned to the
      care of your GP."

      So the date is not entirely mine either. Twenty-two weeks from 1
      August is 2 January; thirty weeks is 26 February.

      Income and cover, since that is the actual constraint:

      - last tax year 51,200, of which about 40,000 is agency-booked and
      11,000 is a standing contract with the college - the college contract
      says: "The Interpreter shall provide a suitably qualified substitute
      in the event of unavailability." There are four other qualified
      interpreters within an hour of here and two of them are already full -
      income protection: I looked into it in 2021 and did not take it out -
      critical illness cover: no - savings, roughly six months: 14,000,
      against expenses of about 2,300 a month

      Agency (Bramble), 3 September —

      "Just to flag — we're planning the January to June bookings now. If
      you can tell us by the end of September what your availability looks
      like, we can protect the regular assignments. If we find out in
      December, we will already have given them to somebody else and I can't
      undo that."

      The college contract renews on 1 September each year. I signed it on
      28 August, three weeks ago, knowing all of this. There is one more
      document, which is that contract, clause 11 —

      "Either party may terminate this agreement on three months' written
      notice. In the event that the Interpreter is unable to provide
      services for a continuous period exceeding eight weeks, the College
      reserves the right to terminate with immediate effect."

      Eight weeks is exactly the cast plus a fortnight. I read that clause
      on the day I signed it and have not thought about it since, until I
