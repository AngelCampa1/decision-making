      Typed into my notes on the train and left as it came out —

        31 Aug: last pay 31 Aug, start elsewhere 1 Sept, no gap
        31 Dec: paid to 31 Dec, Ravi in Leeds from 1 Sept
        4 months of the rent here at 780 = 3,120, on top of Leeds at 1,180
        TLR2b here 5,481, gone either way unless St Aidan's give one
        1 Sept progression +1,462, but not if notice is in for 31 Aug (s.6)
        mocks 9-20 Nov, results out 11 Dec, intervention groups the week
          after that
        half term 25-29 May, so the 31st is the Sunday at the end of it

      Term dates as published for next year: autumn 2 September to 18
      December with half term 26 to 30 October, spring 4 January to 26
