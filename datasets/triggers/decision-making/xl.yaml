      Money column, national paper, 12 April 2026 —

      "If you are a higher-rate taxpayer the order is almost always the same.
      Pension first, up to the point where you are no longer paying forty per
      cent on anything. A pound into the pension costs you sixty pence. There
      is no mortgage rate on earth that beats an instant sixty-seven per cent
      uplift, and people who overpay a mortgage while leaving higher-rate
      relief on the table are choosing the smaller of two certainties."

      The lender's own guidance page, undated —

      "Overpaying your mortgage reduces the interest you pay over the life of
      the loan and can shorten the term. Most lenders allow you to overpay up
      to 10% of the outstanding balance each year with no early repayment
      charge. Check your annual allowance before making a lump-sum
      overpayment."

      The flowchart everybody links to, step 5 onward —

      "Step 5: clear any debt above 4%. Step 6: pension to the higher-rate
      threshold. Step 7: everything else. A mortgage at or under 4.5% is not
      an emergency. A pension contribution you did not make is a year you
      cannot get back."

      The same flowchart, the footnote under it that nobody quotes —

      "This ordering assumes a UK taxpayer who expects to draw the pension in
      the UK. It also assumes an intact emergency fund and a job that is not
      at risk. It is a default for people who have not told us anything about
      themselves, and it is not a plan."

      Mortgage statement, printed 1 July 2026 —

        Outstanding balance         218,264.66
        Product                     5-year fixed, 4.19%, ends 31/10/2028
        Monthly payment             1,291.07
        Term remaining              21 years 4 months
        Overpayment allowance       22,140, being 10% of the balance at
                                    1 January, which was 221,400
        Allowance used this year    nil
        Early repayment charge      3% of anything repaid above the allowance
        Printed on the back         "A product transfer to a new fixed rate
                                    may be arranged from four months before
                                    the end of your current deal.
                                    Overpayments do not reduce your monthly
                                    payment unless you ask for a
                                    recalculation; by default they shorten
                                    the term."

      Pension projection, provider's portal, printed 2 August 2026 —

        Fund value now              96,412
        Salary                      78,000
        My contribution             5%, so 3,900
        Employer contribution       5.5%, so 4,290
        Annual allowance            60,000
        Used this tax year          8,190
        Projected at 67, in today's money            341,000
        Same, with a further 500 a month from now    498,000
        Normal minimum pension age  57

      Benefits handbook, page 11 — "The Company contributes 5.5% of salary
      regardless of what you pay in, and will match employee contributions
      above 5% up to a further 3% of salary, provided the contribution is made
      through salary sacrifice. Matching is reviewed annually and is not
      contractual." Nobody in my team has been able to say whether an extra
      500 a month attracts the match, and the pensions inbox has had that
      question since 21 July.

      Email from Hana, our accountant, 5 August 2026, all of it —

      "Thanks for the figures. Short answer: pension, and on the numbers as
      they stand it is not close.

      You are paying forty per cent on the top nine thousand or so of your
      salary. Every pound you put in by salary sacrifice comes out of that
      band, so the pound costs you sixty pence and lands as a pound, and you
      save the employee National Insurance on it as well. Against that, the
      mortgage is 4.19% and fixed until 2028, so an overpayment buys you a
      guaranteed 4.19% and nothing else. Sixty pence buying a pound beats
      4.19% by a distance and I would not spend long on the comparison.

      The overpayment allowance is 22,140 this year and you have used none of
      it, so nothing is time-critical on that side. The early repayment charge
      only bites above the allowance, and at 500 a month you are nowhere near
      it.

      One thing I have not modelled, because you have given me nothing to
      model it with: if you are not UK resident when you draw it, the pension
      is taxed where you are resident then, and the twenty-five per cent
      tax-free element is a UK rule and not a universal one. Send me something
      firm and I will run it again. — H"

      Rui's side of it, which none of the above has in it:

        - Rui was offered a role in Lisbon on 28 July. The offer is
          conditional on the company getting a visa slot, and the appointment
          for that is 4 February 2027.
        - The role starts 1 March 2028 if the visa lands, and "we would
          revisit" if it does not. That is the hiring manager talking, not a
          contract.
        - Neither of us has resigned anything.
        - If we go, the flat here is let and not sold. The lender's
          consent-to-let form says the rate is unchanged for the remainder of
          the fixed period and then reverts.
        - I am 41. Rui is 44. Portugal changed its rules on foreign pension
          income in 2024 and I have read two pages about it and understood one.
        - If the February slot does not come up, the next round of visa
          appointments is September 2027.
        - Neither employer has been told anything.
        - The salary sacrifice change goes in through the payroll portal and
          takes effect the month after it is submitted. Cut-off is the 20th.

      Other numbers, since they always get asked for: salary 78,000, no bonus
      this year and 4,100 last year, 19,000 in an easy-access account which is
      four months of everything, and no other debt since the car loan finished
      in May. Rui earns 46,000 here. The Lisbon figure is 61,000 euros, which
      the recruiter wrote as "61k" and the offer letter writes as "61.000,00
      EUR", and I read it twice before I was sure they were the same number.

      What I typed on the train, before I had the statement in front of me,
      using 220,000 as the balance because that is what I thought it was:

        500 a month at the mortgage, 24 months     12,000 off the balance
        interest that saves over those 24 months   about 520
        the same 500 a month into the pension      about 20,000 in, grossed up
        pot at 67 on that, per the projection      +157,000

      The 157,000 is 498 minus 341 out of the projection above. The 20,000 is
      12,000 of my money at sixty pence in the pound.

      What that sheet has nothing in it for: what the 498,000 is worth if it
      is drawn in Portugal, what the flat earns as a let, and whether the
      4.19% survives a consent-to-let renewal when the fix ends in 2028. Hana
      has the first one and has said what she needs for it. The lender has
      never been asked the third one.

      Dev at work, who does this for fun, 4 August — "you are 41, on a fixed
      rate under inflation, possibly moving to a country whose tax regime you
      have not picked yet. the flowchart has no box for that."

      That is all of it, and all of it is other people talking.

      The pension won and the payroll form is due on the 20th. Draft the note
      to my line manager telling her the new figure, four lines at most.
    why: >-
      "The pension won" closes the question in four words, and what is left is
      a short piece of writing for a named reader against a deadline. The
      shared material never forecloses the pension, so no artefact in the body
      argues with the sentence that settles it.

