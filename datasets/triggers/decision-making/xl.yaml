      of my children in the event that no other person has parental
      responsibility for them at the date of my death.'"

      "An appointment of this kind takes effect on death and confers
      parental responsibility on the person appointed. We should make
      clear that it does not operate in every circumstance. Whether it
      operates at all turns on the position of any other person holding
      parental responsibility at the relevant time, which we have
      discussed with Mrs Brannigan and which she is content with."

