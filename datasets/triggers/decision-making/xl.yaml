      (final salary section) with an accrued pension of £14,206 per annum payable
      from age 65. The cash equivalent transfer value quoted by the scheme on 3
      March 2026 is £412,000. Mrs Ashworth holds a defined contribution arrangement
      with a fund value of £86,400 at the same date."

      3.7 — "To equalise the parties' pension income at Mr Ashworth's normal
      retirement age of 65, I calculate that a pension sharing order of 41% of the
      cash equivalent transfer value would be required. To equalise the capital
      values of the parties' pension rights the figure is 39.6%. The difference
      arises from the parties' respective ages and from the guarantees attaching to
      the final salary section."

      4.2 — "Where the parties prefer a clean break, the pension may instead be
      offset against other capital. I am asked whether a discount falls to be
      applied to the transfer value for that purpose. A discount for utility is
      commonly applied, in a range of 15% to 35%, to reflect that pension capital is
      neither accessible nor spendable before the relevant age. I do not consider it
      appropriate for me to select a single figure within that range, that being a
      matter for the court."

      4.9 — "I have not been asked to consider, and have not considered, the effect
      of either party's state pension entitlement."

      5.4 — "My calculations assume that both parties draw their benefits at Mr
      Ashworth's normal retirement age of 65, that Mrs Ashworth's fund grows at the
      middle of the three prescribed rates, and that neither party remarries. I am
      not instructed on the health of either party and have assumed standard
      mortality for both."

      Halloran Webb, Nadia Kerr, my side, letter of 18 May 2026 —

      "Thank you for sending the report on. In my view the correct starting point is
      paragraph 3.7 and the income equalisation figure of 41%, which would produce a
      pension sharing order in your favour of approximately £168,920. A pension
      sharing order is itself a clean break as regards the pensions; offsetting,
      which is what the other side propose, is not, and I would want you to be clear
      about that distinction before the FDR. The scheme charges £1,200 to implement
      a sharing order and its implementation period is four months from the date the
      order takes effect. The transfer value quoted on 3 March is guaranteed for
      three months only. Nothing either side puts forward at this stage binds
      anybody until an order is made. The FDR is listed for 22 June 2026 and updated
      figures are due to the court by 5 June."

      Pentlow & Ridge, acting for him, letter of 21 May 2026 —

      "Our client's preference is for a clean break on a capital basis. Applying to
      the single joint expert's paragraph 4.2 a discount of 30%, the figure at
      paragraph 3.7 of £168,920 reduces to an offset of £118,244. Against that our
      client is willing to transfer his entire interest in the former matrimonial
      home, being £159,000 on the agreed valuation, and to meet the conveyancing
      costs of the transfer. Our client would consider an attachment order in the
      alternative, though he does not regard it as the sensible course and neither,
