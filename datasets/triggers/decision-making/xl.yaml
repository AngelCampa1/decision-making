      two potential related donors, which has been sent to the reference
      laboratory. We would expect a result within eight to ten weeks. If
      either proves a suitable match, the pathway is a planned living-donor
      procedure, which we would ordinarily schedule within four to five months
      of confirmation. If neither is suitable, the pathway is the
      deceased-donor list, and the median wait for a patient with these
      antibody levels is currently just over three years." Email from the
      transplant coordinator, 9 January — "To answer your question directly:
      no, we cannot expedite the typing. The reference laboratory is the only
      one that does this panel and eight to ten weeks is their current
      turnaround, not a target we can push. I know that is not what you wanted
      to hear. I would also say, because people often ask this at this point,
      that there is genuinely no way to form a view in advance. Sibling
      matching is a coin toss with better odds and worse consequences, and
      anyone who tells you they can guess from the family history is
      guessing." Note of phone call with my brother, 11 January He has done
      the test and he does not want to be told the result before I am. He said
      he would rather not spend two months either feeling responsible or
      feeling useless. He also said, and I am writing this down because I want
      to remember he said it, that if he is not a match he does not want that
      to become a thing in the family. Email from HR, 14 January — "Further to
      our meeting. The extended medical leave scheme is available to you and I
      would encourage you to take it if you need it. I should set out the
      mechanics honestly. The scheme runs for up to twelve months at full pay,
      starting from the date you commence it, and it can be taken once in any
      five-year period. It is not possible to start it, pause it, and resume.
      If you commence in February and the procedure happens in September, you
      would have five months of the entitlement remaining for the recovery
      period. If you commence at the point the procedure is scheduled, you
      would have the full twelve months from that date. The reason I am
      setting it out at this length is that several people have started the
      scheme early, in good faith, and been left short at the end, and I would
      rather you had the arithmetic in front of you." Email from my manager,
      15 January — "Whatever you decide. I would only say that the reason I
      raised it in the first place is that you have been coming in and you
      have not been well, and I am not going to pretend I have not noticed.
      The team can cover. What the team cannot do is cover twice, six months
      apart, and I would rather you took the leave once at the right moment
      than twice at the wrong ones." My own note, 18 January The whole thing
      turns on the typing result and nothing else. If my brother is a match,
      the right move is obviously to keep working now and take the leave in
