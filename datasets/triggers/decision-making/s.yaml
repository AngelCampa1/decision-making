    domain: technical
    stakes: low
    ask: embedded
    route: ~
    turn: "Do we keep supporting the on-premise build? It is two per cent of revenue and about half of the support tickets we get."
    why: >-
      The question is the first sentence and the two facts that bear on it come
      after it, which is the embedded form. Neither fact settles it: two per cent
      is small and half the tickets is large.
