# Band S — one line, 25 words or fewer.
#
# **Exactly the version 2 range.** Every turn the old corpus contained fits
# here, so version 3 can be asked whether it reproduces version 2 inside its own
# band rather than only whether it disagrees with it. Where a version 2 item
# survives, its id is named in `why`.
#
# What changed is not the positives, it is what sits next to them. In version 2
# the positives ran at a median of 18 words and the negatives at 8, so a ruler
# scored 0.890. Here every negative is authored to its positive's length, and
# the label has to come from what is being asked.

positive:
  - id: s01p
    triple: s01
    band: s
    domain: career
    stakes: high
    ask: explicit
    route: fit
    turn: "Everyone says build six months of runway before quitting. My visa is tied to my employer. Should I still wait?"
    why: "v2 p04. Sound general advice, and one stated fact that may overturn it here."
  - id: s02p
    triple: s02
    band: s
    domain: money
    stakes: high
    ask: explicit
