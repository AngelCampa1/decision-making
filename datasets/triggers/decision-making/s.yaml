      Low stakes, genuinely undecided, two sources that disagree and no question
      asked. The eager reading fires here; the cautious one does not, which is
      what makes it worth having.

  # s15-s24 were added to take the short arm from 24 positives to 48. The short
  # arm, not the long one, is what binds the power of the length experiment:
  # with 24 short positives at a reference rate near 0.95 the design saturates
  # around 0.65 however many long items are added, and 400 long positives still
  # reach only 0.798. See the report accompanying this change.
  - id: s15p
    triple: s15
    band: s
    domain: money
    stakes: low
    ask: explicit
    route: ~
    turn: "Check my thinking on the boiler: two quotes, 3,400 and 4,900, the dearer one with a ten-year guarantee, and both want an answer tomorrow."
    why: >-
      Two options, one differentiator and a deadline, stated as facts. The
      imperative opener is on a positive on purpose: an imperative first word is
      otherwise a negative's tell, and a corpus where it is one has taught the
      feature the label.
  - id: s16p
