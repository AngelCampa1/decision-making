  # Negatives for s15-s24. Three deliberate departures from the negatives above,
  # each because the shortcut battery measured the old habit and found it:
  # closing punctuation is mixed rather than uniformly a question mark, five
  # negatives close on an imperative and three positives do too, and every
  # `compute` ask below was worked through before it shipped.
