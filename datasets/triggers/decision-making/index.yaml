# Trigger set version 3, under construction. **This is not the live set.**
#
# `datasets/triggers/decision-making.yaml` is still version 2 and is still what
# `run_triggers.py` measures. Version 3 becomes live only after blind label
# adjudication (Track N3), which carries a pre-registered kill: more than 20% of
# labels moving retires the corpus rather than reporting it. Swapping the entry
# point before that would publish on an unadjudicated answer key.
#
# What this file is for is the other half of the problem. The bands beside it
# were authored with four gates written for them and **no caller** — the
# `de check` scan globs `datasets/triggers/*.yaml` and the bands are one
# directory down, so 120 authored items and the whole shortcut battery sat
# outside the gate and it reported green. That is the third instance in this
# repository of a check that exists and does not run (`triggers` at 100%
# coverage called by nothing; `prereg.py`'s refusals with no caller), and this
# time it was caught while the corpus was still being written rather than after
# something had been published from it.
#
# So the index exists to be loaded. `check_trigger_sets` reads every
# `datasets/triggers/*/index.yaml` and holds the set behind it to the same
# corpus rules as a live one, without it being the set anything runs.

# Bumped 3 -> 4 on 2026-08-18, before anything is scored against this corpus.
# Version 3 named four different corpora: 120 items when authored, 192 after the
# short-band merge, 261 after the long-band merge, 258 after the rewrite round
# retired `l15`. That was harmless only because no run has ever been scored
# against any of them -- zero records on disk carry `set_version: 3`. N6 would
# be the first, and it would stamp 1,548 records with a version that does not
# identify a corpus. `label_versions_comparable` compares this integer and
# nothing else, so a version that moves only when a label flips cannot see a
# corpus whose text changed under it, which is what happened today: eleven asks
# were rewritten and three items removed while every `should_fire` stayed put.
version: 4
skill: decision-making
includes:
  - s.yaml
  - m.yaml
  - l.yaml
  - xl.yaml

# --- v2 -> v4 item identity -------------------------------------------------
#
# Which version 2 item each carried-over turn descends from, and whether the
# text survived the rebuild. Added 2026-08-19, after `s13p` was found carrying
# "v2 x-n22, lengthened to match its negatives and otherwise unchanged. It has
# never fired in any arm on any version" -- both halves false. The turn gained
# "and the release notes are written" and "or is there something I'm missing?",
# and it fires in 11 of the 14 v4 rows on disk.
#
# The drift was invisible because the only record of descent was a sentence
# inside `why`. Prose cannot be diffed: nothing could ask "is s13p still the
# turn x-n22 was?", so an annotation about the v2 item kept being read as an
# annotation about the v4 one for as long as the two ids sat in the same string.
#
# `load_trigger_set` reads `skill`, `includes`, `version`,
# `length_separability_ceiling` and the case lists, and ignores keys it does
# not know -- so this block loads with the set on every call and costs no schema
# change, no dataclass field and no test. It is data for a rebuild to diff
# against, not something the gate scores. `text:` is the claim a future pass
# should check:
#
#   verbatim  -- byte-identical to the v2 turn
#   edited    -- same scenario and same ask, wording changed
#   rewritten -- new scenario; only the mechanism carried over
#
# Only direct descent is recorded. `l08p` and `xl07p` say "like v2's p12",
# which is a comparison and not ancestry, and they are deliberately absent.
ancestry:
  from: datasets/triggers/decision-making.yaml
  from_version: 2
  items:
    - id: s01p
      v2: p04
      text: verbatim
    - id: s02p
      v2: p05
      text: verbatim
    - id: s03p
      v2: p06
      text: verbatim
    - id: s04p
      v2: p07
      text: verbatim
    - id: s05p
      v2: p08
      text: edited
      note: >-
        Three words longer to match its negatives: "or leave it?" added to the
        closing question.
    - id: s07p
      v2: p10
      text: verbatim
    - id: s08p
      v2: p11
      text: edited
      note: 'Five words longer: "rather than the next one".'
    - id: s09p
      v2: p12
      text: edited
      note: 'One word longer: "with this" became "with this one".'
    - id: s10p
      v2: p13
      text: edited
      note: 'Three words longer: "on it" and "here" added.'
    - id: s11p
      v2: p01
      text: edited
      note: >-
        Two words shorter: "Do I sign the renewal?" became "Do I sign?". Band XL
        carries the real pile; this is kept as its short form.
    - id: s12p
      v2: p03
      text: rewritten
      note: >-
        Scenario replaced -- group chat to conflicting spreadsheets -- and the
        ask made implicit. p03 said "what should I actually do", which made the
        label easy.
    - id: s13p
      v2: x-n22
      text: edited
      note: >-
        The one this block exists for. Seven words to nineteen, and the added
        clause "or is there something I'm missing?" asks for help rather than
        for a go/no-go. x-n22 fired in no arm on any version; s13p fires in 11
        of 14 v4 rows. Treat any v2-era statement about x-n22 as being about a
        different turn. No label moved.
    - id: s09n2
      v2: n07
      text: rewritten
      note: >-
        Mechanism only -- "talk me through how people usually do this" -- on a
        new scenario, so that it sits in s09's triple.
