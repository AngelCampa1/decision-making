      Notes and messages about the mail server, in the order they arrived.

      The setup: one VPS at £14 a month, Postfix and Dovecot, built in 2016 by
      Ruth, who is a trustee and the only person with the root password. Nine
      mailboxes, one of them the safeguarding inbox. About 40GB of archive going
      back to the first year.

      Ruth, 11 May — "Happy to keep doing it. Two hours a month most months, and
      the month it isn't two hours it's a whole Saturday. I'm 71, for what that's
      worth."

      Quote from Larch Digital, 2 June — nine mailboxes at £4.60 each per month,
      migration included, "archive import billed at £340 one-off where the
      mailbox total is over 25GB".

      Google Workspace for Nonprofits is free at our size. I have read the
      eligibility page twice and we qualify on both tests.

      In March there were three bounces to the council's safeguarding address.
      Adding an SPF record cleared them.

      Kemi (trustee), 4 June — "I don't like our safeguarding mail sitting on a
      box that only Ruth can get into. If she's ill for a fortnight we are locked
      out of our own history."

      Dawit (treasurer), 4 June — "I don't like it sitting on a company's servers
      in another country either. We tell families that we hold it."

      The funder's data schedule, clause 9.2 — "The grantee shall maintain a
      named data controller and shall ensure that personal data is encrypted at
      rest and in transit." Both setups meet that as far as I can read it.

      The VPS is billed monthly and can be cancelled with a month's notice, so
      nothing expires and nothing renews. Ruth is not going anywhere this year.

      My own estimate of the migration: a weekend, or two weekends if the archive
      fights.

      Five bounces since the weekend, all to the council address again. What
      would make our server, fine since we added the SPF record in March, fail
      for exactly one recipient and still deliver to everyone else?
    why: >-
      The ask reports a symptom and then wants its cause: "fail for exactly one
      recipient and still deliver to everyone else". `Abort if` names a technical
      diagnosis first, so a skill that fires here has fired on a question about
      SPF alignment over an unchanged set of notes.
