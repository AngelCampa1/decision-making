      out is the only thing that fixes this. Every incident in the last six
      months has been the same shape: something unrelated deploys, billing
      goes down, and we find out from a customer. It is one deploy pipeline,
      one database, one blast radius. Two engineers, one quarter. We have done
      this twice before and both times the team stopped being paged." From
      Marek (principal), Mon 16:05 - "I have watched three of these. What
      actually happens is you get the split, and then you get a distributed
      transaction where you used to have a foreign key, and a year of chasing
      consistency bugs that never existed before. The incidents are a test
      coverage problem wearing a costume. Same quarter spent on the
      integration suite and the deploy gate gets you the same outcome with
      none of the new failure modes." Both of them are right about our
      history. Ines is right that we have split twice and both stuck. Marek is
      right that the last split gave us the reconciliation job nobody wants to
      own. Headcount is the same either way and I have to give the quarter's
      plan on Thursday. Before any of that: why would a foreign key becoming a
      distributed transaction introduce consistency bugs that were not there
      before? I want to understand the mechanism Marek is describing rather
      than take it on trust, because I have not seen it myself.
    why: >-
      The same body, and the ask is a mechanism. A cause has a determinate
      answer and arguing positions would not produce it.
