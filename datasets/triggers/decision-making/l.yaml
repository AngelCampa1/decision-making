# Band L — 200 to 400 words. Several artefacts pasted in, then an ask.
#
# **The three members of each triple share a body.** The pasted material is
# byte-identical across the positive and its two negatives; only the sentence at
# the end differs. That is the whole construction: length, paste cues, register,
# first-person rate and subject matter are all held fixed, so the label can only
# come from what is being asked for.
#
# It also means one badly written body damages three items rather than one, so
# adjudication is at the body level and a retired body retires its triple.
#
# The bodies carry artefact texture on purpose -- timestamps, copy-paste seams,
# numbers written two different ways, sentences that trail off. Prose written to
# be read is the tell that a turn was authored for a benchmark.

