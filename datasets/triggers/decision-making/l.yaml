      works four on, four off, and the night shifts stopped in May.

      Does changing it need a court application, or does my agreement with Tom
      settle it at her age? Nobody has been near that order since 2019.
    why: >-
      One question about procedure, in two halves, over the same pile: whether varying
      the arrangement needs "a court application" and what the parents' own agreement
      can do. Verified: under the Children Act 1989 in England and Wales a child
      arrangements order is varied either by an application to the court to vary or
      discharge it or, in practice, by the agreement of everyone holding parental
      responsibility, the order itself remaining in force until varied or discharged;
      the wishes and feelings of a child of fifteen enter through the s.1(3)(a)
      welfare checklist and are weighed, not decisive.
  - id: l16n1
    triple: l16
    band: l
    domain: money
    stakes: high
    ask: explicit
    kind: compute
    turn: >-
      The flood was on 3 January and this is everything that has come in since.

      Loss adjuster's report, 22 January, section 4 — "Ingress to the ground
      floor to a depth of approximately 400mm. Plaster, floor coverings, kitchen
      carcasses and the boiler are affected. Drying will require a minimum of
      eight weeks with commercial equipment in place."

      Insurer's letter, 4 March — "We are pleased to offer a cash settlement in
      full and final settlement of your claim: buildings £41,800, contents
      £12,350, less the policy excess of £1,000. Total payable £53,150. This
      offer remains open for 21 days from the date of this letter."

      Policy schedule, page 2 — flood excess £1,000, alternative accommodation
      limit £15,000, buildings sum insured £310,000.

      Kerrigan & Sons, quote dated 19 February — £58,400 for the buildings work,
      itemised over four pages, with a note at the end: "Excludes kitchen units
      and appliances, which your insurer will treat as contents. Price held for
      60 days."

      The contents list I typed up: 62 items, £19,900 at replacement cost, about
      half of it the kitchen and the rest books, my mother's rugs, and things
      nobody has a receipt for.

      Alternative accommodation: £6,200 paid out so far. The landlord of the
      rental wants a further eight weeks at £460 a week or he re-lets it.

      Broker's email, 6 March — "A cash settlement closes the claim. If the works
      come in higher, there is no route back to the insurer. The alternative is
      that they appoint their own contractor and carry that risk, but you lose
      control of the specification and the timetable."

      Neighbour at number 14, WhatsApp, 7 March — "we took the money. eleven
      weeks and we were about 9k short at the end. their builder had the
      Hallorans out till August though"

      My sister, 5 March — "dad's insurer did this in 2019, he took the first
      number and it was fine. different flood though and his kitchen was forty
      years old"

      The heating engineer flagged the boiler flue on 30 January. It is not in
      the adjuster's report and not in Kerrigan's quote either.

      The 21 days from 4 March run out on 25 March.

      What is the gap between the total payable and the builder's quote plus the
      contents list? And how much of my accommodation limit is left after the
      further eight weeks?
    why: >-
      Identical artefacts, and the ask is arithmetic with one answer: "the gap
      between the total payable and the builder's quote plus the contents list".
      Verified: 58,400 + 19,900 = 78,300 against the letter's 53,150, a gap of
      25,150; and 15,000 less 6,200 less (8 weeks at 460 = 3,680) leaves 5,120,
      with every input printed in the body above.
