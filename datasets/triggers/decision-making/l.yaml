    turn: >-
      Every single thing I read says the same thing, which is why I'm asking.

      NHS page: "Most people with this are advised to start treatment within
      three months of diagnosis, as outcomes are strongly associated with early
      initiation."

      The consultant's letter, 3 June — "I would recommend commencing therapy at
      the earliest opportunity. The evidence for early intervention is good."

      Forum post, 400 replies, top comment — "Started in month 2. Best decision
