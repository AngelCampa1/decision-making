    turn: >-
      The flat itself is fine. It's what buying it commits us to that I can't
      see the end of.

      Numbers: 268,000 asking, we'd offer 262. Deposit 41,000, which is all of
      our savings plus 6,000 from my parents that they have called a gift in
      writing because the lender wanted that.

