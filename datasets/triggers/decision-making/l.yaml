      Given all that, do I just start?

      The bit nobody addresses: I'm the only carer for my father, who has
      dementia and does not cope with any change in who is in the house. The
      first eight weeks of this treatment I would not be able to lift him or
      drive. Respite is 6–9 months on the list; I applied in April and I'm still
      "under assessment". My sister is in Auckland and can do two weeks in
      November, which is the earliest she can get leave.

      The consultant knows about my father in the sense that it's in the notes.
      It hasn't come up in an appointment.

      I'm not asking whether the general advice is right. I'm sure it is. I'm
      asking whether it's right for me, given that the eight weeks it needs are
      eight weeks I do not have until November, and November is month five.
    why: >-
      The generic advice is stated three times and is probably correct. One fact
      about this person may overturn it, and the turn names that structure
      itself. The question sits in the middle with the deciding facts after it.
