    triple: l05
    band: l
    domain: technical
    stakes: low
    ask: explicit
    kind: diagnose
    turn: >-
      We did the auth migration on the 14th and something is wrong that I can't
      pin down.

      Notes from the planning doc, for context:

      - cutover needed a 4-hour window with logins disabled
      - Anders wrote the runbook and is on parental leave from 12 Sept
      - the compliance audit fieldwork is 6–24 Oct
      - Black Friday freeze is 20 Nov – 2 Dec, no exceptions
      - the new provider's onboarding engineer is allocated to us until 30 Nov
      - we had never done a cutover of this shape before

      Since the cutover, roughly 2% of logins fail on the first attempt and
      succeed on the second. It is not one browser, it is not one region, and it
      is not one identity provider. The failing requests come back 401 with an
      empty body rather than the provider's error envelope, which makes me think
      it is us and not them.

      The 2% is stable across the day — it does not spike at peak, which I would
      have expected if it were a rate limit or a pool exhaustion thing.

