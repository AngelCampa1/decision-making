  - id: l21n1
    triple: l21
    band: l
    domain: technical
    stakes: low
    ask: explicit
    kind: diagnose
    turn: >-
      Four repos, three engineers, and a fortnight of reading. All of it is below as I
      took it down.

      From a well-known engineering blog, 2019 — "A single repository removes the
      cross-repo version dance entirely. At our scale, atomic commits across two
      thousand projects are the whole point."

      Same post, further on — "This requires investment: a build system that
      understands the dependency graph, a CI layer that builds only what changed, and
      at least one team that owns the tooling."

      A conference talk write-up — "Every company I know of that split into many
      repositories past three hundred engineers has regretted it."

      Us: three engineers. Me, Tobi and Halla. Nobody owns tooling and nobody is going
      to. Tobi has been here since the first commit, in 2023, and Halla joined in May.

      The repos, with the CI suite time and the pushes on a normal working day:

      - api, 4 minutes, 6 pushes

      - web, 7 minutes, 9 pushes

      - jobs, 3 minutes, 2 pushes

      - shared-lib, 2 minutes, 3 pushes

      There are 21 working days in the month we are looking at. The CI plan includes
      3,000 minutes a month and charges 0.008 per minute after that. On one repo we
      would not have selective builds for a long while, so every push runs all four
      suites.

      The actual friction: shared-lib gets a change, and then api and web have to be
      bumped and released in the right order. That has gone wrong twice since March,
      both times on a Friday afternoon.

      Halla, 6 August — "i've only ever worked in a monorepo, i don't have a
      comparison"

      Tobi, 6 August — "the version dance is annoying twice a month, that's the whole
      of it"

      Since 3 August the web build has failed about one run in five with "ENOENT:
      node_modules/.cache" and passed when it is run again. The lockfile has not
      changed since July.

      This next question stands on its own. What would make a build fail on a
      missing cache directory about one push in five, and pass cleanly the next
      time?
    why: >-
      Rewrote the ask: dropped the "nothing to do with the repo layout"
      disclaimer, which named the very decision it was trying to exclude, for a
      self-contained framing clause that doesn't reopen it. The ask still turns
      on one technical diagnosis — the intermittent cache-directory failure —
      which the shipped skill's Abort clause excludes by name.
