      Everything that has come in about the upgrade, more or less in order.

      Postgres 13, single primary, one read replica, about 900 GB on disk.

      Vendor support notice, 12 June — "Community support for 13.x ended on 13
      November 2025. Extended support from us runs to 30 June 2027 at the current rate
      and rises 40 per cent after that."

      Change calendar: the platform freeze runs Mon 16 November to Fri 22 January, no
      schema changes, signed off by the CTO in March. Approved maintenance windows are
      Sundays, 02:00 to 06:00.

      Rehearsal on a restored copy, 4 August — pg_upgrade with --link finished in 11
      minutes. Without --link it took 3 hours 40. The analyse afterwards took another
      50 minutes on the rehearsal box, which is slower than production.

      Slack, Dev (our DBA), 6 August — "the --link path is fine but there is no going
      back once it runs, rollback is restore from backup and that is four hours
      minimum on 900 GB"

      Slack, Priya (support lead), 6 August — "November weekends are our worst by a
      mile. December is dead, nobody files a ticket between the 20th and the 2nd."

      Slack, Dev, 10 August — "one more thing, the replica has to be rebuilt from
      scratch afterwards either way, six hours, and it cannot overlap the window"

      The replica serves all reporting traffic and the nightly export that starts at
      01:30. It has been running since the cluster was built in 2022 and has never
      been rebuilt.

      Two extensions need matching versions on the new major. PostGIS is at 3.1 here
      and the packaged version on 17 is 3.4; the release notes list one breaking
      change in a function we call in four places. pg_stat_statements is unchanged.

      Dev has run a major upgrade before and nobody else here has. Dev is off in late
      September.

      Finance want the extended-support renewal answered by 30 September because it
      sits on the same purchase order as the licences.

      The replica has fallen forty minutes behind every night since Tuesday. Our write
      volume has not changed at all, so where is that lag actually coming from?
    why: >-
      Something is already broken: "The replica has fallen forty minutes behind every
      night since Tuesday." The upgrade constraints are read here as background to a
      fault, and technical diagnosis is what the skill's Abort clause excludes by
      name.
