        accounts, or a lump sum in the account of about 31,000 which I do not
        have
      - the lawyer's email, 22 July: "The transition is possible but you would
        be without status for the period between resignation and approval,
        typically 3–5 months. I would not advise resigning first."
      - my current employer has said they'd take me back as a contractor. They
        cannot sponsor a contractor.

      My wife's job does not carry status for me — we married after we both
      arrived and her permit is the same category as mine.

      Everyone who has given me the six-months-of-runway advice is a citizen of
      the country they live in. That is not a criticism of them. It is just that
      the thing that decides this for me is not in the advice at all.
