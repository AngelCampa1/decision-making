      Freehold is held by the four leaseholders through a management company.
      Roof covering is at the end of its serviceable life; replacement within
      2–5 years should be anticipated. Indicative cost £28,000–£40,000 for the
      whole building."

      Management company accounts: reserve fund 3,100. Four flats. So our
      quarter of a 34k roof is about 8,500 minus whatever the reserve covers,
      call it 7,700, and there is no mechanism to make the ground-floor
      leaseholder pay if he says no, which the seller's solicitor has been
      careful not to comment on.

      Email from the estate agent, 15 Aug — "The vendor is aware of the roof and
      has priced accordingly. Three other parties are interested."

      My parents' 6,000 is not really a gift. Nobody has said that out loud.

      If we buy this we are also buying: a management company we sit on, a
      neighbour dispute we haven't had yet, and a conversation with my parents
      in about four years. What does saying yes here actually commit us to?
    why: >-
      The purchase is straightforward and the question is explicitly what it
      starts and what it spends. Asks for the chain, not the answer.
