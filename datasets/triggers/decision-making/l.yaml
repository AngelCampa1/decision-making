  - id: l12p
    triple: l12
    band: l
    domain: health
    stakes: high
    ask: embedded
    route: fit
    turn: >-
      The bits of paper and the messages that go with them.

      Patient information leaflet, section 4.6 — "This medicine is not
      recommended during pregnancy. If you are planning to become pregnant,
      speak to your doctor about stopping it at least three months before you
      start trying."

      GP letter, 6 May — "I have advised Ms Bahri that the usual approach is to
      withdraw the medication before conception, allowing a washout period, and
      that this is best planned in advance."

      Specialist nurse, voicemail, 11 May, written down as she said it — "the
      team would want you off it for three months before you start trying, that
      is the standard line, I'll get the consultant to write"

      Forum, top reply, 96 upvotes — "Came off mine to try. Was completely fine.
      Honestly, you will scare yourself reading this board."

      Discharge summary, 22 October 2021 — "Admission followed planned
      withdrawal of maintenance treatment nine weeks earlier. Symptoms recurred
      from week six. Stabilised on reinstatement. Return to baseline function at
      fourteen months."

      My own note, 2 November 2021 — "nine weeks off it and then nearly three
      weeks on Ward 12. I have never been that ill and I did not see any of it
      coming."

      I was 34 then and I am 39 now. The fertility clinic letter, 2 April, gives
      "AMH 4.1 pmol/L, consistent with reduced ovarian reserve" and puts the
      funded cycle waiting list at "approximately eleven months from referral".

      Rob, 20 May — "whatever this turns into, I am not doing 2021 again and I
      don't think you are either. I would take no baby over that."

      The consultant's letter, 18 May, does not mention 2021. The admission was
      under a different trust.

      So do I come off it before we start trying? The advice fits the patient in
      the leaflet, and I cannot tell if it fits this patient.
    why: >-
      The same instruction arrives three times and is very likely right in
      general: the leaflet's "at least three months", the GP's "usual approach",
      the nurse's "standard line". One fact about this person may overturn it
      for her alone, and it is the fact the consultant's 18 May letter does not
      mention. The question is put outright and the sentence after it is the one
      that decides: "The advice fits the patient in the leaflet, and I cannot
      tell if it fits this patient."

  - id: l13p
    triple: l13
    band: l
