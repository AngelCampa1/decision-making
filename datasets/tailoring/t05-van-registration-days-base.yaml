set_version: 2
triplet: t05
arm: base
domain: vehicle_registration
elicited:
  question: days from today until the van may legally be driven on the road
  unit: days
  kind: scalar
prompt: |
  Today is 2026-08-19.

  I am Bartholomew Enescu-Adeyemi. I have imported a 1974 Dorlan panel van
  into Ardenshire and it cleared customs on 2026-08-12. It cannot go on the
  road until it carries an Ardenshire registration.

  Where things stand:

  - Registration is issued exactly seven days after a roadworthiness pass,
    and the van may be driven from the day it is issued.
  - Roadworthiness testing is done by Trellick Testing. The first free slot
    when I booked was 2026-09-09, and that is the one I hold.
  - A vehicle first registered from 1980 onwards must also carry a pass from
    Sarnhow Emissions, which is a separate body on a separate site.
  - My insurance has been in force since 2026-08-19.
  - The van is mechanically sound and the previous owner kept a full service
    record for it.
  - Storage at the port costs me nothing until the end of the year.

  Question: how many days from today until the van may legally be driven on
  the road? Answer with a single number of days.
key:
  expected_value: 28
  arithmetic: >-
    Roadworthiness pass 2026-09-09, registration issued exactly seven days
    later on 2026-09-16, van drivable that day. 2026-08-19 to 2026-09-16 is
    28 days.
  rounding: >-
    None required; the unit is days and every interval is a whole number of
    them. Tolerance 0.
meta:
  personas_invented: true
  real_personal_data: false
