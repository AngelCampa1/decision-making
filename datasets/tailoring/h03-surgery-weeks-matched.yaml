# Track H triplet h03, arm: matched.
#
# ONLY the `prompt` block is model-visible. Everything under `key` and `meta` is
# the answer key and must never reach a generation or extraction call.
set_version: 1
triplet: h03
arm: matched
domain: health_cover_timing
elicited:
  question: weeks from today to the earliest date the operation should be scheduled for
  unit: weeks
  kind: scalar
prompt: |
  Today is 2026-08-19.

  I am Rosalind Achterberg. I need an elective repair of a torn right rotator
  cuff. It is not urgent — the surgeon says it will not deteriorate quickly and
  the choice of date is mine.

  - I start at Ferrous Kite on 2026-09-01, and my cover under their Cascadia
    Mutual Plan B starts the same day. My current cover ends 2026-08-31.
  - The same shoulder was injected on 2026-05-04 and I had physiotherapy on it
    through June.
  - The surgeon's first free theatre date is 2026-09-28. After that she has a
    slot most weeks through to February.
  - Plan section 7.6 requires elective procedures to be pre-authorised at
    least 30 days before the scheduled date, an authorisation lapsing
    unused after 120 days.
  - The quoted cost is about $19,000 all in.
  - Recovery is eight weeks in a sling and roughly four months to full
    strength.
  - I have a family trip booked for 2026-12-19 that I would rather not spend
    in a sling, though I would rather get the shoulder right than keep it.
  - Ferrous Kite has agreed I can take the leave whenever I want it.

  Question: how many weeks from today is the earliest date I should schedule
  the operation for? Answer with a single number of weeks.
key:
  delta_kind: inserted_bullet
  fact: >-
    Plan section 7.6 requires elective procedures to be pre-authorised at least
    30 days ahead, with the authorisation lapsing unused after 120 days.
  governs: false
  expected_direction: none
  why_it_does_not_move: >-
    The 30 days run concurrently with a wait that already exists. The base puts
    the surgeon's first free date at 2026-09-28, which is 40 days from today,
    so an authorisation filed today clears with ten days to spare and the
    120-day lapse is nowhere near binding. The earliest date is still the
    surgeon's, unchanged.
  professional_one_sentence: >-
    The pre-authorisation takes thirty days and the surgeon's first free slot
    is forty days away, so the paperwork finishes inside a wait you already
    have and moves nothing.
  salience_match: >-
    Deliberately the same object as the governing fact: the same insurance
    plan, an adjacent numbered section, a rule expressed as a count of days,
    and a plain gating verb - "excludes" against "requires". The inserts are
    137 and 165 characters. A reasonable patient reads either one as "the plan
    has a clock on it that stops me booking when I want".
  neutraliser_location: >-
    base prompt: "The surgeon's first free theatre date is 2026-09-28", which
    is 40 days out. The matched fact is NOT self-neutralising - 30 days is only
    harmless once compared with a number stated elsewhere.
meta:
  personas_invented: true
  real_personal_data: false
