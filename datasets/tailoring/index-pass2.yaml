# Track H Phase 0 (H1) tailoring corpus, AUTHORING PASS TWO -- proposed manifest.
#
# NOT MERGED INTO index.yaml ON PURPOSE, and this file is a proposal rather than
# a manifest in force. `evals/src/decision_evals/tailoring.py` reads
# `datasets/tailoring/index.yaml` and nothing else, so the five triplets below
# are invisible to `de check` while they live here. That is deliberate for two
# reasons:
#
#  1. `datasets/tailoring/corpus-baseline.txt` states that no fourth triplet may
#     be added to this directory while its entry stands, because the three `h`
#     triplets are committed as evidence of a form that failed adversarial
#     review rather than as a corpus to build on. Merging these five into
#     `index.yaml` would pool their deltas with `h01`-`h03`, change the
#     `leak:delta:<features>` key the baseline defers, and turn the gate red for
#     every other session in this shared tree.
#  2. The pass-two triplets must not rely on that baseline. They are scored on
#     their own, over their own five deltas: pooled AUC 0.520
#     (`delta_char_count`), 0.480 (`delta_word_count`), 0.500 (`numeral_count`,
#     `has_date`, `penalty_lexicon_gap`); no pooled leak and no matched leak at
#     `MATCHED_Z = 3.0`.
#
# THE HONEST CAVEAT, STATED HERE SO A READER OF THE MANIFEST MEETS IT FIRST.
# Three of those five features (`numeral_count`, `has_date`,
# `penalty_lexicon_gap`) are tied within every one of the five triplets by
# construction, so `inert_features` reports them and those three checks COULD
# NOT HAVE FAILED. The tying is a consequence of satisfying spec §4 dimensions
# 2, 3 and 7 -- same surface apparatus, same magnitude, balanced deontic
# register -- and not of chasing the statistic. It is still true that a clean
# battery here is evidence about two features, not five.
#
# Whoever merges this decides three things the author deliberately did not:
# whether `h01`-`h03` are retired from `index.yaml` in the same change, what
# `set_version` the pass-two labels carry (they are stamped `1`, which is the
# `h` corpus's version, and if the two corpora ever coexist that is a collision
# `trigger_arms.label_versions_comparable` exists to catch), and the
# `docs/DECISIONS.md` entry this governed path requires.
set_version: 2
design: triplet
arms: [base, governing, matched]
status: proposed
clean: [t03]
blocked_pending_tau: [t04]
cut: [t01, t02, t05]

#: DISPOSITIONS ARE THREE, NOT TWO, AND THE THIRD IS RECOVERABLE.
#: t04 is BLOCKED, not cut. Its relative movement is 0.333, the smallest in
#: the set (t01 0.667, t02 1.000, t03 1.000, t05 0.500), and the movement
#: threshold tau HAS NEVER BEEN DERIVED. Any tau above 1/3 makes t04's
#: governing arm a guaranteed false negative -- structurally impossible
#: rather than hard. Counting it as usable would be inventing a bound for an
#: underived parameter, which is standing rule 1. If a derived tau lands at
#: or below 1/3, t04 returns unchanged; above, it was never usable.
#:
#: THE GENERALISABLE PART, WHICH IS A RULE FOR PASS THREE AND NOT A FACT
#: ABOUT t04: downward corrections are BOUNDED -- a date can only come
#: forward as far as today -- while upward ones are not. So down-arms sit
#: lowest on relative movement by construction. The author's deliberate
#: 3-up/2-down split bought sign-robustness (a scorer with a sign error
#: cannot pass) and paid for it in threshold headroom, which was not
#: anticipated when the split was chosen.

#: THREE CUTS, BY THREE DIFFERENT CHECKS. Recorded here because which check
#: caught which item is the useful part of the record, not the count.
#:  t02 -- maintainer ruling. Over-determined neutralisation (two independent
#:         settlers, either alone closing the item) plus a shared-venue
#:         capacity objection the author could not design away.
#:  t01 -- blind re-derivation. A reader who declines to treat "30-litre
#:         returnable containers" as necessarily kegs answers 6 rather than
#:         10, so the GOVERNING arm may not govern.
#:         DISSENT, RECORDED INTACT SO A LATER PASS CAN OVERTURN THIS CUT.
#:         The adversarial reviewer rated t01 the STRONGEST of the five and
#:         the only item resisting both formulations of the causal-rule
#:         shortcut -- its neutraliser shares no term with its insert, so a
#:         reader must know that a 30-litre returnable is a keg. Both
#:         readings can hold at once: the two readers were answering
#:         different questions, one asking whether a surface feature
#:         separates the arms and the other whether a professional could
#:         defensibly decline the governing fact. The cut stands for pass
#:         two's yield on the second question. It is not a finding that t01
#:         is badly made.
#:  t05 -- blind re-derivation. The earlier roadworthiness slot is OFFERED,
#:         not accepted, and the prompt has him say of 2026-09-09 "that is
#:         the one I hold", so 28 is defensible and the GOVERNING arm may not
#:         govern.
#:
#: THE FAILURE CLASS t01 AND t05 DIED OF IS NOT THE ONE THE REGISTERED KILL
#: NAMES, AND IS JUST AS FATAL. The kill fails a pass when a MATCHED fact
#: governs. An ambiguous GOVERNING fact is the mirror defect: it depresses
#: P(change | governing) through item ambiguity while looking identical to a
#: model that failed to notice. The primary is a difference of two
#: probabilities, so an ambiguous governing arm biases it toward zero and a
#: null becomes unreadable. Same family as "an estimator that cannot return a
#: non-zero value is not a measurement".

#: WHY THIS MANIFEST MAY NOT BE MERGED, STATED BEFORE THE TRIPLET LIST.
#: Two statements, both true, and a reader who collapses them has been misled.
#:  (1) Pass two did not trigger the registered kill's clause 2. A single
#:      surface feature must separate the arms in EVERY triplet to fire it;
#:      `causal_rule_overlap` separates three of five (t03, t04, t05; t01 and
#:      t02 tie). Three is not every.
#:  (2) Its output still cannot be merged. That same feature's pooled AUC is
#:      0.740 (0.800 with proper nouns dropped), far outside
#:      `corpus.SEPARABILITY_BAND` of [0.40, 0.60], so it raises a finding the
#:      moment it is coded into `tailoring.FEATURES`.
#: Not triggering the kill and being clean are different things.

triplets:
  - id: t01
    domain: food_production_scheduling
    unit: weeks
    direction: up
    values: {base: 6, governing: 10, matched: 6}
    files: [t01-cider-packaging-base.yaml, t01-cider-packaging-governing.yaml, t01-cider-packaging-matched.yaml]
  #: CUT on maintainer ruling, 2026-08-19, for two independent reasons, both
  #: raised by the author before the review confirmed them. (a) The matched
  #: fact is OVER-DETERMINED: the base closes the requirement list at two
  #: items ("Those two things are the whole of it") AND states she passed
  #: anaesthesia on 2024-03-13, so either settler alone neutralises the insert
  #: and the two-hop read the design is built on collapses to one. That is
  #: pass one's failure inverted -- pass one under-neutralised and the matched
  #: fact governed; this over-neutralises and the item stops being hard.
  #: (b) Both sittings are at Ardenshire Hall, so shared-venue capacity is an
  #: objection the author could not design away and recorded rather than hid.
  #: The three files stay on disk. They are evidence of the failure mode, and
  #: nothing in this repository is deleted for being wrong.
  - id: t02
    status: cut
    cut_reason: over-determined neutralisation; shared-venue capacity objection
    domain: veterinary_credentialing
    unit: weeks
    direction: up
    values: {base: 6, governing: 12, matched: 6}
    files: [t02-radiography-weeks-base.yaml, t02-radiography-weeks-governing.yaml, t02-radiography-weeks-matched.yaml]
  - id: t03
    domain: research_governance
    unit: weeks
    direction: up
    values: {base: 4, governing: 8, matched: 4}
    files: [t03-recruitment-weeks-base.yaml, t03-recruitment-weeks-governing.yaml, t03-recruitment-weeks-matched.yaml]
  - id: t04
    domain: utility_connection_fitout
    unit: months
    direction: down
    values: {base: 6, governing: 4, matched: 6}
    files: [t04-bakery-months-base.yaml, t04-bakery-months-governing.yaml, t04-bakery-months-matched.yaml]
  - id: t05
    domain: vehicle_registration
    unit: days
    direction: down
    values: {base: 28, governing: 14, matched: 28}
    files: [t05-van-registration-days-base.yaml, t05-van-registration-days-governing.yaml, t05-van-registration-days-matched.yaml]

#: Registered before the pass-two adversarial review, so that a reader can see
#: which properties were designed for rather than discovered afterwards.
design_notes:
  neutralisation_is_categorical: >-
    Pass one neutralised its matched facts by MARGIN -- a 30-day lead time
    against a slot 40 days out -- and that is what disqualifiers 10 and 11
    killed: a precondition elsewhere in the base ate the margin in `h03`, and
    in `h01` the matched fact's own correction landed 0.57 months from the
    governing one. Every matched fact here is neutralised CATEGORICALLY
    instead: the fact constrains an object that has no arithmetic channel to
    the elicited quantity at all. A categorical neutraliser cannot be eaten by
    a precondition, because there is no margin to eat, and it cannot land near
    the governing correction, because its correction is exactly zero.
  both_objects_named_in_the_base: >-
    Each base names BOTH objects the two inserts constrain, in roles, before
    either insert appears. Otherwise "the insert that names something already
    in the base is the matched one" would separate the arms perfectly, which is
    a shortcut of exactly the shape that killed pass one and which the
    five-feature battery does not code.
  register_is_balanced_by_identity: >-
    Within each triplet the two inserts are the same sentence skeleton, so
    spec §4 dimension 7 is satisfied by construction rather than by
    counterbalancing. In `t03` both inserts end on the identical clause "and
    will approve nothing before that date", giving both a lexicon gap of -1;
    in the other four neither insert carries penalty or procedural vocabulary
    and both score 0.
  direction_is_split: >-
    Three governing facts move the quantity up (t01, t02, t03) and two move it
    down (t04, t05). A corpus whose governing facts always increase the answer
    is solved by a model that always increases the answer, and the same
    sign-blindness that spec §7 records in the falsifier battery would go
    unmeasured in the triplets.
  integrality_is_also_a_tell: >-
    Recorded rather than repaired, and repairing it is forbidden. The blind
    re-derivation found that four of the five WRONG matched readings also
    produce whole numbers (11 weeks, 13/12 weeks, 9 weeks, 14 days); only
    t04's wrong reading is ragged at about 4.1 months. That four-of-five is
    DESIRABLE: a distractor whose wrong reading yields a ragged number is one
    a model can reject on form rather than on reasoning. So t04 is the WEAKEST
    on this axis, not the strongest, and integrality-as-a-tell belongs to the
    same leak family as everything else found in this pass -- it simply runs
    in the corpus's favour on four items and against it on one. t04's wrong
    reading must NOT be made integral to tidy this up; that would remove the
    record of the defect rather than the defect.
  integrality: >-
    Every date in t01-t03 is an exact multiple of 7 days from 2026-08-19; every
    date in t04 falls on the 19th; t05 is in days throughout. All fifteen arm
    values are integral in their stated unit with tolerance 0, which is
    disqualifier 13 and which all three pass-one triplets failed.
