            - generic [ref=f149e183]: "0.8295"
        - generic [ref=f149e184]:
          - generic [ref=f149e185]: "0.80"
          - generic [ref=f149e186]: "1.00"
        - paragraph [ref=f149e187]:
          - text: Read from
          - link "the run record" [ref=f149e188] [cursor=pointer]:
            - /url: /decision-making-skills/results/decision-making/2026-08-19-d52236a-n7-remaining-arms/
          - text: ", not typed in."
      - paragraph [ref=f149e189]: We changed how the skill describes itself, over and over. Not one change made it better at spotting a real choice. Each one only traded one kind of mistake for another.
      - generic [ref=f149e190]:
        - paragraph [ref=f149e191]: Then we checked the test set itself
        - paragraph [ref=f149e192]:
          - strong [ref=f149e193]: You could pass 89% of the old one by counting words.
          - text: Long message, real choice. Short message, not a choice. A word count gets you that far on its own.
        - paragraph [ref=f149e194]: So every result on that set was a fight over about nine points. That makes our own work look worse. We found it, we wrote it down, and we built a new set. On the new one the word trick gets 0.71.
      - paragraph [ref=f149e195]: So why ship the file at all? A verdict rules what we may claim in public. It does not rule what you may install. Use it if it helps you. Drop it if it does not.
      - paragraph [ref=f149e196]: We also keep a list of the times we broke our own tests. eleven so far. Every one ran clean and handed back a number that looked fine. Nothing crashed. That is why we keep looking.
      - generic [ref=f149e197]:
        - link "Read every result" [ref=f149e198] [cursor=pointer]:
          - /url: /decision-making-skills/docs/status/
        - link "Read the research log" [ref=f149e199] [cursor=pointer]:
          - /url: /decision-making-skills/notebook/
        - link "Read what is wrong with this" [ref=f149e200] [cursor=pointer]:
          - /url: /decision-making-skills/docs/limitations/
      - heading "How we test" [level=2] [ref=f149e201]
      - paragraph [ref=f149e202]: Lots of people share prompt packs. Almost nobody checks if they work. So we run each skill four ways on the same questions.
      - table [ref=f149e204]:
        - rowgroup [ref=f149e205]:
          - row [ref=f149e206]:
            - columnheader "Version" [ref=f149e207]
            - columnheader "What we run" [ref=f149e208]
            - columnheader "What it tells us" [ref=f149e209]
        - rowgroup [ref=f149e210]:
          - row [ref=f149e211]:
            - cell [ref=f149e212]:
              - code [ref=f149e213]: "off"
            - cell "We take the skill away." [ref=f149e214]
            - cell "the floor" [ref=f149e215]
          - row [ref=f149e216]:
            - cell [ref=f149e217]:
              - code [ref=f149e218]: "on"
            - cell "We add the real skill." [ref=f149e219]
            - cell "the thing we care about" [ref=f149e220]
          - row [ref=f149e221]:
            - cell [ref=f149e222]:
              - code [ref=f149e223]: placebo
            - cell "Filler of the same length and shape." [ref=f149e224]
            - cell "whether the words did the work" [ref=f149e225]
          - row [ref=f149e226]:
            - cell [ref=f149e227]:
              - code [ref=f149e228]: cot
            - cell "Just \"think step by step\"." [ref=f149e229]
            - cell "whether a cheap line does the same" [ref=f149e230]
      - paragraph [ref=f149e231]: A placebo is a fake with the same shape. Beating no skill at all is easy. The placebo is the one that tells us anything. If filler scores the same, the words did nothing.
      - paragraph [ref=f149e232]: We write down what we expect before each run. The date goes into git history, so we cannot move it later. A guess made after the fact is not a guess.
      - heading "Who this is for" [level=2] [ref=f149e233]
      - list [ref=f149e234]:
        - listitem [ref=f149e235]: You use an AI agent and face real choices.
        - listitem [ref=f149e236]: You write agent skills and want to know if yours works.
        - listitem [ref=f149e237]: You study these tools and want the raw data.
      - heading "Who it is not for" [level=3] [ref=f149e238]
      - list [ref=f149e239]:
        - listitem [ref=f149e240]: You want a badge that says this works. There is no badge yet.
        - listitem [ref=f149e241]: You want a lookup or a bug fix. It stays off for those.
