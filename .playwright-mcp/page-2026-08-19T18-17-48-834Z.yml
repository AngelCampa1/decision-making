      - generic [ref=f149e90]:
        - paragraph [ref=f149e91]: Where the evidence stands
        - paragraph [ref=f149e92]:
          - strong [ref=f149e93]: We have not proven this works.
          - text: No skill here has passed a real test. The scorecard is empty on purpose.
        - paragraph [ref=f149e94]: We built the measuring tools first. Every result is public. So is every time we caught our own ruler bending.
      - heading "What goes wrong now" [level=2] [ref=f149e95]
      - paragraph [ref=f149e96]: Give an agent a pile of facts and a question. It treats every fact as equal.
      - paragraph [ref=f149e97]: Tell it that it is raining in Paraguay. Then ask about a trip to Lisbon. You may get a raincoat in the answer. The fact arrived, so the agent used it.
      - paragraph [ref=f149e98]: “…and given the rain in Paraguay, pack a raincoat.”
      - paragraph [ref=f149e99]: A big choice and a small one get the same thought. That is the other half of the problem.
      - heading "Six methods. It reads one." [level=2] [ref=f149e100]
      - paragraph [ref=f149e101]: It asks one question first. What is hard here? The answer picks the method.
      - list [ref=f149e102]:
        - listitem [ref=f149e103]:
          - text: "01"
          - heading "Sort the pile" [level=3] [ref=f149e104]
          - paragraph [ref=f149e105]: Too much arrived and you cannot tell what matters.
          - link "ledger.md" [ref=f149e106] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/ledger.md
        - listitem [ref=f149e107]:
          - text: "02"
          - heading "Check it fits you" [level=3] [ref=f149e108]
          - paragraph [ref=f149e109]: The advice is right in general and may be wrong for you.
          - link "fit.md" [ref=f149e110] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/fit.md
        - listitem [ref=f149e111]:
          - text: "03"
          - heading "Follow what it starts" [level=3] [ref=f149e112]
          - paragraph [ref=f149e113]: The move looks fine and the worry is what comes next.
          - link "cascade.md" [ref=f149e114] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/cascade.md
        - listitem [ref=f149e115]:
          - text: "04"
          - heading "Now or later" [level=3] [ref=f149e116]
          - paragraph [ref=f149e117]: You know what to do and not when.
          - link "timing.md" [ref=f149e118] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/timing.md
        - listitem [ref=f149e119]:
          - text: "05"
          - heading "Hear both sides" [level=3] [ref=f149e120]
          - paragraph [ref=f149e121]: Two answers are each fair and one got argued first.
          - link "council.md" [ref=f149e122] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/council.md
        - listitem [ref=f149e123]:
          - text: "06"
          - heading "Ask or decide" [level=3] [ref=f149e124]
          - paragraph [ref=f149e125]: A fact is missing and you cannot tell if it matters.
          - link "hinge.md" [ref=f149e126] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/hinge.md
      - paragraph [ref=f149e127]: More than one can apply. Then they run in order, and each feeds the next.
      - paragraph [ref=f149e128]: Two is usually enough. Three means you have two choices, not one.
      - paragraph [ref=f149e129]: It also knows when to stay off. A lookup is not a choice, and neither is a bug hunt.
      - heading "Install it in one line" [level=2] [ref=f149e130]
      - paragraph [ref=f149e131]:
        - text: The files are plain markdown, so you can read them yourself. They follow the
        - link "Agent Skills" [ref=f149e132] [cursor=pointer]:
          - /url: https://agentskills.io
        - text: standard. You copy them and they work.
      - heading "Claude Code" [level=3] [ref=f149e133]
      - generic [ref=f149e134]:
        - code [ref=f149e136]: cp -r skills/* .claude/skills/
        - button "copy" [ref=f149e137] [cursor=pointer]
      - heading "Codex, Cursor, Copilot, Gemini CLI, Cline, Amp, OpenCode" [level=3] [ref=f149e138]
      - generic [ref=f149e139]:
        - code [ref=f149e141]: cp -r .agents/skills/* ~/.agents/skills/
        - button "copy" [ref=f149e142] [cursor=pointer]
      - paragraph [ref=f149e143]: There is also a Claude Code plugin. It ships nothing today. A skill goes in only after it passes a test.
      - generic [ref=f149e144]:
        - paragraph [ref=f149e145]: Before you install it
        - paragraph [ref=f149e146]: We have not shown this helps yet. It is free, and one line takes it back out.
      - heading "What we found" [level=2] [ref=f149e147]
      - paragraph [ref=f149e148]: We have made ~8,514 model calls. Every one asks the same thing. Does the skill turn on at the right time? Not one of them asks yet whether it helps you choose better.
      - figure "Does the skill turn on when it should? Firing accuracy by how the skill describes itself. 258 questions, haiku." [ref=f149e149]:
