        - paragraph [ref=f13e127]:
          - text: A verdict governs the
          - emphasis [ref=f13e128]: public claim
          - text: ", not whether a skill is usable."
          - code [ref=f13e129]: "NULL"
          - text: means we have not shown it works, which is not the same as showing it does not.
        - heading "The retirement rule" [level=2] [ref=f13e130]
        - paragraph [ref=f13e131]:
          - text: The maintainer’s daily use is the fastest signal this project has, and until now it could only come out positive. A procedure that fires when it should not, or that produces a worse answer than thinking directly, had no way of being recorded as such.
          - strong [ref=f13e132]: Evidence that cannot come out negative is not evidence
          - text: ", so here is the failure condition."
        - paragraph [ref=f13e133]:
          - strong [ref=f13e134]:
            - text: A procedure disabled for 14 consecutive days is marked
            - code [ref=f13e135]: WITHDRAWN
            - text: .
        - list [ref=f13e136]:
          - listitem [ref=f13e137]:
            - text: The clock starts at a dated line in
            - link [ref=f13e138] [cursor=pointer]:
              - /url: /decision-making-skills/notebook/
              - code [ref=f13e139]: notebook/
            - text: saying the procedure was turned off and why. Turning it back on is another dated line.
          - listitem [ref=f13e140]: Fourteen days is chosen to survive a holiday and not to survive disinterest. It is a judgement, not a measurement, and it is written down before any procedure is near it so that it cannot be chosen to spare one.
          - listitem [ref=f13e141]:
            - code [ref=f13e142]: WITHDRAWN
            - text: blocks the plugin exactly as
            - code [ref=f13e143]: UNTESTED
            - text: does — enforced by
            - code [ref=f13e144]: de lint
            - text: ", not by intention."
          - listitem [ref=f13e145]:
            - text: It is reversible. A withdrawn procedure that is rewritten and used again returns to
            - code [ref=f13e146]: UNTESTED
            - text: ", and the notebook keeps both entries."
        - paragraph [ref=f13e147]: This is not a public claim about the procedure. It says the person who wrote it stopped reaching for it, which is worth exactly as much as that sounds — and considerably more than an evidence channel that only ever agrees with itself.
