          - text: runs it. That check is real and has teeth. The table below does not.
        - paragraph [ref=f13e46]:
          - text: "Four more checks over the method itself were added on 2026-08-13, each after the failure it prevents had already happened here:"
          - strong [ref=f13e47]: run provenance
          - text: (a published run must state its answer-key version and name a prediction that can be shown to predate its data),
          - strong [ref=f13e48]: integrity wiring
          - text: (a module with a coverage floor that no entry point reaches is refused),
          - strong [ref=f13e49]: the decision register
          - text: (a change to the answer key or the shipped skill needs a written reason), and
          - strong [ref=f13e50]: documentation
          - text: (a
          - code [ref=f13e51]: de
          - text: command or path that this repository does not have is refused). None of them can put a row in the table below. They govern whether a number is
          - emphasis [ref=f13e52]: traceable
          - text: ", not whether it is"
          - emphasis [ref=f13e53]: good
          - text: .
        - heading "The caveat that qualifies every number on record" [level=2] [ref=f13e54]
        - paragraph [ref=f13e55]:
          - text: Every measurement this repository has made is a
          - strong [ref=f13e56]: trigger
          - text: measurement — does the skill fire when it should — and all of them ran on a corpus that is
          - strong [ref=f13e57]: 89% solvable by counting words
          - text: (AUC 0.850 on turn length alone; a bare “fire if ≥ 18 words” rule scores 0.890 on the version 2 key, against the best arm on that key — 0.9795 to 0.9863). The paired comparisons between arms remain valid; the absolute numbers do not travel, and “nothing moved discrimination” has a second reading, which is that this is what a ceiling looks like. The rebuild is Track N. See
          - link [ref=f13e58] [cursor=pointer]:
            - /url: /decision-making-skills/docs/limitations/
            - code [ref=f13e59]: docs/LIMITATIONS.md
          - text: .
        - paragraph [ref=f13e60]: "None of this touches the table below, which is empty for a different and simpler reason: no skill has been measured on whether it improves a decision at all."
