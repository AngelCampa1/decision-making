      - paragraph [ref=e120]: We have made about 4,240 model calls. They all ask one thing. Does the skill turn on at the right time? None of them ask if it helps you choose better. That test has not been run yet.
      - paragraph [ref=e121]: We changed how the skill describes itself five times. Not one change made it better at spotting a real choice. Each change only traded one kind of mistake for another.
      - generic [ref=e122]:
        - paragraph [ref=e123]: Then we checked the test set itself
        - paragraph [ref=e124]:
          - strong [ref=e125]: You can pass 89% of it by counting words.
          - text: Long message, real choice. Short message, not a choice. No model needed.
        - paragraph [ref=e126]: Our best score is 95.6%. So every result above was a fight over about six points. That makes our own work look worse. We found it, and we are writing it here. A new test set is being built now.
      - paragraph [ref=e127]: So why ship the file at all? A verdict rules what we may claim in public. It does not rule what you may install. Use it if it helps you. Drop it if it does not.
      - paragraph [ref=e128]: We also list the times our own tests were broken. There are eight so far. Every one ran clean and gave a number that looked fine. None of them crashed. That is why we keep looking.
