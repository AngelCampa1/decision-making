      - paragraph [ref=e163]: A placebo is a fake with the same shape. It is easy to beat no skill at all. The placebo is the real test. If filler scores the same, the words did the work.
      - paragraph [ref=e164]: We write down what we expect before each run. The date goes into git history. We cannot move it later. A guess made after the fact is not a guess.
