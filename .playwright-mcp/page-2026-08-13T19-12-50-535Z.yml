      - heading "What goes wrong now" [level=2] [ref=e42]
      - paragraph [ref=e43]: Give an agent a pile of facts and a question. It treats every fact as equal.
      - paragraph [ref=e44]: Tell it that it is raining in Paraguay. Then ask about a trip to Lisbon. You may get a raincoat in the answer. The fact arrived, so it had to be used.
      - paragraph [ref=e45]: “…and given the rain in Paraguay, pack a raincoat.”
      - paragraph [ref=e46]: A big choice and a small one get the same thought. That is the other half of the problem.
      - heading "Four methods. It reads one." [level=2] [ref=e47]
      - paragraph [ref=e48]: It asks one question first. What is hard here? The answer picks the method.
