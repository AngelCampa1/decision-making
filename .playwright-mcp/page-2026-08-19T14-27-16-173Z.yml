            - cell "Filler of the same length and shape." [ref=f13e220]
            - cell "whether the words did the work" [ref=f13e221]
          - row [ref=f13e222]:
            - cell [ref=f13e223]:
              - code [ref=f13e224]: cot
            - cell "Just \"think step by step\"." [ref=f13e225]
            - cell "whether a cheap line does the same" [ref=f13e226]
      - paragraph [ref=f13e227]: A placebo is a fake with the same shape. Beating no skill at all is easy. The placebo is the real test. If filler scores the same, the words did the work.
      - paragraph [ref=f13e228]: We write down what we expect before each run. The date goes into git history, so we cannot move it later. A guess made after the fact is not a guess.
      - heading "Who this is for" [level=2] [ref=f13e229]
      - list [ref=f13e230]:
        - listitem [ref=f13e231]: You use an AI agent and face real choices.
        - listitem [ref=f13e232]: You write agent skills and want to know if yours works.
        - listitem [ref=f13e233]: You study these tools and want the raw data.
      - heading "Who it is not for" [level=3] [ref=f13e234]
      - list [ref=f13e235]:
        - listitem [ref=f13e236]: You want a badge that says this works. There is no badge yet.
        - listitem [ref=f13e237]: You want a lookup or a bug fix. It stays off for those.
