        - link "Read what is wrong with this" [ref=f13e196] [cursor=pointer]:
          - /url: /decision-making-skills/docs/limitations/
      - heading "How we test" [level=2] [ref=f13e197]
      - paragraph [ref=f13e198]: Lots of people share prompt packs. Almost nobody checks if they work. So we run each skill four ways on the same questions.
      - table [ref=f13e200]:
        - rowgroup [ref=f13e201]:
          - row [ref=f13e202]:
            - columnheader "Version" [ref=f13e203]
