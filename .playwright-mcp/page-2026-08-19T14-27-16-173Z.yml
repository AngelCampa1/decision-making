        - paragraph [ref=f13e183]:
          - text: Read from
          - link "the run record" [ref=f13e184] [cursor=pointer]:
            - /url: /decision-making-skills/results/decision-making/2026-08-19-d52236a-n7-remaining-arms/
          - text: ", not typed in."
      - paragraph [ref=f13e185]: We changed how the skill describes itself, over and over. Not one change made it better at spotting a real choice. Each one only traded one kind of mistake for another.
      - generic [ref=f13e186]:
        - paragraph [ref=f13e187]: Then we checked the test set itself
        - paragraph [ref=f13e188]:
          - strong [ref=f13e189]: You could pass 89% of the old one by counting words.
          - text: Long message, real choice. Short message, not a choice. No model needed.
        - paragraph [ref=f13e190]: So every result on that set was a fight over about nine points. That makes our own work look worse. We found it, we wrote it down, and we built a new set. On the new one the word trick gets 0.71.
      - paragraph [ref=f13e191]: So why ship the file at all? A verdict rules what we may claim in public. It does not rule what you may install. Use it if it helps you. Drop it if it does not.
      - paragraph [ref=f13e192]: We also keep a list of the times we broke our own tests. eleven so far. Every one ran clean and handed back a number that looked fine. Nothing crashed. That is why we keep looking.
      - generic [ref=f13e193]:
