      - generic [ref=f13e86]:
        - paragraph [ref=f13e87]: Where the evidence stands
        - paragraph [ref=f13e88]:
          - strong [ref=f13e89]: We have not proven this works.
          - text: No skill here has passed a real test, and the scorecard is empty on purpose.
        - paragraph [ref=f13e90]: We built the measuring tools first. Every result is public, and so is every time we caught our own ruler bending.
      - heading "What goes wrong now" [level=2] [ref=f13e91]
      - paragraph [ref=f13e92]: Give an agent a pile of facts and a question. It treats every fact as equal.
      - paragraph [ref=f13e93]: Tell it that it is raining in Paraguay. Then ask about a trip to Lisbon. You may get a raincoat in the answer. The fact arrived, so the agent used it.
      - paragraph [ref=f13e94]: “…and given the rain in Paraguay, pack a raincoat.”
      - paragraph [ref=f13e95]: A big choice and a small one get the same thought. That is the other half of the problem.
      - heading "Six methods. It reads one." [level=2] [ref=f13e96]
      - paragraph [ref=f13e97]: It asks one question first. What is hard here? The answer picks the method.
      - list [ref=f13e98]:
        - listitem [ref=f13e99]:
          - text: "01"
          - heading "Sort the pile" [level=3] [ref=f13e100]
          - paragraph [ref=f13e101]: Too much arrived and you cannot tell what matters.
          - link "ledger.md" [ref=f13e102] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/ledger.md
        - listitem [ref=f13e103]:
          - text: "02"
          - heading "Check it fits you" [level=3] [ref=f13e104]
          - paragraph [ref=f13e105]: The advice is right in general and may be wrong for you.
          - link "fit.md" [ref=f13e106] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/fit.md
        - listitem [ref=f13e107]:
          - text: "03"
          - heading "Follow what it starts" [level=3] [ref=f13e108]
          - paragraph [ref=f13e109]: The move looks fine and the worry is what comes next.
          - link "cascade.md" [ref=f13e110] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/cascade.md
        - listitem [ref=f13e111]:
          - text: "04"
          - heading "Now or later" [level=3] [ref=f13e112]
          - paragraph [ref=f13e113]: You know what to do and not when.
          - link "timing.md" [ref=f13e114] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/timing.md
        - listitem [ref=f13e115]:
          - text: "05"
          - heading "Hear both sides" [level=3] [ref=f13e116]
          - paragraph [ref=f13e117]: Two answers are each fair and one got argued first.
          - link "council.md" [ref=f13e118] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/council.md
        - listitem [ref=f13e119]:
          - text: "06"
          - heading "Ask or decide" [level=3] [ref=f13e120]
          - paragraph [ref=f13e121]: A fact is missing and you cannot tell if it matters.
          - link "hinge.md" [ref=f13e122] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/hinge.md
      - paragraph [ref=f13e123]: More than one can apply. Then they run in order, and each one feeds the next.
      - paragraph [ref=f13e124]: Two is usually enough. Three means you have two choices, not one.
      - paragraph [ref=f13e125]: It also knows when to stay off. A lookup is not a choice. Neither is a bug hunt.
      - heading "Install it in one line" [level=2] [ref=f13e126]
      - paragraph [ref=f13e127]:
        - text: The files are plain markdown, which is text you can read yourself. They follow the
        - link "Agent Skills" [ref=f13e128] [cursor=pointer]:
          - /url: https://agentskills.io
        - text: standard. Nothing to build and nothing to convert.
      - heading "Claude Code" [level=3] [ref=f13e129]
      - generic [ref=f13e130]:
        - code [ref=f13e132]: cp -r skills/* .claude/skills/
        - button "copy" [ref=f13e133] [cursor=pointer]
      - heading "Codex, Cursor, Copilot, Gemini CLI, Cline, Amp, OpenCode" [level=3] [ref=f13e134]
      - generic [ref=f13e135]:
        - code [ref=f13e137]: cp -r .agents/skills/* ~/.agents/skills/
        - button "copy" [ref=f13e138] [cursor=pointer]
      - paragraph [ref=f13e139]: There is also a Claude Code plugin. It ships nothing today. A skill goes in only after it passes a test.
      - generic [ref=f13e140]:
        - paragraph [ref=f13e141]: Before you install it
        - paragraph [ref=f13e142]: We have not shown this helps yet. It is free, and one line takes it back out.
      - heading "What we found" [level=2] [ref=f13e143]
      - paragraph [ref=f13e144]: We have made ~8,550 model calls. They all ask one thing. Does the skill turn on at the right time? None of them ask yet whether it helps you choose better.
      - figure "Does the skill turn on when it should? Firing accuracy by how the skill describes itself. 258 questions, haiku." [ref=f13e145]:
