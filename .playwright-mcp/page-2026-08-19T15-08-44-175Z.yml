      - generic [ref=f136e90]:
        - paragraph [ref=f136e91]: Where the evidence stands
        - paragraph [ref=f136e92]:
          - strong [ref=f136e93]: We have not proven this works.
          - text: No skill here has passed a real test. The scorecard is empty on purpose.
        - paragraph [ref=f136e94]: We built the measuring tools first. Every result is public. So is every time we caught our own ruler bending.
      - heading "What goes wrong now" [level=2] [ref=f136e95]
      - paragraph [ref=f136e96]: Give an agent a pile of facts and a question. It treats every fact as equal.
      - paragraph [ref=f136e97]: Tell it that it is raining in Paraguay. Then ask about a trip to Lisbon. You may get a raincoat in the answer. The fact arrived, so the agent used it.
      - paragraph [ref=f136e98]: “…and given the rain in Paraguay, pack a raincoat.”
      - paragraph [ref=f136e99]: A big choice and a small one get the same thought. That is the other half of the problem.
      - heading "Six methods. It reads one." [level=2] [ref=f136e100]
      - paragraph [ref=f136e101]: It asks one question first. What is hard here? The answer picks the method.
      - list [ref=f136e102]:
        - listitem [ref=f136e103]:
          - text: "01"
          - heading "Sort the pile" [level=3] [ref=f136e104]
          - paragraph [ref=f136e105]: Too much arrived and you cannot tell what matters.
          - link "ledger.md" [ref=f136e106] [cursor=pointer]:
