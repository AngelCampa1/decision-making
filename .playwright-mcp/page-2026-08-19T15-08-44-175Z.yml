              - code [ref=f136e223]: placebo
            - cell "Filler of the same length and shape." [ref=f136e224]
            - cell "whether the words did the work" [ref=f136e225]
          - row [ref=f136e226]:
            - cell [ref=f136e227]:
              - code [ref=f136e228]: cot
            - cell "Just \"think step by step\"." [ref=f136e229]
            - cell "whether a cheap line does the same" [ref=f136e230]
      - paragraph [ref=f136e231]: A placebo is a fake with the same shape. Beating no skill at all is easy. The placebo is the one that tells us anything. If filler scores the same, the words did nothing.
      - paragraph [ref=f136e232]: We write down what we expect before each run. The date goes into git history, so we cannot move it later. A guess made after the fact is not a guess.
      - heading "Who this is for" [level=2] [ref=f136e233]
      - list [ref=f136e234]:
        - listitem [ref=f136e235]: You use an AI agent and face real choices.
        - listitem [ref=f136e236]: You write agent skills and want to know if yours works.
        - listitem [ref=f136e237]: You study these tools and want the raw data.
      - heading "Who it is not for" [level=3] [ref=f136e238]
      - list [ref=f136e239]:
        - listitem [ref=f136e240]: You want a badge that says this works. There is no badge yet.
        - listitem [ref=f136e241]: You want a lookup or a bug fix. It stays off for those.
