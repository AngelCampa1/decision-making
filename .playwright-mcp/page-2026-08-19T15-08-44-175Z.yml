          - /url: /decision-making-skills/docs/limitations/
      - heading "How we test" [level=2] [ref=f136e201]
      - paragraph [ref=f136e202]: Lots of people share prompt packs. Almost nobody checks if they work. So we run each skill four ways on the same questions.
      - table [ref=f136e204]:
        - rowgroup [ref=f136e205]:
          - row [ref=f136e206]:
            - columnheader "Version" [ref=f136e207]
