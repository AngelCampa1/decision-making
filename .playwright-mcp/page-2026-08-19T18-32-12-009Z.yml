        - paragraph [ref=f160e133]:
          - text: A verdict governs the
          - emphasis [ref=f160e134]: public claim
          - text: ", not whether a skill is usable."
          - code [ref=f160e135]: "NULL"
          - text: means we have not shown it works, which is not the same as showing it does not.
        - heading "The retirement rule" [level=2] [ref=f160e136]
        - paragraph [ref=f160e137]: The maintainer’s daily use is the fastest signal this project has, and until now it could only come out positive. A procedure that fires when it should not, or that produces a worse answer than thinking directly, had no way of being recorded as such. Evidence that cannot come out negative is not evidence, so here is the failure condition.
        - paragraph [ref=f160e138]:
          - strong [ref=f160e139]:
            - text: A procedure disabled for 14 consecutive days is marked
            - code [ref=f160e140]: WITHDRAWN
            - text: .
        - list [ref=f160e141]:
          - listitem [ref=f160e142]:
            - text: The clock starts at a dated line in
            - link [ref=f160e143] [cursor=pointer]:
              - /url: /decision-making-skills/notebook/
              - code [ref=f160e144]: notebook/
            - text: saying the procedure was turned off and why. Turning it back on is another dated line.
          - listitem [ref=f160e145]: Fourteen days is chosen to survive a holiday and not to survive disinterest. It is a judgement, not a measurement, and it is written down before any procedure is near it so that it cannot be chosen to spare one.
          - listitem [ref=f160e146]:
            - code [ref=f160e147]: WITHDRAWN
            - text: blocks the plugin exactly as
            - code [ref=f160e148]: UNTESTED
            - text: does, and
            - code [ref=f160e149]: de lint
            - text: enforces that rather than intention.
          - listitem [ref=f160e150]:
            - text: It is reversible. A withdrawn procedure that is rewritten and used again returns to
            - code [ref=f160e151]: UNTESTED
            - text: ", and the notebook keeps both entries."
        - paragraph [ref=f160e152]: This is not a public claim about the procedure. It says the person who wrote it stopped reaching for it, which is worth exactly as much as that sounds, and considerably more than an evidence channel that only ever agrees with itself.
