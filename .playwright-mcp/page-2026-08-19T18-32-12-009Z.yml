          - code [ref=f160e36]: de report
          - text: command, no
          - code [ref=f160e37]: summary.json
          - text: under
          - code [ref=f160e38]: results/
          - text: ", and no scorecard step in"
          - code [ref=f160e39]: de check
          - text: . The file had not changed since the initial commit, so nothing ever tested the promise.
        - paragraph [ref=f160e40]:
          - text: Correcting it rather than building the generator, because the table is still empty. A generator written now would be written against a results schema no run has produced. When the first confirmatory run lands,
          - code [ref=f160e41]: de report
          - text: gets built and this paragraph gets replaced by the guarantee it describes.
        - paragraph [ref=f160e42]:
          - text: What
          - emphasis [ref=f160e43]: is
          - text: "enforced today is the promotion gate:"
          - code [ref=f160e44]: de lint
          - text: refuses to let a skill carrying
          - code [ref=f160e45]: UNTESTED
          - text: or
          - code [ref=f160e46]: WITHDRAWN
          - text: sit in
          - code [ref=f160e47]: plugin/skills/
          - text: ", and"
          - code [ref=f160e48]: de check
          - text: runs it. That check is real and has teeth. The table below does not.
        - paragraph [ref=f160e49]:
          - text: "Four more checks over the method itself were added on 2026-08-13, each after the failure it prevents had already happened here. Run provenance: a published run must state its answer-key version and name a prediction that can be shown to predate its data. Integrity wiring: a module with a coverage floor that no entry point reaches is refused. The decision register: a change to the answer key or the shipped skill needs a written reason. Documentation: a"
          - code [ref=f160e50]: de
          - text: command or path that this repository does not have is refused. None of them can put a row in the table below. They govern whether a number is
          - emphasis [ref=f160e51]: traceable
          - text: ", not whether it is"
          - emphasis [ref=f160e52]: good
          - text: .
        - heading "The caveat that used to qualify every number on record" [level=2] [ref=f160e53]
        - paragraph [ref=f160e54]: "Every trigger measurement made before 2026-08-18 ran on a corpus that is 89% solvable by counting words (AUC 0.850 on turn length alone; a bare “fire if ≥ 18 words” rule scores 0.890 on the version 2 key, against the best arm on that key, 0.9795 to 0.9863). That has not changed and does not get to change: it still applies, in full, to every number computed on trigger corpus versions 1 through 3, which is every published Track L and Track M result. The paired comparisons between arms on those versions remain valid; the absolute numbers still do not travel, and “nothing moved discrimination” still has the second reading that a corpus with nowhere to move explains a null as well as a real effect does."
        - paragraph [ref=f160e55]:
          - text: It can no longer be said of every number on record. Track N6 (2026-08-18) ran on trigger corpus v4, 258 items in
          - code [ref=f160e56]: datasets/triggers/decision-making/index.yaml
          - text: ", whose best depth-2 stump over eight trivial features reads 0.7054 against a majority baseline of 0.6667. That is a corpus a trivial feature can barely nudge, not one it solves. All three arms N6 ran,"
          - code [ref=f160e57]: full
          - text: ","
          - code [ref=f160e58]: stakes-shown
          - text: and
          - code [ref=f160e59]: opener-only
          - text: ", cleared the stump by 12 to 24 points (accuracy 0.8295, 0.9360, 0.9477 against the 0.7054 bar)."
          - link "Run" [ref=f160e60] [cursor=pointer]:
            - /url: /decision-making-skills/results/decision-making/2026-08-18-e632659-n6-confirmatory/
          - text: .
        - paragraph [ref=f160e61]:
          - text: "What that is worth, stated so it is not overclaimed: one confirmatory run, three arms, one corpus revision. It says this instrument, on this corpus, is not solved by a trivial feature. It does not say the skill works, does not touch"
          - code [ref=f160e62]: "verdict: UNTESTED"
          - text: ", and does not fill in the table below. A trigger measurement is about whether the skill fires, not about whether firing produces a better decision, and nothing has measured the second question yet."
        - paragraph [ref=f160e63]:
          - text: The rebuild is Track N; N7 is running as this is written, and the corpus’s own gates (Track N1) still apply to v4 going forward exactly as they applied to v1 through v3. See
          - link [ref=f160e64] [cursor=pointer]:
            - /url: /decision-making-skills/docs/limitations/
            - code [ref=f160e65]: docs/LIMITATIONS.md
          - text: .
        - paragraph [ref=f160e66]: "None of this touches the table below, which is empty for a different and simpler reason: no skill has been measured on whether it improves a decision at all."
