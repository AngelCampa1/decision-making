        - listitem [ref=f8e106]:
          - text: "02"
          - heading "Check it fits you" [level=3] [ref=f8e107]
          - paragraph [ref=f8e108]: The advice is right in general and may be wrong for you.
          - link "fit.md" [ref=f8e109] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/fit.md
        - listitem [ref=f8e110]:
          - text: "03"
          - heading "Follow what it starts" [level=3] [ref=f8e111]
          - paragraph [ref=f8e112]: The move looks fine and the worry is what comes next.
          - link "cascade.md" [ref=f8e113] [cursor=pointer]:
