          - /url: /decision-making-skills/docs/limitations/
      - heading "How we test" [level=2] [ref=f8e200]
      - paragraph [ref=f8e201]: Lots of people share prompt packs. Almost nobody checks if they work. So we run each skill four ways on the same questions.
      - table [ref=f8e203]:
        - rowgroup [ref=f8e204]:
