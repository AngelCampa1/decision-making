        - button "copy" [ref=f8e141] [cursor=pointer]
      - paragraph [ref=f8e142]: There is also a Claude Code plugin. It ships nothing today. A skill goes in only after it passes a test.
      - generic [ref=f8e143]:
        - paragraph [ref=f8e144]: Before you install it
        - paragraph [ref=f8e145]: We have not shown this helps yet. It is free, and one line takes it back out.
      - heading "What we found" [level=2] [ref=f8e146]
      - paragraph [ref=f8e147]: We have made ~8,550 model calls. They all ask one thing. Does the skill turn on at the right time? None of them ask yet whether it helps you choose better.
      - figure "Does the skill turn on when it should? Firing accuracy by how the skill describes itself. 258 questions, haiku." [ref=f8e148]:
