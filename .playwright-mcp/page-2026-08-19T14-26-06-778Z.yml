          - heading "Hear both sides" [level=3] [ref=f8e119]
          - paragraph [ref=f8e120]: Two answers are each fair and one got argued first.
          - link "council.md" [ref=f8e121] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/council.md
        - listitem [ref=f8e122]:
          - text: "06"
          - heading "Ask or decide" [level=3] [ref=f8e123]
          - paragraph [ref=f8e124]: A fact is missing and you cannot tell if it matters.
          - link "hinge.md" [ref=f8e125] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/hinge.md
      - paragraph [ref=f8e126]: More than one can apply. Then they run in order, and each one feeds the next.
      - paragraph [ref=f8e127]: Two is usually enough. Three means you have two choices, not one.
      - paragraph [ref=f8e128]: It also knows when to stay off. A lookup is not a choice. Neither is a bug hunt.
      - heading "Install it in one line" [level=2] [ref=f8e129]
      - paragraph [ref=f8e130]:
        - text: The files are plain markdown, which is text you can read yourself. They follow the
        - link "Agent Skills" [ref=f8e131] [cursor=pointer]:
          - /url: https://agentskills.io
        - text: standard. Nothing to build and nothing to convert.
      - heading "Claude Code" [level=3] [ref=f8e132]
      - generic [ref=f8e133]:
        - code [ref=f8e135]: cp -r skills/* .claude/skills/
        - button "copy" [ref=f8e136] [cursor=pointer]
      - heading "Codex, Cursor, Copilot, Gemini CLI, Cline, Amp, OpenCode" [level=3] [ref=f8e137]
