      - generic [ref=f8e89]:
        - paragraph [ref=f8e90]: Where the evidence stands
        - paragraph [ref=f8e91]:
          - strong [ref=f8e92]: We have not proven this works.
          - text: No skill here has passed a real test, and the scorecard is empty on purpose.
        - paragraph [ref=f8e93]: We built the measuring tools first. Every result is public, and so is every time we caught our own ruler bending.
      - heading "What goes wrong now" [level=2] [ref=f8e94]
      - paragraph [ref=f8e95]: Give an agent a pile of facts and a question. It treats every fact as equal.
      - paragraph [ref=f8e96]: Tell it that it is raining in Paraguay. Then ask about a trip to Lisbon. You may get a raincoat in the answer. The fact arrived, so the agent used it.
      - paragraph [ref=f8e97]: “…and given the rain in Paraguay, pack a raincoat.”
      - paragraph [ref=f8e98]: A big choice and a small one get the same thought. That is the other half of the problem.
      - heading "Six methods. It reads one." [level=2] [ref=f8e99]
      - paragraph [ref=f8e100]: It asks one question first. What is hard here? The answer picks the method.
      - list [ref=f8e101]:
        - listitem [ref=f8e102]:
          - text: "01"
          - heading "Sort the pile" [level=3] [ref=f8e103]
          - paragraph [ref=f8e104]: Too much arrived and you cannot tell what matters.
          - link "ledger.md" [ref=f8e105] [cursor=pointer]:
