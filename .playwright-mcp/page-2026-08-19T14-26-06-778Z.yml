        - listitem [ref=f8e114]:
          - text: "04"
          - heading "Now or later" [level=3] [ref=f8e115]
          - paragraph [ref=f8e116]: You know what to do and not when.
          - link "timing.md" [ref=f8e117] [cursor=pointer]:
