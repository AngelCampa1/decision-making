            - cell "whether a cheap line does the same" [ref=f8e229]
      - paragraph [ref=f8e230]: A placebo is a fake with the same shape. Beating no skill at all is easy. The placebo is the real test. If filler scores the same, the words did the work.
      - paragraph [ref=f8e231]: We write down what we expect before each run. The date goes into git history, so we cannot move it later. A guess made after the fact is not a guess.
      - heading "Who this is for" [level=2] [ref=f8e232]
      - list [ref=f8e233]:
        - listitem [ref=f8e234]: You use an AI agent and face real choices.
        - listitem [ref=f8e235]: You write agent skills and want to know if yours works.
        - listitem [ref=f8e236]: You study these tools and want the raw data.
      - heading "Who it is not for" [level=3] [ref=f8e237]
      - list [ref=f8e238]:
        - listitem [ref=f8e239]: You want a badge that says this works. There is no badge yet.
        - listitem [ref=f8e240]: You want a lookup or a bug fix. It stays off for those.
