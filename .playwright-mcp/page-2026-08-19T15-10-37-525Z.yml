      - heading "How we test" [level=2] [ref=f138e198]
      - paragraph [ref=f138e199]: Lots of people share prompt packs. Almost nobody checks if they work. So we run each skill four ways on the same questions.
      - table [ref=f138e201]:
        - rowgroup [ref=f138e202]:
          - row [ref=f138e203]:
            - columnheader "Version" [ref=f138e204]
