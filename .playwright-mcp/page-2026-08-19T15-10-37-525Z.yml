              - code [ref=f138e220]: placebo
            - cell "Filler of the same length and shape." [ref=f138e221]
            - cell "whether the words did the work" [ref=f138e222]
          - row [ref=f138e223]:
            - cell [ref=f138e224]:
              - code [ref=f138e225]: cot
            - cell "Just \"think step by step\"." [ref=f138e226]
            - cell "whether a cheap line does the same" [ref=f138e227]
      - paragraph [ref=f138e228]: A placebo is a fake with the same shape. Beating no skill at all is easy. The placebo is the one that tells us anything. If filler scores the same, the words did nothing.
      - paragraph [ref=f138e229]: We write down what we expect before each run. The date goes into git history, so we cannot move it later. A guess made after the fact is not a guess.
      - heading "Who this is for" [level=2] [ref=f138e230]
      - list [ref=f138e231]:
        - listitem [ref=f138e232]: You use an AI agent and face real choices.
        - listitem [ref=f138e233]: You write agent skills and want to know if yours works.
        - listitem [ref=f138e234]: You study these tools and want the raw data.
      - heading "Who it is not for" [level=3] [ref=f138e235]
      - list [ref=f138e236]:
        - listitem [ref=f138e237]: You want a badge that says this works. There is no badge yet.
        - listitem [ref=f138e238]: You want a lookup or a bug fix. It stays off for those.
