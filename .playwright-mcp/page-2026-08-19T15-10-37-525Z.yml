        - listitem [ref=f138e104]:
          - text: "02"
          - heading "Check it fits you" [level=3] [ref=f138e105]
          - paragraph [ref=f138e106]: The advice is right in general and may be wrong for you.
          - link "fit.md" [ref=f138e107] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/fit.md
        - listitem [ref=f138e108]:
          - text: "03"
          - heading "Follow what it starts" [level=3] [ref=f138e109]
          - paragraph [ref=f138e110]: The move looks fine and the worry is what comes next.
          - link "cascade.md" [ref=f138e111] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/cascade.md
        - listitem [ref=f138e112]:
          - text: "04"
          - heading "Now or later" [level=3] [ref=f138e113]
          - paragraph [ref=f138e114]: You know what to do and not when.
          - link "timing.md" [ref=f138e115] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/timing.md
        - listitem [ref=f138e116]:
          - text: "05"
          - heading "Hear both sides" [level=3] [ref=f138e117]
          - paragraph [ref=f138e118]: Two answers are each fair and one got argued first.
          - link "council.md" [ref=f138e119] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/council.md
        - listitem [ref=f138e120]:
          - text: "06"
          - heading "Ask or decide" [level=3] [ref=f138e121]
          - paragraph [ref=f138e122]: A fact is missing and you cannot tell if it matters.
          - link "hinge.md" [ref=f138e123] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/hinge.md
      - paragraph [ref=f138e124]: More than one can apply. Then they run in order, and each feeds the next.
      - paragraph [ref=f138e125]: Two is usually enough. Three means you have two choices, not one.
      - paragraph [ref=f138e126]: It also knows when to stay off. A lookup is not a choice, and neither is a bug hunt.
      - heading "Install it in one line" [level=2] [ref=f138e127]
      - paragraph [ref=f138e128]:
        - text: The files are plain markdown, so you can read them yourself. They follow the
        - link "Agent Skills" [ref=f138e129] [cursor=pointer]:
          - /url: https://agentskills.io
        - text: standard. You copy them and they work.
      - heading "Claude Code" [level=3] [ref=f138e130]
      - generic [ref=f138e131]:
        - code [ref=f138e133]: cp -r skills/* .claude/skills/
        - button "copy" [ref=f138e134] [cursor=pointer]
      - heading "Codex, Cursor, Copilot, Gemini CLI, Cline, Amp, OpenCode" [level=3] [ref=f138e135]
      - generic [ref=f138e136]:
        - code [ref=f138e138]: cp -r .agents/skills/* ~/.agents/skills/
        - button "copy" [ref=f138e139] [cursor=pointer]
      - paragraph [ref=f138e140]: There is also a Claude Code plugin. It ships nothing today. A skill goes in only after it passes a test.
      - generic [ref=f138e141]:
        - paragraph [ref=f138e142]: Before you install it
        - paragraph [ref=f138e143]: We have not shown this helps yet. It is free, and one line takes it back out.
      - heading "What we found" [level=2] [ref=f138e144]
      - paragraph [ref=f138e145]: We have made ~8,550 model calls. Every one asks the same thing. Does the skill turn on at the right time? Not one of them asks yet whether it helps you choose better.
      - figure "Does the skill turn on when it should? Firing accuracy by how the skill describes itself. 258 questions, haiku." [ref=f138e146]:
