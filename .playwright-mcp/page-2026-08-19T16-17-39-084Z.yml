      - generic [ref=f147e90]:
        - paragraph [ref=f147e91]: Where the evidence stands
        - paragraph [ref=f147e92]:
          - strong [ref=f147e93]: We have not proven this works.
          - text: No skill here has passed a real test. The scorecard is empty on purpose.
        - paragraph [ref=f147e94]: We built the measuring tools first. Every result is public. So is every time we caught our own ruler bending.
      - heading "What goes wrong now" [level=2] [ref=f147e95]
      - paragraph [ref=f147e96]: Give an agent a pile of facts and a question. It treats every fact as equal.
      - paragraph [ref=f147e97]: Tell it that it is raining in Paraguay. Then ask about a trip to Lisbon. You may get a raincoat in the answer. The fact arrived, so the agent used it.
      - paragraph [ref=f147e98]: “…and given the rain in Paraguay, pack a raincoat.”
      - paragraph [ref=f147e99]: A big choice and a small one get the same thought. That is the other half of the problem.
      - heading "Six methods. It reads one." [level=2] [ref=f147e100]
      - paragraph [ref=f147e101]: It asks one question first. What is hard here? The answer picks the method.
      - list [ref=f147e102]:
        - listitem [ref=f147e103]:
          - text: "01"
          - heading "Sort the pile" [level=3] [ref=f147e104]
