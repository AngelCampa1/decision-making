      - heading "How we test" [level=2] [ref=f147e201]
      - paragraph [ref=f147e202]: Lots of people share prompt packs. Almost nobody checks if they work. So we run each skill four ways on the same questions.
      - table [ref=f147e204]:
        - rowgroup [ref=f147e205]:
