          - heading "Hear both sides" [level=3] [ref=f147e120]
          - paragraph [ref=f147e121]: Two answers are each fair and one got argued first.
          - link "council.md" [ref=f147e122] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/council.md
        - listitem [ref=f147e123]:
          - text: "06"
          - heading "Ask or decide" [level=3] [ref=f147e124]
          - paragraph [ref=f147e125]: A fact is missing and you cannot tell if it matters.
          - link "hinge.md" [ref=f147e126] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/hinge.md
      - paragraph [ref=f147e127]: More than one can apply. Then they run in order, and each feeds the next.
      - paragraph [ref=f147e128]: Two is usually enough. Three means you have two choices, not one.
      - paragraph [ref=f147e129]: It also knows when to stay off. A lookup is not a choice, and neither is a bug hunt.
      - heading "Install it in one line" [level=2] [ref=f147e130]
      - paragraph [ref=f147e131]:
        - text: The files are plain markdown, so you can read them yourself. They follow the
        - link "Agent Skills" [ref=f147e132] [cursor=pointer]:
          - /url: https://agentskills.io
        - text: standard. You copy them and they work.
      - heading "Claude Code" [level=3] [ref=f147e133]
      - generic [ref=f147e134]:
        - code [ref=f147e136]: cp -r skills/* .claude/skills/
        - button "copy" [ref=f147e137] [cursor=pointer]
      - heading "Codex, Cursor, Copilot, Gemini CLI, Cline, Amp, OpenCode" [level=3] [ref=f147e138]
      - generic [ref=f147e139]:
        - code [ref=f147e141]: cp -r .agents/skills/* ~/.agents/skills/
        - button "copy" [ref=f147e142] [cursor=pointer]
      - paragraph [ref=f147e143]: There is also a Claude Code plugin. It ships nothing today. A skill goes in only after it passes a test.
      - generic [ref=f147e144]:
        - paragraph [ref=f147e145]: Before you install it
        - paragraph [ref=f147e146]: We have not shown this helps yet. It is free, and one line takes it back out.
      - heading "What we found" [level=2] [ref=f147e147]
      - paragraph [ref=f147e148]: We have made ~8,514 model calls. Every one asks the same thing. Does the skill turn on at the right time? Not one of them asks yet whether it helps you choose better.
      - figure "Does the skill turn on when it should? Firing accuracy by how the skill describes itself. 258 questions, haiku." [ref=f147e149]:
