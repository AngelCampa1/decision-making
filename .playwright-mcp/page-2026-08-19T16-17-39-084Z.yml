              - code [ref=f147e228]: cot
            - cell "Just \"think step by step\"." [ref=f147e229]
            - cell "whether a cheap line does the same" [ref=f147e230]
      - paragraph [ref=f147e231]: A placebo is a fake with the same shape. Beating no skill at all is easy. The placebo is the one that tells us anything. If filler scores the same, the words did nothing.
      - paragraph [ref=f147e232]: We write down what we expect before each run. The date goes into git history, so we cannot move it later. A guess made after the fact is not a guess.
      - heading "Who this is for" [level=2] [ref=f147e233]
      - list [ref=f147e234]:
        - listitem [ref=f147e235]: You use an AI agent and face real choices.
        - listitem [ref=f147e236]: You write agent skills and want to know if yours works.
        - listitem [ref=f147e237]: You study these tools and want the raw data.
      - heading "Who it is not for" [level=3] [ref=f147e238]
      - list [ref=f147e239]:
        - listitem [ref=f147e240]: You want a badge that says this works. There is no badge yet.
        - listitem [ref=f147e241]: You want a lookup or a bug fix. It stays off for those.
