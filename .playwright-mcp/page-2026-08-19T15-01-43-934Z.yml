        - paragraph [ref=f133e186]:
          - text: Read from
          - link "the run record" [ref=f133e187] [cursor=pointer]:
            - /url: /decision-making-skills/results/decision-making/2026-08-19-d52236a-n7-remaining-arms/
          - text: ", not typed in."
      - paragraph [ref=f133e188]: We changed how the skill describes itself, over and over. Not one change made it better at spotting a real choice. Each one only traded one kind of mistake for another.
      - generic [ref=f133e189]:
        - paragraph [ref=f133e190]: Then we checked the test set itself
        - paragraph [ref=f133e191]:
          - strong [ref=f133e192]: You could pass 89% of the old one by counting words.
          - text: Long message, real choice. Short message, not a choice. A word count gets you that far on its own.
        - paragraph [ref=f133e193]: So every result on that set was a fight over about nine points. That makes our own work look worse. We found it, we wrote it down, and we built a new set. On the new one the word trick gets 0.71.
      - paragraph [ref=f133e194]: So why ship the file at all? A verdict rules what we may claim in public. It does not rule what you may install. Use it if it helps you. Drop it if it does not.
      - paragraph [ref=f133e195]: We also keep a list of the times we broke our own tests. eleven so far. Every one ran clean and handed back a number that looked fine. Nothing crashed. That is why we keep looking.
