              - code [ref=f133e227]: cot
            - cell "Just \"think step by step\"." [ref=f133e228]
            - cell "whether a cheap line does the same" [ref=f133e229]
      - paragraph [ref=f133e230]: A placebo is a fake with the same shape. Beating no skill at all is easy. The placebo is the one that tells us anything. If filler scores the same, the words did nothing.
      - paragraph [ref=f133e231]: We write down what we expect before each run. The date goes into git history, so we cannot move it later. A guess made after the fact is not a guess.
      - heading "Who this is for" [level=2] [ref=f133e232]
      - list [ref=f133e233]:
        - listitem [ref=f133e234]: You use an AI agent and face real choices.
        - listitem [ref=f133e235]: You write agent skills and want to know if yours works.
        - listitem [ref=f133e236]: You study these tools and want the raw data.
      - heading "Who it is not for" [level=3] [ref=f133e237]
      - list [ref=f133e238]:
        - listitem [ref=f133e239]: You want a badge that says this works. There is no badge yet.
        - listitem [ref=f133e240]: You want a lookup or a bug fix. It stays off for those.
