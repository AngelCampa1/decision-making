      - generic [ref=f133e89]:
        - paragraph [ref=f133e90]: Where the evidence stands
        - paragraph [ref=f133e91]:
          - strong [ref=f133e92]: We have not proven this works.
          - text: No skill here has passed a real test. The scorecard is empty on purpose.
        - paragraph [ref=f133e93]: We built the measuring tools first. Every result is public. So is every time we caught our own ruler bending.
      - heading "What goes wrong now" [level=2] [ref=f133e94]
      - paragraph [ref=f133e95]: Give an agent a pile of facts and a question. It treats every fact as equal.
      - paragraph [ref=f133e96]: Tell it that it is raining in Paraguay. Then ask about a trip to Lisbon. You may get a raincoat in the answer. The fact arrived, so the agent used it.
      - paragraph [ref=f133e97]: “…and given the rain in Paraguay, pack a raincoat.”
      - paragraph [ref=f133e98]: A big choice and a small one get the same thought. That is the other half of the problem.
      - heading "Six methods. It reads one." [level=2] [ref=f133e99]
      - paragraph [ref=f133e100]: It asks one question first. What is hard here? The answer picks the method.
      - list [ref=f133e101]:
        - listitem [ref=f133e102]:
          - text: "01"
          - heading "Sort the pile" [level=3] [ref=f133e103]
          - paragraph [ref=f133e104]: Too much arrived and you cannot tell what matters.
          - link "ledger.md" [ref=f133e105] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/ledger.md
        - listitem [ref=f133e106]:
          - text: "02"
          - heading "Check it fits you" [level=3] [ref=f133e107]
          - paragraph [ref=f133e108]: The advice is right in general and may be wrong for you.
          - link "fit.md" [ref=f133e109] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/fit.md
        - listitem [ref=f133e110]:
          - text: "03"
          - heading "Follow what it starts" [level=3] [ref=f133e111]
          - paragraph [ref=f133e112]: The move looks fine and the worry is what comes next.
          - link "cascade.md" [ref=f133e113] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/cascade.md
        - listitem [ref=f133e114]:
          - text: "04"
          - heading "Now or later" [level=3] [ref=f133e115]
          - paragraph [ref=f133e116]: You know what to do and not when.
          - link "timing.md" [ref=f133e117] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/timing.md
        - listitem [ref=f133e118]:
          - text: "05"
          - heading "Hear both sides" [level=3] [ref=f133e119]
          - paragraph [ref=f133e120]: Two answers are each fair and one got argued first.
          - link "council.md" [ref=f133e121] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/council.md
        - listitem [ref=f133e122]:
          - text: "06"
          - heading "Ask or decide" [level=3] [ref=f133e123]
          - paragraph [ref=f133e124]: A fact is missing and you cannot tell if it matters.
          - link "hinge.md" [ref=f133e125] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/hinge.md
      - paragraph [ref=f133e126]: More than one can apply. Then they run in order, and each feeds the next.
      - paragraph [ref=f133e127]: Two is usually enough. Three means you have two choices, not one.
      - paragraph [ref=f133e128]: It also knows when to stay off. A lookup is not a choice, and neither is a bug hunt.
      - heading "Install it in one line" [level=2] [ref=f133e129]
      - paragraph [ref=f133e130]:
        - text: The files are plain markdown, so you can read them yourself. They follow the
        - link "Agent Skills" [ref=f133e131] [cursor=pointer]:
          - /url: https://agentskills.io
        - text: standard. You copy them and they work.
      - heading "Claude Code" [level=3] [ref=f133e132]
      - generic [ref=f133e133]:
        - code [ref=f133e135]: cp -r skills/* .claude/skills/
        - button "copy" [ref=f133e136] [cursor=pointer]
      - heading "Codex, Cursor, Copilot, Gemini CLI, Cline, Amp, OpenCode" [level=3] [ref=f133e137]
      - generic [ref=f133e138]:
        - code [ref=f133e140]: cp -r .agents/skills/* ~/.agents/skills/
        - button "copy" [ref=f133e141] [cursor=pointer]
      - paragraph [ref=f133e142]: There is also a Claude Code plugin. It ships nothing today. A skill goes in only after it passes a test.
      - generic [ref=f133e143]:
        - paragraph [ref=f133e144]: Before you install it
        - paragraph [ref=f133e145]: We have not shown this helps yet. It is free, and one line takes it back out.
      - heading "What we found" [level=2] [ref=f133e146]
      - paragraph [ref=f133e147]: We have made ~8,550 model calls. Every one asks the same thing. Does the skill turn on at the right time? Not one of them asks yet whether it helps you choose better.
      - figure "Does the skill turn on when it should? Firing accuracy by how the skill describes itself. 258 questions, haiku." [ref=f133e148]:
