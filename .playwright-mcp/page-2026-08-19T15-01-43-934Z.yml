      - heading "How we test" [level=2] [ref=f133e200]
      - paragraph [ref=f133e201]: Lots of people share prompt packs. Almost nobody checks if they work. So we run each skill four ways on the same questions.
      - table [ref=f133e203]:
        - rowgroup [ref=f133e204]:
          - row [ref=f133e205]:
            - columnheader "Version" [ref=f133e206]
