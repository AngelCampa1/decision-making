        - paragraph [ref=f155e28]: Every trigger result published before 2026-08-18 was measured on a set a word count passes 89% of the time, so those results were competing for about nine points over a ruler. The results are real; the room they had was small.
        - paragraph [ref=f155e29]: It does not apply to every run below. The corpus was rebuilt, and on the new one the best model-free shortcut reaches 0.71. Each run names the answer-key version it used.
