        - link "Read what is wrong with this" [ref=f135e200] [cursor=pointer]:
          - /url: /decision-making-skills/docs/limitations/
      - heading "How we test" [level=2] [ref=f135e201]
      - paragraph [ref=f135e202]: Lots of people share prompt packs. Almost nobody checks if they work. So we run each skill four ways on the same questions.
      - table [ref=f135e204]:
        - rowgroup [ref=f135e205]:
          - row [ref=f135e206]:
            - columnheader "Version" [ref=f135e207]
            - columnheader "What we run" [ref=f135e208]
            - columnheader "What it tells us" [ref=f135e209]
        - rowgroup [ref=f135e210]:
          - row [ref=f135e211]:
