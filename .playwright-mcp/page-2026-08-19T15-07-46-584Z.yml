        - listitem [ref=f135e107]:
          - text: "02"
          - heading "Check it fits you" [level=3] [ref=f135e108]
          - paragraph [ref=f135e109]: The advice is right in general and may be wrong for you.
          - link "fit.md" [ref=f135e110] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/fit.md
        - listitem [ref=f135e111]:
          - text: "03"
          - heading "Follow what it starts" [level=3] [ref=f135e112]
          - paragraph [ref=f135e113]: The move looks fine and the worry is what comes next.
          - link "cascade.md" [ref=f135e114] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/cascade.md
        - listitem [ref=f135e115]:
          - text: "04"
          - heading "Now or later" [level=3] [ref=f135e116]
          - paragraph [ref=f135e117]: You know what to do and not when.
          - link "timing.md" [ref=f135e118] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/timing.md
        - listitem [ref=f135e119]:
          - text: "05"
          - heading "Hear both sides" [level=3] [ref=f135e120]
          - paragraph [ref=f135e121]: Two answers are each fair and one got argued first.
          - link "council.md" [ref=f135e122] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/council.md
        - listitem [ref=f135e123]:
          - text: "06"
          - heading "Ask or decide" [level=3] [ref=f135e124]
          - paragraph [ref=f135e125]: A fact is missing and you cannot tell if it matters.
          - link "hinge.md" [ref=f135e126] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/hinge.md
      - paragraph [ref=f135e127]: More than one can apply. Then they run in order, and each feeds the next.
      - paragraph [ref=f135e128]: Two is usually enough. Three means you have two choices, not one.
      - paragraph [ref=f135e129]: It also knows when to stay off. A lookup is not a choice, and neither is a bug hunt.
      - heading "Install it in one line" [level=2] [ref=f135e130]
      - paragraph [ref=f135e131]:
        - text: The files are plain markdown, so you can read them yourself. They follow the
        - link "Agent Skills" [ref=f135e132] [cursor=pointer]:
          - /url: https://agentskills.io
        - text: standard. You copy them and they work.
      - heading "Claude Code" [level=3] [ref=f135e133]
      - generic [ref=f135e134]:
        - code [ref=f135e136]: cp -r skills/* .claude/skills/
        - button "copy" [ref=f135e137] [cursor=pointer]
      - heading "Codex, Cursor, Copilot, Gemini CLI, Cline, Amp, OpenCode" [level=3] [ref=f135e138]
      - generic [ref=f135e139]:
        - code [ref=f135e141]: cp -r .agents/skills/* ~/.agents/skills/
        - button "copy" [ref=f135e142] [cursor=pointer]
      - paragraph [ref=f135e143]: There is also a Claude Code plugin. It ships nothing today. A skill goes in only after it passes a test.
      - generic [ref=f135e144]:
        - paragraph [ref=f135e145]: Before you install it
        - paragraph [ref=f135e146]: We have not shown this helps yet. It is free, and one line takes it back out.
      - heading "What we found" [level=2] [ref=f135e147]
      - paragraph [ref=f135e148]: We have made ~8,550 model calls. Every one asks the same thing. Does the skill turn on at the right time? Not one of them asks yet whether it helps you choose better.
      - figure "Does the skill turn on when it should? Firing accuracy by how the skill describes itself. 258 questions, haiku." [ref=f135e149]:
