              - code [ref=f135e218]: "on"
            - cell "We add the real skill." [ref=f135e219]
            - cell "the thing we care about" [ref=f135e220]
          - row [ref=f135e221]:
            - cell [ref=f135e222]:
              - code [ref=f135e223]: placebo
            - cell "Filler of the same length and shape." [ref=f135e224]
            - cell "whether the words did the work" [ref=f135e225]
          - row [ref=f135e226]:
            - cell [ref=f135e227]:
              - code [ref=f135e228]: cot
            - cell "Just \"think step by step\"." [ref=f135e229]
            - cell "whether a cheap line does the same" [ref=f135e230]
      - paragraph [ref=f135e231]: A placebo is a fake with the same shape. Beating no skill at all is easy. The placebo is the one that tells us anything. If filler scores the same, the words did nothing.
      - paragraph [ref=f135e232]: We write down what we expect before each run. The date goes into git history, so we cannot move it later. A guess made after the fact is not a guess.
      - heading "Who this is for" [level=2] [ref=f135e233]
      - list [ref=f135e234]:
        - listitem [ref=f135e235]: You use an AI agent and face real choices.
        - listitem [ref=f135e236]: You write agent skills and want to know if yours works.
        - listitem [ref=f135e237]: You study these tools and want the raw data.
      - heading "Who it is not for" [level=3] [ref=f135e238]
      - list [ref=f135e239]:
        - listitem [ref=f135e240]: You want a badge that says this works. There is no badge yet.
        - listitem [ref=f135e241]: You want a lookup or a bug fix. It stays off for those.
