        - paragraph [ref=f158e39]: Agent skills for making better decisions under uncertainty, plus an evaluation harness that measures whether they actually work.
        - paragraph [ref=f158e40]:
          - text: "The mark is one row of a forest plot: a line of no effect, an interval, a point estimate. The interval crosses zero, which is this repository’s position stated in the notation it argues in. It is"
          - emphasis [ref=f158e41]: we have not shown this works
          - text: ", not"
          - emphasis [ref=f158e42]: this does not work
          - text: ", and"
          - link [ref=f158e43] [cursor=pointer]:
            - /url: /decision-making-skills/scorecard/
            - code [ref=f158e44]: SCORECARD.md
          - text: exists to keep those apart.
        - blockquote [ref=f158e45]:
          - paragraph [ref=f158e46]:
            - text: "Status: pre-alpha. No skill in this repository has been validated yet. The harness is being built first, deliberately. Until a skill carries a verdict in"
            - link [ref=f158e47] [cursor=pointer]:
              - /url: /decision-making-skills/scorecard/
              - code [ref=f158e48]: SCORECARD.md
            - text: ", treat it as an untested hypothesis."
          - paragraph [ref=f158e49]:
            - link [ref=f158e50] [cursor=pointer]:
              - /url: /decision-making-skills/docs/status/
              - code [ref=f158e51]: docs/STATUS.md
            - text: "is the ledger: every run on record, what it showed, which measurements turned out to be broken, and which tracks are still untouched."
        - heading "How this is measured" [level=2] [ref=f158e52]
        - paragraph [ref=f158e53]:
          - text: "Most skill libraries ship on the author’s word that the thing helps. This one is built the other way round: the harness came first, and the claim is still"
          - code [ref=f158e54]: UNTESTED
          - text: .
        - paragraph [ref=f158e55]:
          - text: What that costs, in practice, is a set of mechanisms that make it hard to overclaim by accident. The answer key is relabelled blind by three independent model instances that never see the maintainer’s label, against a kill threshold fixed before the run. Every prediction since the convention was adopted is committed to
          - code [ref=f158e56]: notebook/
          - text: before its run, and
          - code [ref=f158e57]: de check
          - text: refuses a published run whose prediction cannot be shown by git ancestry to predate its data. Two runs predate the rule and are baselined by name in
          - link [ref=f158e58] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/results/provenance-baseline.txt
            - code [ref=f158e59]: results/provenance-baseline.txt
          - text: ", a list that may only shrink. The key carries a version stamped into every record, and comparing arms across a version boundary is refused in code. That rule exists because one correct label move raised recall on every arm on disk without a single call being re-made. Primary metrics are deterministic; a judge never produces one."
        - paragraph [ref=f158e60]: None of that is a claim that the skills work. It is the reason this repository can say they have not been shown to.
        - paragraph [ref=f158e61]:
          - link [ref=f158e62] [cursor=pointer]:
            - /url: /decision-making-skills/docs/methods/
            - code [ref=f158e63]: docs/METHODS.md
          - text: "is the full account: nine sections, each naming the technique, the failure it defends against, the code that implements it, and whether it has actually run. Several entries say it has not."
        - heading "The skill" [level=2] [ref=f158e64]
        - paragraph [ref=f158e65]:
          - text: One skill,
          - code [ref=f158e66]: decision-making
          - text: ", that routes to one of six procedures depending on what is actually hard about the decision, and reads only that one."
        - table [ref=f158e67]:
          - rowgroup [ref=f158e68]:
            - row [ref=f158e69]:
              - columnheader "What is hard" [ref=f158e70]
              - columnheader "Procedure" [ref=f158e71]
              - columnheader "What it produces" [ref=f158e72]
          - rowgroup [ref=f158e73]:
            - row [ref=f158e74]:
              - cell "A pile of context arrived and it is unclear which fact decides it (the choice itself, not what acting on it would set off)" [ref=f158e75]
              - cell [ref=f158e76]:
                - link [ref=f158e77] [cursor=pointer]:
                  - /url: /decision-making-skills/skill/decision-making/ledger/
                  - code [ref=f158e78]: ledger.md
              - cell "what bears on it, what was set aside, and why" [ref=f158e79]
            - row [ref=f158e80]:
              - cell "The advice may be generically right and wrong for this person" [ref=f158e81]
              - cell [ref=f158e82]:
                - link [ref=f158e83] [cursor=pointer]:
                  - /url: /decision-making-skills/skill/decision-making/fit/
                  - code [ref=f158e84]: fit.md
              - cell "the generic answer, and the facts that would overturn it" [ref=f158e85]
            - row [ref=f158e86]:
              - cell "The action looks fine and the worry is what it starts, or what it spends" [ref=f158e87]
              - cell [ref=f158e88]:
                - link [ref=f158e89] [cursor=pointer]:
                  - /url: /decision-making-skills/skill/decision-making/cascade/
                  - code [ref=f158e90]: cascade.md
              - cell "the chain, what it forecloses, and the order" [ref=f158e91]
            - row [ref=f158e92]:
              - cell "The direction is settled and the question is when" [ref=f158e93]
              - cell [ref=f158e94]:
                - link [ref=f158e95] [cursor=pointer]:
                  - /url: /decision-making-skills/skill/decision-making/timing/
                  - code [ref=f158e96]: timing.md
              - cell "the undo price, the real deadline, what waiting buys" [ref=f158e97]
            - row [ref=f158e98]:
              - cell "Several positions are each defensible, and whichever was argued first has the advantage" [ref=f158e99]
              - cell [ref=f158e100]:
                - link [ref=f158e101] [cursor=pointer]:
                  - /url: /decision-making-skills/skill/decision-making/council/
                  - code [ref=f158e102]: council.md
              - cell "the case for each, argued fairly, and which one survives" [ref=f158e103]
            - row [ref=f158e104]:
              - cell "Something needed to answer is missing, and it is unclear whether asking for it is worth the wait" [ref=f158e105]
              - cell [ref=f158e106]:
                - link [ref=f158e107] [cursor=pointer]:
                  - /url: /decision-making-skills/skill/decision-making/hinge/
                  - code [ref=f158e108]: hinge.md
              - cell "which gaps would change the answer, and the answer now or the one question to ask" [ref=f158e109]
        - paragraph [ref=f158e110]:
          - text: Where more than one of those six applies they run in the order ledger → fit → cascade → timing, because each supplies an input to the next.
          - code [ref=f158e111]: council.md
          - text: and
          - code [ref=f158e112]: hinge.md
          - text: are not in that chain; each runs alone. A seventh file,
          - link [ref=f158e113] [cursor=pointer]:
            - /url: /decision-making-skills/skill/decision-making/placebo/
            - code [ref=f158e114]: placebo.md
          - text: ", is the token- and structure-matched control arm; it ships alongside because a skill that only beats nothing has not been measured against the thing that would fake it."
        - heading "Installing" [level=3] [ref=f158e115]
        - paragraph [ref=f158e116]:
          - text: The skills use only the six portable frontmatter fields defined by the
          - link "Agent Skills standard" [ref=f158e117] [cursor=pointer]:
            - /url: https://agentskills.io
          - text: ", so they need no conversion."
        - code [ref=f158e119]: "# Cross-tool: Codex, Cursor, Copilot, Gemini CLI, Cline, Amp, OpenCode cp -r .agents/skills/* ~/.agents/skills/"
        - code [ref=f158e121]: "# Claude Code, project-scoped cp -r skills/* .claude/skills/"
        - paragraph [ref=f158e122]:
          - text: There is also a Claude Code plugin, and it currently ships nothing.
          - code [ref=f158e123]: plugin/skills/
          - text: is empty because a skill is copied there only once a confirmation run gives it a verdict. See
          - link [ref=f158e124] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/plugin/skills/README.md
            - code [ref=f158e125]: plugin/skills/README.md
          - text: . Copying from
          - code [ref=f158e126]: skills/
          - text: is the way to use this today.
        - paragraph [ref=f158e127]:
          - text: Nothing here is proven, and that is not a reason to avoid it. A verdict governs the
          - emphasis [ref=f158e128]: public claim
          - text: ", not whether a skill is usable."
        - heading "Why this exists" [level=2] [ref=f158e129]
        - paragraph [ref=f158e130]: "Agents fail at decisions in three separable ways:"
        - list [ref=f158e131]:
          - listitem [ref=f158e132]: Unranked context. Everything retrieved is weighted roughly equally. Tell an agent it’s raining in Paraguay while planning a trip to Lisbon and it will suggest a raincoat. The information arrived, so it must be used somehow.
          - listitem [ref=f158e133]: Uncalibrated probability. Stated confidence doesn’t track observed frequency, and RLHF makes this worse rather than better.
          - listitem [ref=f158e134]: Uniform deliberation budget. A one-way door and a trivially reversible choice get the same amount of thought.
        - paragraph [ref=f158e135]:
          - text: Plenty of prompt libraries claim to fix this. The closest prior art ships 28 thinking skills and states in its own README that none is proven to improve model accuracy. That is not an argument against skills. The published evidence says having the right skill available is worth a great deal, so it is an argument for building the feedback loop that tells you
          - emphasis [ref=f158e136]: which
          - text: ones help, and by how much.
