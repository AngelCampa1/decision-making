        - heading "What has been measured" [level=2] [ref=f158e201]
        - paragraph [ref=f158e202]:
          - text: "Nothing about whether a decision skill improves a decision. Every number on record measures something upstream of that: whether a skill"
          - emphasis [ref=f158e203]: fires
          - text: when it should, which is the question that decides whether it is worth having installed at all.
        - paragraph [ref=f158e204]:
          - text: Thirteen runs are published, each one indexed with its answer key and its prediction in
          - link [ref=f158e205] [cursor=pointer]:
            - /url: /decision-making-skills/docs/run_index/
            - code [ref=f158e206]: docs/RUN_INDEX.md
          - text: ", and"
          - link [ref=f158e207] [cursor=pointer]:
            - /url: /decision-making-skills/docs/status/
            - code [ref=f158e208]: docs/STATUS.md
          - text: has all of them with links to the data. One of the thirteen is
          - strong [ref=f158e209]: void
          - text: and answers nothing.
        - paragraph [ref=f158e210]:
          - text: The call total belongs to the ledger and is not restated here.
          - code [ref=f158e211]: docs/STATUS.md
          - text: "keeps it, corrects it by appending, and the site quotes that file rather than a second copy. Recounting means separating published records from the working checkpoints and re-scores they overlap with, which is a job for the ledger rather than a number to guess at in a README. The through-line:"
        - blockquote [ref=f158e212]:
          - paragraph [ref=f158e213]: Five independent manipulations of a skill description, covering structure, content, entry count and composition twice, and not one moved how well it discriminates. Every one moved only where it sits on the precision/recall frontier.
        - paragraph [ref=f158e214]: "Two findings worth naming here because they cut against what this repository originally claimed:"
        - list [ref=f158e215]:
          - listitem [ref=f158e216]:
            - text: Skill shadowing did not appear at four entries. One entry and four separate entries were indistinguishable on firing accuracy (0.956 vs 0.951, paired Wilcoxon p = 0.83). The
            - link "202-skill shadowing result" [ref=f158e217] [cursor=pointer]:
              - /url: https://arxiv.org/abs/2605.24050
            - text: may no longer be cited as though it reached down to four.
          - listitem [ref=f158e218]:
            - text: "The corpus behind those numbers is 89% solvable by counting words. This scopes to the version 2 answer key and the runs above it, not to everything on record: the corpus was rebuilt, and on the version 4 key the best model-free shortcut reaches 0.7054. Turn length alone separates the labels at AUC 0.850, and a bare"
            - emphasis [ref=f158e219]: “fire if ≥ 18 words”
            - text: "rule scores 0.890 with no model at all. Both sit on the version 2 answer key, against the best arm measured on that key: 0.9795 for the best description arm ("
            - code [ref=f158e220]: stakes-shown
            - text: ), 0.9863 for
            - code [ref=f158e221]: confidence
            - text: . So every result above was competing for about nine points over a ruler, and five nulls is also what a ceiling looks like. Both readings must be reported until the corpus is rebuilt, which is
            - link "Track N" [ref=f158e222] [cursor=pointer]:
              - /url: /decision-making-skills/docs/research_programme/
            - text: .
        - heading "How claims are made" [level=2] [ref=f158e223]
        - paragraph [ref=f158e224]:
          - text: "The design puts four arms on the same items:"
          - strong [ref=f158e225]: "off"
          - text: ","
          - strong [ref=f158e226]: "on"
          - text: ","
          - strong [ref=f158e227]: placebo
          - text: (token- and structure-matched filler), and
          - strong [ref=f158e228]: cot
          - text: (plain “think step by step”). A skill that beats
          - emphasis [ref=f158e229]: "off"
          - text: but not
          - emphasis [ref=f158e230]: placebo
          - text: is a length effect. A skill that doesn’t beat
          - emphasis [ref=f158e231]: cot
          - text: is an expensive way to say “think.”
        - paragraph [ref=f158e232]:
          - strong [ref=f158e233]: No published run has used the placebo or cot arm.
          - text: Every call on record is a trigger measurement comparing variants of the skill’s
          - emphasis [ref=f158e234]: description
          - text: . The four-arm comparison is what a confirmation run would do, and no confirmation run has happened, so the placebo is a written, size-checked control that has never stood in for anything.
        - paragraph [ref=f158e235]: The statistics are exact and resampling-based rather than CLT-based, because at our item counts the normal approximation isn’t reliable. Templates rather than items are the resampling unit, since items from one template are correlated. Calibration goes through the Murphy decomposition, so a “skill” that improves Brier by hedging every forecast toward the base rate is caught by the resolution term instead of being scored as a win.
        - paragraph [ref=f158e236]:
          - text: The controls, the instrument checks that run before any of it is believed, and the statistics are covered properly in
          - link [ref=f158e237] [cursor=pointer]:
            - /url: /decision-making-skills/docs/methods/
            - code [ref=f158e238]: docs/METHODS.md
          - text: §4 and §6.
        - 'heading "Pre-registration: two mechanisms, and only one of them has ever run" [level=3] [ref=f158e239]'
        - paragraph [ref=f158e240]:
          - text: This section used to describe the second as though it were the first. It read
          - emphasis [ref=f158e241]: “a confirmation run refuses to start unless the pre-registration file is committed, predates the results, and its recorded hash still matches the skill on disk”
          - text: ", in the present tense, and it pointed at a"
          - code [ref=f158e242]: preregistration/
          - text: directory that has never existed. It also told you to run
          - code [ref=f158e243]: de screen
          - text: and
          - code [ref=f158e244]: de confirm
          - text: ", neither of which is a command. The correction is"
          - link [ref=f158e245] [cursor=pointer]:
            - /url: /decision-making-skills/docs/protocol/
            - code [ref=f158e246]: docs/PROTOCOL.md
          - text: "§3, split in two:"
        - list [ref=f158e247]:
          - listitem [ref=f158e248]:
            - text: The standing mechanism, the one every run on record actually used, is a dated prediction committed to
            - link [ref=f158e249] [cursor=pointer]:
              - /url: /decision-making-skills/notebook/
              - code [ref=f158e250]: notebook/
            - emphasis [ref=f158e251]: before
            - text: the run.
            - code [ref=f158e252]: de check
            - text: enforces it, and refuses a published run whose README does not name a prediction whose first commit is an ancestor of the run’s commit.
          - listitem [ref=f158e253]:
            - text: The hash-locked refusal is built, tested, and has never run. It is scoped to the
            - code [ref=f158e254]: confirm
            - text: arena, and no confirmation run has happened. The module carries a 100% branch floor and no caller, which is why it is declared in
            - code [ref=f158e255]: "[tool.decision-evals.unwired]"
            - text: . A tested refusal that nothing calls is inert, and the gate reports green either way.
        - paragraph [ref=f158e256]:
          - text: The model calls on record were made by
          - link [ref=f158e257] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/scripts/run_triggers.py
            - code [ref=f158e258]: scripts/run_triggers.py
          - text: .
        - paragraph [ref=f158e259]:
          - text: Verdicts govern the
          - emphasis [ref=f158e260]: public claim
          - text: ", not your ability to use something. A skill that comes back"
          - code [ref=f158e261]: "NULL"
          - text: goes back to the workbench and ships as
          - code [ref=f158e262]: experimental
          - text: ": available, just not claimed as proven."
        - heading "Development" [level=2] [ref=f158e263]
        - paragraph [ref=f158e264]:
          - text: Requires Python 3.13+ and
          - link "uv" [ref=f158e265] [cursor=pointer]:
            - /url: https://docs.astral.sh/uv/
          - text: .
        - code [ref=f158e267]: uv sync --group dev
        - paragraph [ref=f158e268]:
          - text: Add
          - code [ref=f158e269]: "--group docs"
          - text: "if you will publish the site. Nothing else needs it: the staleness gate is pure Python and offline, so a contributor who never publishes still gets its refusal."
        - code [ref=f158e271]: uv sync --group dev --group docs
        - paragraph [ref=f158e272]: "Run the full local gate, which is lint, types, tests, coverage floors, and the repository-integrity checks:"
        - code [ref=f158e274]: uv run de check
        - paragraph [ref=f158e275]:
          - text: There is no cloud CI, and no workflow directory for one either.
          - code [ref=f158e276]: de check
          - text: is bound to
          - code [ref=f158e277]: pre-commit
          - text: (fast subset) and
          - code [ref=f158e278]: pre-push
          - text: (everything), so a red tree can’t be pushed. It makes no model calls; model-backed evaluation is run explicitly from
          - link [ref=f158e279] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/tree/main/scripts
            - code [ref=f158e280]: scripts/
          - text: . The website is built the same way, by hand on a machine, and pushed to
          - code [ref=f158e281]: gh-pages
          - text: by
          - code [ref=f158e282]: de site --deploy
          - text: .
        - paragraph [ref=f158e283]:
          - text: That arrangement cannot check one thing, and it is stated here rather than papered over. The site gate proves the committed build matches the current tree. It does not prove that build was ever pushed.
          - code [ref=f158e284]: de check
          - text: is offline on purpose, so it cannot consult
          - code [ref=f158e285]: origin/gh-pages
          - text: ", and a green gate beside a build that never left the machine is exactly as green as a deployed one."
