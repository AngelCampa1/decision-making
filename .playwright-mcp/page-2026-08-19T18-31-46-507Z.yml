          - heading "Hear both sides" [level=3] [ref=f159e117]
          - paragraph [ref=f159e118]: Two answers are each fair and one got argued first.
          - link "council.md" [ref=f159e119] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/council.md
        - listitem [ref=f159e120]:
          - text: "06"
          - heading "Ask or decide" [level=3] [ref=f159e121]
          - paragraph [ref=f159e122]: A fact is missing and you cannot tell if it matters.
          - link "hinge.md" [ref=f159e123] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/hinge.md
      - paragraph [ref=f159e124]: More than one can apply. Then four of them run in order, and each feeds the next.
      - paragraph [ref=f159e125]: Two is usually enough. Three means you have two choices, not one.
      - paragraph [ref=f159e126]: The last two do not join that chain. Each one runs on its own.
      - paragraph [ref=f159e127]: It also knows when to stay off. A lookup is not a choice, and neither is a bug hunt.
      - heading "Install it in one line" [level=2] [ref=f159e128]
      - paragraph [ref=f159e129]:
        - text: The files are plain markdown, so you can read them yourself. They follow the
        - link "Agent Skills" [ref=f159e130] [cursor=pointer]:
          - /url: https://agentskills.io
        - text: standard. You copy them and they work.
      - heading "Claude Code" [level=3] [ref=f159e131]
      - generic [ref=f159e132]:
        - code [ref=f159e134]: cp -r skills/* .claude/skills/
        - button "copy" [ref=f159e135] [cursor=pointer]
      - heading "Codex, Cursor, Copilot, Gemini CLI, Cline, Amp, OpenCode" [level=3] [ref=f159e136]
      - generic [ref=f159e137]:
        - code [ref=f159e139]: cp -r .agents/skills/* ~/.agents/skills/
        - button "copy" [ref=f159e140] [cursor=pointer]
      - paragraph [ref=f159e141]: There is also a Claude Code plugin. It ships nothing today. A skill goes in only after it passes a test.
      - generic [ref=f159e142]:
        - paragraph [ref=f159e143]: Before you install it
        - paragraph [ref=f159e144]: We have not shown this helps yet. It is free, and one line takes it back out.
      - heading "What we found" [level=2] [ref=f159e145]
      - paragraph [ref=f159e146]: We have made ~8,514 model calls. Every one asks the same thing. Does the skill turn on at the right time? Not one of them asks yet whether it helps you choose better.
