          - heading "Now or later" [level=3] [ref=f159e113]
          - paragraph [ref=f159e114]: You know what to do and not when.
          - link "timing.md" [ref=f159e115] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/timing.md
