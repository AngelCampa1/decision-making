      - heading "How we test" [level=2] [ref=f159e199]
      - paragraph [ref=f159e200]: Lots of people share prompt packs. Almost nobody checks if they work. So we run each skill four ways on the same questions.
      - table [ref=f159e202]:
        - rowgroup [ref=f159e203]:
          - row [ref=f159e204]:
            - columnheader "Version" [ref=f159e205]
            - columnheader "What we run" [ref=f159e206]
            - columnheader "What it tells us" [ref=f159e207]
        - rowgroup [ref=f159e208]:
          - row [ref=f159e209]:
            - cell [ref=f159e210]:
              - code [ref=f159e211]: "off"
            - cell "We take the skill away." [ref=f159e212]
            - cell "the floor" [ref=f159e213]
          - row [ref=f159e214]:
            - cell [ref=f159e215]:
              - code [ref=f159e216]: "on"
            - cell "We add the real skill." [ref=f159e217]
            - cell "the thing we care about" [ref=f159e218]
          - row [ref=f159e219]:
            - cell [ref=f159e220]:
              - code [ref=f159e221]: placebo
            - cell "Filler of the same length and shape." [ref=f159e222]
            - cell "whether the words did the work" [ref=f159e223]
          - row [ref=f159e224]:
            - cell [ref=f159e225]:
              - code [ref=f159e226]: cot
            - cell "Just \"think step by step\"." [ref=f159e227]
            - cell "whether a cheap line does the same" [ref=f159e228]
      - paragraph [ref=f159e229]: A placebo is a fake with the same shape. Beating no skill at all is easy. The placebo is the one that tells us anything. If filler scores the same, the words did nothing.
      - paragraph [ref=f159e230]: We write down what we expect before each run. The date goes into git history, so we cannot move it later. A guess made after the fact is not a guess.
      - paragraph [ref=f159e231]: We do not write the answer key either. Three copies of the model label the test set blind. None of them sees our label, or the other two. We set one rule before we ran it. If too many labels move, we throw the test set out.
      - paragraph [ref=f159e232]:
        - link "How we test, in full." [ref=f159e233] [cursor=pointer]:
          - /url: /decision-making-skills/docs/methods/
        - text: Every method, what it guards against, and whether we have actually run it. Some we have not.
      - heading "Who this is for" [level=2] [ref=f159e234]
      - list [ref=f159e235]:
        - listitem [ref=f159e236]: You use an AI agent and face real choices.
        - listitem [ref=f159e237]: You write agent skills and want to know if yours works.
        - listitem [ref=f159e238]: You study these tools and want the raw data.
      - heading "Who it is not for" [level=3] [ref=f159e239]
      - list [ref=f159e240]:
        - listitem [ref=f159e241]: You want a badge that says this works. There is no badge yet.
        - listitem [ref=f159e242]: You want a lookup or a bug fix. It stays off for those.
