      - generic [ref=f159e87]:
        - paragraph [ref=f159e88]: Where the evidence stands
        - paragraph [ref=f159e89]:
          - strong [ref=f159e90]: We have not proven this works.
          - text: No skill here has passed a real test. The scorecard is empty on purpose.
        - paragraph [ref=f159e91]: We built the measuring tools first. Every result is public. So is every time we caught our own ruler bending.
      - heading "What goes wrong now" [level=2] [ref=f159e92]
      - paragraph [ref=f159e93]: Give an agent a pile of facts and a question. It treats every fact as equal.
      - paragraph [ref=f159e94]: Tell it that it is raining in Paraguay. Then ask about a trip to Lisbon. You may get a raincoat in the answer. The fact arrived, so the agent used it.
      - paragraph [ref=f159e95]: “…and given the rain in Paraguay, pack a raincoat.”
      - paragraph [ref=f159e96]: A big choice and a small one get the same thought. That is the other half of the problem.
      - heading "Six methods. It reads one." [level=2] [ref=f159e97]
      - paragraph [ref=f159e98]: It asks one question first. What is hard here? The answer picks the method.
      - list [ref=f159e99]:
        - listitem [ref=f159e100]:
          - text: "01"
          - heading "Sort the pile" [level=3] [ref=f159e101]
          - paragraph [ref=f159e102]: Too much arrived and you cannot tell what matters.
