        - listitem [ref=f159e108]:
          - text: "03"
          - heading "Follow what it starts" [level=3] [ref=f159e109]
          - paragraph [ref=f159e110]: The move looks fine and the worry is what comes next.
          - link "cascade.md" [ref=f159e111] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/cascade.md
        - listitem [ref=f159e112]:
