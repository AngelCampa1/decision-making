        - heading "Why this exists" [level=2] [ref=e106]
        - paragraph [ref=e107]: "Agents fail at decisions in three separable ways:"
        - list [ref=e108]:
          - listitem [ref=e109]:
            - strong [ref=e110]: Unranked context.
            - text: Everything retrieved is weighted roughly equally. Tell an agent it’s raining in Paraguay while planning a trip to Lisbon and it will suggest a raincoat — the information arrived, so it must be used somehow.
          - listitem [ref=e111]:
            - strong [ref=e112]: Uncalibrated probability.
            - text: Stated confidence doesn’t track observed frequency, and RLHF makes this worse rather than better.
          - listitem [ref=e113]:
            - strong [ref=e114]: Uniform deliberation budget.
            - text: A one-way door and a trivially reversible choice get the same amount of thought.
        - paragraph [ref=e115]:
          - text: Plenty of prompt libraries claim to fix this. The closest prior art ships 28 thinking skills and states in its own README that none is proven to improve model accuracy. That is not an argument against skills — the published evidence says having the right skill available is worth a great deal — it is an argument for building the feedback loop that tells you
          - emphasis [ref=e116]: which
          - text: ones help, and by how much.
