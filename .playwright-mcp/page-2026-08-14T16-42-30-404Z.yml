        - heading "What has been measured" [level=2] [ref=e181]
        - paragraph [ref=e182]:
          - strong [ref=e183]: Nothing about whether a decision skill improves a decision.
          - text: "Every number on record measures something upstream of that: whether a skill"
          - emphasis [ref=e184]: fires
          - text: when it should, which is the question that decides whether it is worth having installed at all.
        - paragraph [ref=e185]:
          - text: About 4,240 model calls, of which 2,555 are the trigger instrument. Seven results are in —
          - link [ref=e186] [cursor=pointer]:
            - /url: /decision-making-skills/docs/status/
            - code [ref=e187]: docs/STATUS.md
          - text: "has all of them with links to the data. The through-line:"
        - blockquote [ref=e188]:
          - paragraph [ref=e189]:
            - text: Five independent manipulations of a skill description — structure, content, entry count, composition twice — and
            - strong [ref=e190]: not one moved how well it discriminates.
            - text: Every one moved only where it sits on the precision/recall frontier.
        - paragraph [ref=e191]: "Two findings worth naming here because they cut against what this repository originally claimed:"
        - list [ref=e192]:
          - listitem [ref=e193]:
            - strong [ref=e194]: Skill shadowing did not appear at four entries.
            - text: One entry and four separate entries were indistinguishable on firing accuracy (0.956 vs 0.951, paired Wilcoxon p = 0.83). The
            - link "202-skill shadowing result" [ref=e195] [cursor=pointer]:
              - /url: https://arxiv.org/abs/2605.24050
            - text: may no longer be cited as though it reached down to four.
          - listitem [ref=e196]:
            - strong [ref=e197]: The corpus behind every one of those numbers is 89% solvable by counting words.
            - text: Turn length alone separates the labels at AUC 0.850, and a bare
            - emphasis [ref=e198]: “fire if ≥ 18 words”
            - text: rule scores 0.890 with no model at all — both on the version 2 answer key, against the best arm measured on that key — 0.9795 for the best description arm (
            - code [ref=e199]: stakes-shown
            - text: ), 0.9863 for
            - code [ref=e200]: confidence
            - text: . So every result above was competing for about nine points over a ruler, and five nulls is also what a ceiling looks like. Both readings must be reported until the corpus is rebuilt, which is
            - link "Track N" [ref=e201] [cursor=pointer]:
              - /url: /decision-making-skills/docs/research_programme/
            - text: .
        - heading "How claims are made" [level=2] [ref=e202]
        - paragraph [ref=e203]:
          - text: Every skill is measured against four arms on the same items —
          - strong [ref=e204]: "off"
          - text: ","
          - strong [ref=e205]: "on"
          - text: ","
          - strong [ref=e206]: placebo
          - text: (token- and structure-matched filler), and
          - strong [ref=e207]: cot
          - text: (plain “think step by step”). A skill that beats
          - emphasis [ref=e208]: "off"
          - text: but not
          - emphasis [ref=e209]: placebo
          - text: is a length effect. A skill that doesn’t beat
          - emphasis [ref=e210]: cot
          - text: is an expensive way to say “think.”
        - paragraph [ref=e211]: The statistics are exact and resampling-based rather than CLT-based, because at our item counts the normal approximation isn’t reliable. Templates rather than items are the resampling unit, since items from one template are correlated. Calibration is reported with the Murphy decomposition, so a “skill” that improves Brier by hedging every forecast toward the base rate is caught by the resolution term instead of being scored as a win.
        - 'heading "Pre-registration: two mechanisms, and only one of them has ever run" [level=3] [ref=e212]'
        - paragraph [ref=e213]:
          - strong [ref=e214]: This section used to describe the second as though it were the first.
          - text: It read
          - emphasis [ref=e215]: “a confirmation run refuses to start unless the pre-registration file is committed, predates the results, and its recorded hash still matches the skill on disk”
          - text: — present tense, and pointed at a
          - code [ref=e216]: preregistration/
          - text: directory that has never existed. It also told you to run
          - code [ref=e217]: de screen
          - text: and
          - code [ref=e218]: de confirm
          - text: ", neither of which is a command. The correction is"
          - link [ref=e219] [cursor=pointer]:
            - /url: /decision-making-skills/docs/protocol/
            - code [ref=e220]: docs/PROTOCOL.md
          - text: "§3, split in two:"
        - list [ref=e221]:
          - listitem [ref=e222]:
            - strong [ref=e223]: "The standing mechanism, which every run on record actually used:"
            - text: a dated prediction committed to
            - link [ref=e224] [cursor=pointer]:
              - /url: /decision-making-skills/notebook/
              - code [ref=e225]: notebook/
            - emphasis [ref=e226]: before
            - text: the run. This is enforced —
            - code [ref=e227]: de check
            - text: refuses a published run whose README does not name a prediction whose first commit is an ancestor of the run’s commit.
          - listitem [ref=e228]:
            - strong [ref=e229]: The hash-locked refusal, which is built, tested, and has never run.
            - text: It is scoped to the
            - code [ref=e230]: confirm
            - text: arena, and no confirmation run has happened. The module carries a 100% branch floor and no caller, which is why it is declared in
            - code [ref=e231]: "[tool.decision-evals.unwired]"
            - text: — a tested refusal that nothing calls is inert, and the gate reports green either way.
        - paragraph [ref=e232]:
          - text: The model calls on record were made by
          - link [ref=e233] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/scripts/run_triggers.py
            - code [ref=e234]: scripts/run_triggers.py
          - text: .
        - paragraph [ref=e235]:
