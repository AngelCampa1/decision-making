          - strong [ref=f5e185]: Band 4 was the experiment and it failed.
          - text: The precision/recall frontier is intact after seven arms — a description moves where on the line the skill sits, not the line.
        - paragraph [ref=f5e186]:
          - strong [ref=f5e187]: Band 3 was unsettable and was set anyway.
          - code [ref=f5e188]: x-n22
