            - strong [ref=f5e214]: These openers are authored
            - text: ", not derived. Every earlier arm in Tracks L and M was produced by deletion or mechanical partition precisely so no result could be “the prose I happened to write”. No deletion of the shipped description produces a stakes criterion, so L7 gives that up and substitutes constraint: same middle, same exclusions, matched length, both written before either ran."
