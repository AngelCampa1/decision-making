              - code [ref=f148e218]: "on"
            - cell "We add the real skill." [ref=f148e219]
            - cell "the thing we care about" [ref=f148e220]
          - row [ref=f148e221]:
            - cell [ref=f148e222]:
              - code [ref=f148e223]: placebo
            - cell "Filler of the same length and shape." [ref=f148e224]
            - cell "whether the words did the work" [ref=f148e225]
          - row [ref=f148e226]:
            - cell [ref=f148e227]:
              - code [ref=f148e228]: cot
            - cell "Just \"think step by step\"." [ref=f148e229]
            - cell "whether a cheap line does the same" [ref=f148e230]
      - paragraph [ref=f148e231]: A placebo is a fake with the same shape. Beating no skill at all is easy. The placebo is the one that tells us anything. If filler scores the same, the words did nothing.
      - paragraph [ref=f148e232]: We write down what we expect before each run. The date goes into git history, so we cannot move it later. A guess made after the fact is not a guess.
      - heading "Who this is for" [level=2] [ref=f148e233]
      - list [ref=f148e234]:
        - listitem [ref=f148e235]: You use an AI agent and face real choices.
        - listitem [ref=f148e236]: You write agent skills and want to know if yours works.
        - listitem [ref=f148e237]: You study these tools and want the raw data.
      - heading "Who it is not for" [level=3] [ref=f148e238]
      - list [ref=f148e239]:
        - listitem [ref=f148e240]: You want a badge that says this works. There is no badge yet.
        - listitem [ref=f148e241]: You want a lookup or a bug fix. It stays off for those.
