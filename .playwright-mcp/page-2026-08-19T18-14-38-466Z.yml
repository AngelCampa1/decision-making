        - link "Read what is wrong with this" [ref=f148e200] [cursor=pointer]:
          - /url: /decision-making-skills/docs/limitations/
      - heading "How we test" [level=2] [ref=f148e201]
      - paragraph [ref=f148e202]: Lots of people share prompt packs. Almost nobody checks if they work. So we run each skill four ways on the same questions.
      - table [ref=f148e204]:
        - rowgroup [ref=f148e205]:
          - row [ref=f148e206]:
            - columnheader "Version" [ref=f148e207]
            - columnheader "What we run" [ref=f148e208]
            - columnheader "What it tells us" [ref=f148e209]
        - rowgroup [ref=f148e210]:
          - row [ref=f148e211]:
