      - paragraph [ref=e125]: More than one can apply. Then they run in order, and each one feeds the next.
      - paragraph [ref=e126]: Two is usually enough. Three means you have two choices, not one.
      - paragraph [ref=e127]: It also knows when to stay off. A lookup is not a choice. Neither is a bug hunt.
      - heading "Install it in one line" [level=2] [ref=e128]
