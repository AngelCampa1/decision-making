          - text: No skill here has passed a real test, and the scorecard is empty on purpose.
        - paragraph [ref=e92]: We built the measuring tools first. Every result is public, and so is every time we caught our own ruler bending.
      - heading "What goes wrong now" [level=2] [ref=e93]
      - paragraph [ref=e94]: Give an agent a pile of facts and a question. It treats every fact as equal.
      - paragraph [ref=e95]: Tell it that it is raining in Paraguay. Then ask about a trip to Lisbon. You may get a raincoat in the answer. The fact arrived, so the agent used it.
      - paragraph [ref=e96]: “…and given the rain in Paraguay, pack a raincoat.”
      - paragraph [ref=e97]: A big choice and a small one get the same thought. That is the other half of the problem.
      - heading "Six methods. It reads one." [level=2] [ref=e98]
      - paragraph [ref=e99]: It asks one question first. What is hard here? The answer picks the method.
