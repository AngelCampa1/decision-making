        - link "Read what is wrong with this" [ref=f5e198] [cursor=pointer]:
          - /url: /decision-making-skills/docs/limitations/
      - heading "How we test" [level=2] [ref=f5e199]
      - paragraph [ref=f5e200]: Lots of people share prompt packs. Almost nobody checks if they work. So we run each skill four ways on the same questions.
      - table [ref=f5e202]:
        - rowgroup [ref=f5e203]:
          - row [ref=f5e204]:
            - columnheader "Version" [ref=f5e205]
