              - code [ref=f5e221]: placebo
            - cell "Filler of the same length and shape." [ref=f5e222]
            - cell "whether the words did the work" [ref=f5e223]
          - row [ref=f5e224]:
            - cell [ref=f5e225]:
              - code [ref=f5e226]: cot
            - cell "Just \"think step by step\"." [ref=f5e227]
            - cell "whether a cheap line does the same" [ref=f5e228]
      - paragraph [ref=f5e229]: A placebo is a fake with the same shape. Beating no skill at all is easy. The placebo is the real test. If filler scores the same, the words did the work.
      - paragraph [ref=f5e230]: We write down what we expect before each run. The date goes into git history, so we cannot move it later. A guess made after the fact is not a guess.
      - heading "Who this is for" [level=2] [ref=f5e231]
      - list [ref=f5e232]:
        - listitem [ref=f5e233]: You use an AI agent and face real choices.
        - listitem [ref=f5e234]: You write agent skills and want to know if yours works.
        - listitem [ref=f5e235]: You study these tools and want the raw data.
      - heading "Who it is not for" [level=3] [ref=f5e236]
      - list [ref=f5e237]:
        - listitem [ref=f5e238]: You want a badge that says this works. There is no badge yet.
        - listitem [ref=f5e239]: You want a lookup or a bug fix. It stays off for those.
