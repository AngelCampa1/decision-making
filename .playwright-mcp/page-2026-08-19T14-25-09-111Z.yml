        - paragraph [ref=f5e89]: Where the evidence stands
        - paragraph [ref=f5e90]:
          - strong [ref=f5e91]: We have not proven this works.
          - text: No skill here has passed a real test, and the scorecard is empty on purpose.
        - paragraph [ref=f5e92]: We built the measuring tools first. Every result is public, and so is every time we caught our own ruler bending.
      - heading "What goes wrong now" [level=2] [ref=f5e93]
      - paragraph [ref=f5e94]: Give an agent a pile of facts and a question. It treats every fact as equal.
      - paragraph [ref=f5e95]: Tell it that it is raining in Paraguay. Then ask about a trip to Lisbon. You may get a raincoat in the answer. The fact arrived, so the agent used it.
      - paragraph [ref=f5e96]: “…and given the rain in Paraguay, pack a raincoat.”
      - paragraph [ref=f5e97]: A big choice and a small one get the same thought. That is the other half of the problem.
      - heading "Six methods. It reads one." [level=2] [ref=f5e98]
      - paragraph [ref=f5e99]: It asks one question first. What is hard here? The answer picks the method.
      - list [ref=f5e100]:
        - listitem [ref=f5e101]:
          - text: "01"
          - heading "Sort the pile" [level=3] [ref=f5e102]
          - paragraph [ref=f5e103]: Too much arrived and you cannot tell what matters.
          - link "ledger.md" [ref=f5e104] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/ledger.md
        - listitem [ref=f5e105]:
          - text: "02"
          - heading "Check it fits you" [level=3] [ref=f5e106]
          - paragraph [ref=f5e107]: The advice is right in general and may be wrong for you.
          - link "fit.md" [ref=f5e108] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/fit.md
        - listitem [ref=f5e109]:
          - text: "03"
          - heading "Follow what it starts" [level=3] [ref=f5e110]
          - paragraph [ref=f5e111]: The move looks fine and the worry is what comes next.
          - link "cascade.md" [ref=f5e112] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/cascade.md
        - listitem [ref=f5e113]:
          - text: "04"
          - heading "Now or later" [level=3] [ref=f5e114]
          - paragraph [ref=f5e115]: You know what to do and not when.
          - link "timing.md" [ref=f5e116] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/timing.md
        - listitem [ref=f5e117]:
          - text: "05"
          - heading "Hear both sides" [level=3] [ref=f5e118]
          - paragraph [ref=f5e119]: Two answers are each fair and one got argued first.
          - link "council.md" [ref=f5e120] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/council.md
        - listitem [ref=f5e121]:
          - text: "06"
          - heading "Ask or decide" [level=3] [ref=f5e122]
          - paragraph [ref=f5e123]: A fact is missing and you cannot tell if it matters.
          - link "hinge.md" [ref=f5e124] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/hinge.md
      - paragraph [ref=f5e125]: More than one can apply. Then they run in order, and each one feeds the next.
      - paragraph [ref=f5e126]: Two is usually enough. Three means you have two choices, not one.
      - paragraph [ref=f5e127]: It also knows when to stay off. A lookup is not a choice. Neither is a bug hunt.
      - heading "Install it in one line" [level=2] [ref=f5e128]
      - paragraph [ref=f5e129]:
        - text: The files are plain markdown, which is text you can read yourself. They follow the
        - link "Agent Skills" [ref=f5e130] [cursor=pointer]:
          - /url: https://agentskills.io
        - text: standard. Nothing to build and nothing to convert.
      - heading "Claude Code" [level=3] [ref=f5e131]
      - generic [ref=f5e132]:
        - code [ref=f5e134]: cp -r skills/* .claude/skills/
        - button "copy" [ref=f5e135] [cursor=pointer]
      - heading "Codex, Cursor, Copilot, Gemini CLI, Cline, Amp, OpenCode" [level=3] [ref=f5e136]
      - generic [ref=f5e137]:
        - code [ref=f5e139]: cp -r .agents/skills/* ~/.agents/skills/
        - button "copy" [ref=f5e140] [cursor=pointer]
      - paragraph [ref=f5e141]: There is also a Claude Code plugin. It ships nothing today. A skill goes in only after it passes a test.
      - generic [ref=f5e142]:
        - paragraph [ref=f5e143]: Before you install it
        - paragraph [ref=f5e144]: We have not shown this helps yet. It is free, and one line takes it back out.
      - heading "What we found" [level=2] [ref=f5e145]
      - paragraph [ref=f5e146]: We have made ~8,550 model calls. They all ask one thing. Does the skill turn on at the right time? None of them ask yet whether it helps you choose better.
      - figure "Does the skill turn on when it should? Firing accuracy by how the skill describes itself. 258 questions, haiku." [ref=f5e147]:
