      - generic [ref=f137e136]:
        - code [ref=f137e138]: cp -r .agents/skills/* ~/.agents/skills/
        - button "copy" [ref=f137e139] [cursor=pointer]
      - paragraph [ref=f137e140]: There is also a Claude Code plugin. It ships nothing today. A skill goes in only after it passes a test.
