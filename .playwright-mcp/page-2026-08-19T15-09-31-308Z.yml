      - generic [ref=f137e87]:
        - paragraph [ref=f137e88]: Where the evidence stands
        - paragraph [ref=f137e89]:
          - strong [ref=f137e90]: We have not proven this works.
          - text: No skill here has passed a real test. The scorecard is empty on purpose.
        - paragraph [ref=f137e91]: We built the measuring tools first. Every result is public. So is every time we caught our own ruler bending.
      - heading "What goes wrong now" [level=2] [ref=f137e92]
      - paragraph [ref=f137e93]: Give an agent a pile of facts and a question. It treats every fact as equal.
      - paragraph [ref=f137e94]: Tell it that it is raining in Paraguay. Then ask about a trip to Lisbon. You may get a raincoat in the answer. The fact arrived, so the agent used it.
      - paragraph [ref=f137e95]: “…and given the rain in Paraguay, pack a raincoat.”
      - paragraph [ref=f137e96]: A big choice and a small one get the same thought. That is the other half of the problem.
      - heading "Six methods. It reads one." [level=2] [ref=f137e97]
      - paragraph [ref=f137e98]: It asks one question first. What is hard here? The answer picks the method.
      - list [ref=f137e99]:
        - listitem [ref=f137e100]:
          - text: "01"
          - heading "Sort the pile" [level=3] [ref=f137e101]
