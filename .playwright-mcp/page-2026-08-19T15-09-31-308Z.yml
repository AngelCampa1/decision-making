        - listitem [ref=f137e120]:
          - text: "06"
          - heading "Ask or decide" [level=3] [ref=f137e121]
          - paragraph [ref=f137e122]: A fact is missing and you cannot tell if it matters.
          - link "hinge.md" [ref=f137e123] [cursor=pointer]:
            - /url: https://github.com/AngelCampa1/decision-making-skills/blob/main/skills/decision-making/hinge.md
      - paragraph [ref=f137e124]: More than one can apply. Then they run in order, and each feeds the next.
      - paragraph [ref=f137e125]: Two is usually enough. Three means you have two choices, not one.
      - paragraph [ref=f137e126]: It also knows when to stay off. A lookup is not a choice, and neither is a bug hunt.
      - heading "Install it in one line" [level=2] [ref=f137e127]
      - paragraph [ref=f137e128]:
        - text: The files are plain markdown, so you can read them yourself. They follow the
        - link "Agent Skills" [ref=f137e129] [cursor=pointer]:
          - /url: https://agentskills.io
        - text: standard. You copy them and they work.
      - heading "Claude Code" [level=3] [ref=f137e130]
      - generic [ref=f137e131]:
        - code [ref=f137e133]: cp -r skills/* .claude/skills/
        - button "copy" [ref=f137e134] [cursor=pointer]
