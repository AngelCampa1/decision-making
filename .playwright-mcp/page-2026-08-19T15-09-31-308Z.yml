              - code [ref=f137e225]: cot
            - cell "Just \"think step by step\"." [ref=f137e226]
            - cell "whether a cheap line does the same" [ref=f137e227]
      - paragraph [ref=f137e228]: A placebo is a fake with the same shape. Beating no skill at all is easy. The placebo is the one that tells us anything. If filler scores the same, the words did nothing.
      - paragraph [ref=f137e229]: We write down what we expect before each run. The date goes into git history, so we cannot move it later. A guess made after the fact is not a guess.
      - heading "Who this is for" [level=2] [ref=f137e230]
      - list [ref=f137e231]:
        - listitem [ref=f137e232]: You use an AI agent and face real choices.
        - listitem [ref=f137e233]: You write agent skills and want to know if yours works.
        - listitem [ref=f137e234]: You study these tools and want the raw data.
      - heading "Who it is not for" [level=3] [ref=f137e235]
      - list [ref=f137e236]:
        - listitem [ref=f137e237]: You want a badge that says this works. There is no badge yet.
        - listitem [ref=f137e238]: You want a lookup or a bug fix. It stays off for those.
