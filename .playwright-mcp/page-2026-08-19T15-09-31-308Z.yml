      - heading "How we test" [level=2] [ref=f137e198]
      - paragraph [ref=f137e199]: Lots of people share prompt packs. Almost nobody checks if they work. So we run each skill four ways on the same questions.
      - table [ref=f137e201]:
        - rowgroup [ref=f137e202]:
