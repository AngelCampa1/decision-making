            - strong [ref=f11e1843]: Non-negotiable, and here is why, so that a future editor cannot remove it without reading the reason.
            - text: The matched non-governing arm is the third of three files and it will look like the cheapest thing to cut when the grid is too large — it is the arm where, by design,
            - emphasis [ref=f11e1844]: nothing is supposed to happen
            - text: ". Cutting it does not shrink the metric, it destroys it, and what remains is a flip-rate that reports a perfect score for a model that flips on everything. The failure is silent: the number still computes and still looks reasonable. The same applies to the elicited-quantity primary below. Neither may be dropped “to save a stratum” or “to trim the grid”."
        - paragraph [ref=f11e1845]: The primary is an elicited quantity (months of runway, a threshold, a notice period), not a flip, because flip-rate scores conditional advice — the best available answer — as failure.
        - paragraph [ref=f11e1846]:
          - strong [ref=f11e1847]: The construct has a name and a literature, and Track H should use them — found 2026-08-12, Track K second pass.
          - text: What the triplet measures is
          - strong [ref=f11e1848]: informed values-congruent choice
          - text: ": does the choice match what"
          - emphasis [ref=f11e1849]: this person
          - text: actually values, given that they understand the options. That is not a coinage here. It is a validated outcome in the patient decision aids literature, where a 2024 Cochrane review of
          - strong [ref=f11e1850]: 209 RCTs and 107,698 participants
          - text: reports
          - strong [ref=f11e1851]: RR 1.75 (CI 1.44–2.13) across 21 trials
          - text: ", moderate certainty — alongside high-certainty effects on knowledge, accurate risk perception and decisional conflict. See"
          - link [ref=f11e1852] [cursor=pointer]:
            - /url: /decision-making-skills/docs/decision_frameworks/
            - code [ref=f11e1853]: DECISION_FRAMEWORKS.md
          - text: row 12.
        - paragraph [ref=f11e1854]:
          - text: "So:"
          - strong [ref=f11e1855]: adopt the name and the construct, do not import the effect size.
          - text: Those are health treatment and screening decisions, delivered to patients around a clinical consultation by a static tool; nothing licenses transferring RR 1.75 to an LLM answering a question about a job offer. What it buys is that Track H’s primary stops being a metric invented here to escape flip-rate, and becomes an operationalisation of a construct with thirty years of instrument development behind it — including the
          - emphasis [ref=f11e1856]: decisional conflict
          - text: scale, which measures whether someone feels able to choose and is the nearest published thing to what a decision skill is actually for.
        - paragraph [ref=f11e1857]:
