            - row [ref=f11e358]:
              - cell "K1" [ref=f11e359]
              - 'cell "Review the normative and applied decision literature: decision analysis and expected value, reference-class forecasting and base rates, calibration training, pre-mortems, Kepner-Tregoe, WRAP, OODA, satisficing vs maximising, option value and reversibility, dominance and elimination-by-aspects. One page each: what it claims, what evidence supports it, what it costs to run." [ref=f11e360]'
            - row [ref=f11e361]:
              - cell "K2" [ref=f11e362]
              - cell [ref=f11e363]:
                - text: Review the
                - emphasis [ref=f11e364]: prescriptive
                - text: evidence — which of these actually improve human decisions in trials, not which are popular. Many are folklore with a book attached, and the write-up must say which.
