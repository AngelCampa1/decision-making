          - text: contains exactly one function,
          - code [ref=f11e1033]: benjamini_hochberg
          - text: . BH controls the false discovery
          - emphasis [ref=f11e1034]: rate
          - text: among rejections; it does nothing about the magnitude bias of a selected maximum. There is no shrinkage, no selective or conditional inference, and no holdout re-estimation helper anywhere in
          - code [ref=f11e1035]: stats/
          - text: . An earlier draft cited the module here as though it addressed this, which misrepresented readiness in the programme’s most active track.
        - paragraph [ref=f11e1036]:
          - strong [ref=f11e1037]: Holdout re-estimation is therefore the only control in this design, and the holdout estimate — not the discovery-set estimate — is the number reported.
