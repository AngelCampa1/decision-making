        - paragraph [ref=f11e1023]:
          - strong [ref=f11e1024]: L6 is the one that changes what the skills are.
          - text: "SkillRevise describes expert-authored skills as costly and misaligned with how models actually execute, and one-shot LLM-generated skills as “syntactically correct but behaviorally weak.” Every skill in this repository is one-shot LLM-generated. The loop is: run on held-out items → read every failure → make one execution-anchored edit → re-run → keep it only if it verifies."
        - paragraph [ref=f11e1025]:
          - strong [ref=f11e1026]: The overfitting guard is not optional here.
          - text: Revising a skill against traces from the items you then evaluate it on is fitting the test set, and it would produce a large, real, meaningless number. Revision traces come from one item pool and the verdict comes from another, drawn before revision starts and not looked at until the end.
        - paragraph [ref=f11e1027]:
