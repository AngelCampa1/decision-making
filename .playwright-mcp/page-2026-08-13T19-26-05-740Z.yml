          - text: .
        - paragraph [ref=f11e415]:
          - strong [ref=f11e416]: The pre-mortem’s famous “30%” is a count of reasons generated, not a measure of decision quality.
          - text: Mitchell, Russo & Pennington did not assess the quality of the reasons. So
          - emphasis [ref=f11e417]: a procedure that makes a model produce more considerations is not thereby a procedure that makes it decide better
          - text: — and more considerations is precisely what a structured skill most easily produces and what a careless metric most easily rewards. This is the same conflation that already bit probe-07 from the other direction.
        - paragraph [ref=f11e418]:
          - strong [ref=f11e419]: The best-evidenced framework in the table is under active challenge.
          - text: Hauenstein et al. (2025,
          - emphasis [ref=f11e420]: Psychological Science
          - text: ) re-analysed the Good Judgment Project under IRT and concluded the training and teaming effects may not be real. Calibration training is still the strongest candidate
          - emphasis [ref=f11e421]: and
          - text: is one re-analysis away from the rest.
        - paragraph [ref=f11e422]:
          - strong [ref=f11e423]: Calibration has no counterpart among the four shipped procedures.
          - text: Nothing in
          - code [ref=f11e424]: decision-making
          - text: elicits a probability, so nothing can be scored for calibration — while
          - code [ref=f11e425]: stats/calibration.py
          - text: is property-tested at 100% coverage and has never been called. That makes
          - strong [ref=f11e426]: elicited confidence the top-ranked skill candidate
          - text: ": the only one whose parent intervention has medium-to-large controlled effects in humans, it needs no new corpus, and it converts a list of considerations into a number that can be scored."
