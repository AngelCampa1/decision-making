        - paragraph [ref=f11e2001]:
          - strong [ref=f11e2002]: 0. The process measure moves and the outcome measure does not — and this has already happened to someone else, at scale.
          - text: Agweyu et al. (2026,
          - emphasis [ref=f11e2003]: Nature Medicine
          - text: ) cluster-randomized 103 clinical officers across 16 Kenyan primary care facilities over 9,691 patients. LLM assistance raised note quality across every domain and drove appropriate diagnosis to aOR 1.74 (p < 0.001). Treatment failure was 2.2% against 2.0%, aOR 0.77,
          - strong [ref=f11e2004]: p = 0.13
          - text: . The intervention visibly changed how the work was written down and did not change what happened to the patients.
        - paragraph [ref=f11e2005]:
          - strong [ref=f11e2006]: That is the shape of every result this repository has produced.
          - text: M4, M5 and L5 each moved where the skill sits on a precision/recall frontier and none moved how well it discriminates; the probe casefiles took 0 of 27 traps;
          - code [ref=f11e2007]: math
