          - text: 0.000. Two independent lines of evidence now point the same way.
        - paragraph [ref=f11e2009]:
          - strong [ref=f11e2010]: And a competing explanation for the trigger half of that, found 2026-08-13.
          - text: The corpus those nulls were measured on is solved to 0.890 by counting words on the version 2 key, against 0.9795 to 0.9863 for the best arm on the same key. A flat result is what a real null looks like
          - emphasis [ref=f11e2011]: and
