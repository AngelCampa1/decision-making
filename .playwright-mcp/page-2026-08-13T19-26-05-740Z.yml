          - listitem [ref=f11e403]:
            - strong [ref=f11e404]: Xu & Wu is 30 tasks and 2 models, not “86 tasks, 11 domains”.
            - text: That was SkillsBench’s scale, misremembered — and SkillsBench is 87 tasks and 8 domains, so both halves were wrong, in the direction that made the smaller paper look larger. The
