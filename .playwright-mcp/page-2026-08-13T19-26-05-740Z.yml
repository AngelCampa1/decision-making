          - listitem [ref=f11e408]:
            - strong [ref=f11e409]: The 30–50% context-rot figure is not in arXiv:2606.29718.
            - text: Not in the abstract, not in the PDF, not in any secondary summary. That paper establishes
            - emphasis [ref=f11e410]: premature termination
            - text: — models giving up before the window is full, at a rate rising with context length — and its own headline number is a 2.6–4.9% gain from filtering. The figure was load-bearing for Track G’s entire premise, which now says so.
        - paragraph [ref=f11e411]:
          - text: "Neither is a defect a presence check finds: both identifiers resolve and both papers are on the subject they were cited for. And neither was caught by the gate, because both were"
