          - text: "This is the repository’s cardinal error, stated plainly: three corpora were built to fix a failure that was never shown to exist here. A skill cannot help with a failure that does not occur. Track A is cheap — roughly 1,200 calls, a few hours of wall clock — and it can kill or redirect everything downstream before a single document is authored."
