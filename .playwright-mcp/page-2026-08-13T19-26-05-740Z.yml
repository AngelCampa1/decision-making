          - strong [ref=f11e2012]: Track N
          - text: measures it. Until it lands, “nothing about a description changes discrimination” is one of two live readings rather than the finding — which is the more important correction, because the sentence had already been written down as though it were settled.
        - paragraph [ref=f11e2013]:
          - text: "So the rule for Tracks C through F:"
          - strong [ref=f11e2014]: name the outcome measure and the process measure separately in the pre-registration, and state in advance that a process gain with a flat outcome is a null for the skill, not a partial win.
          - text: Writing that after the run is how “the model produced a more thorough answer” becomes a finding. The counterweight is Goh et al. (2024) — +6.5pp on management reasoning, +6.2pp on the case-specific domains — which is a process measure with an expert rubric behind it and is the strongest located evidence for Track H. Both are in
