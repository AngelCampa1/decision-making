        - paragraph [ref=f11e342]: Free, no instrument, and it changes what everything else is testing. Runs first.
        - 'heading "Track K — Decision frameworks: the review this project skipped" [level=3] [ref=f11e343]'
        - paragraph [ref=f11e344]:
          - strong [ref=f11e345]: Question.
          - text: What is already known about how to make good decisions, and which of it can be written down as a skill?
        - paragraph [ref=f11e346]:
          - strong [ref=f11e347]: Why it matters.
          - text: The founding brief asked for research on
          - emphasis [ref=f11e348]: decision making
          - text: before any direction was chosen — “how to make great decisions.” Every skill in this repository was instead invented from first principles by a model. That is precisely the “skills based on really nothing” the brief warned against, and SkillsBench’s finding that
          - strong [ref=f11e349]: self-generated skills yield negligible or negative gains while curated ones yield +16.6pp
          - text: is the same warning with a number on it.
        - paragraph [ref=f11e350]:
          - text: This track runs
          - strong [ref=f11e351]: first
