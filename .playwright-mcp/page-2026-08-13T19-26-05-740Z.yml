          - text: library whose own README declines to claim an accuracy gain and reports one provisional result below its own utility margin. Track M4 is extrapolating from 202 skills down towards four; 28 is the only point anyone has in between, and it comes with an installer who abandoned it.
        - 'heading "Track M — Skill design: how a skill should be built" [level=3] [ref=f11e438]'
        - blockquote [ref=f11e439]:
          - paragraph [ref=f11e440]:
            - strong [ref=f11e441]: The same caveat as Track L, and it lands harder here.
            - text: M4, M5, M6 and M6b each found no effect on firing accuracy, and the headline reading is that structure, count and composition do not change discrimination. On a corpus a ruler solves at 0.890 there were about nine points to move — the ruler and the best arm on the same key, 0.9795 to 0.9863.
            - strong [ref=f11e442]: Four nulls with nine points of headroom is not the same evidence as four nulls with fifty
            - text: ", and this document reported it as though it were."
            - strong [ref=f11e443]: Track N
            - text: is the fix; the M results stand as internally valid comparisons and as nothing more until it lands.
        - paragraph [ref=f11e444]:
          - strong [ref=f11e445]: Question.
          - text: Given content worth having, what is the right
          - emphasis [ref=f11e446]: shape
          - text: to put it in — one skill or several, how long, how bundled, how described?
        - paragraph [ref=f11e447]:
          - strong [ref=f11e448]: Why it matters.
          - text: This is a separate question from
          - emphasis [ref=f11e449]: what the skill says
          - text: ", and the evidence says it may matter more. The repository shipped four decision skills on 2026-08-11 and consolidated them into one the same day, because the research below says four overlapping descriptions is a known failure rather than a richer offering."
