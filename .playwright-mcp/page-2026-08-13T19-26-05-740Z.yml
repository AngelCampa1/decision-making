        - paragraph [ref=f11e1513]: The turn-count spread is the part that changes a design. A corpus running 3 to 12 turns is not a fixed-length instrument, so any per-item comparison has to carry turn count as a covariate rather than assume it away — and A2, which holds total turns fixed while moving a fact, cannot simply reuse A1’s items.
