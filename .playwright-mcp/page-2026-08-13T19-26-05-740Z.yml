        - paragraph [ref=f11e896]:
          - strong [ref=f11e897]: Why it matters.
          - text: The brief asked to test “different types of skills and variations, finding the most optimal one.” The current design compares one skill against control, placebo and chain-of-thought — it never compares
          - strong [ref=f11e898]: skill A against skill B for the same job
          - text: . Without that there is no basis for saying a skill is good, only that it is better than nothing.
        - paragraph [ref=f11e899]:
          - strong [ref=f11e900]: The axes are not equally worth running, and the priors say so.
          - text: Attaching a published prior to each one before spending anything is the difference between a horse race and a fishing trip.
