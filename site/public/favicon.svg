<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <style>
    :root { --i:#262320; --a:#a8a092; --p:#7a3e12; }
    @media (prefers-color-scheme: dark) {
      :root { --i:#e6e1d7; --a:#6b665c; --p:#e0a06a; }
    }
  </style>
  <!-- Rects, not strokes: a stroke centred on a half-pixel is a blurred
       favicon. Every edge lands on an integer, and the row sums to exactly 16:
       1 margin | 2 cap | 1 gap | 1 zero | 2 gap | 4 estimate | 2 gap | 2 cap | 1 margin
       The zero rule runs full bleed while the caps span only y=4..12, which is
       what keeps the 1px gap between them legible at this size. -->
  <rect x="4" y="0" width="1" height="16" fill="var(--a)"/>
  <rect x="1" y="7" width="14" height="2" fill="var(--i)"/>
  <rect x="1" y="4" width="2" height="8" fill="var(--i)"/>
  <rect x="13" y="4" width="2" height="8" fill="var(--i)"/>
  <rect x="7" y="6" width="4" height="4" fill="var(--p)"/>
</svg>
